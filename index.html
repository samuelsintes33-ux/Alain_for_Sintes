function saveDebtAdjustment(clientId){
  const amount = parseFloat(document.getElementById('adjAmount').value)||0;
  if(amount<=0) return toast('Escribe un monto válido');
  const note = document.getElementById('adjNote').value.trim();
  const signed = amount * (window._debtAdjSign||1);
  DB.clientDebtAdjustments.push({id:uid(), clientId, amount:signed, note, date:new Date().toISOString(), createdAt:new Date().toISOString()});
  save();
  ui.closePicker();
  openClientDetail(clientId);
}

function viewClientsScreen(){
  window._clientsQuery = window._clientsQuery || '';
  return `<div class="searchbar">
      <span class="sic">🔎</span>
      <input type="text" value="${esc(window._clientsQuery)}" placeholder="Buscar por nombre o teléfono..." oninput="window._clientsQuery=this.value; renderClientsList()">
    </div>
    <div id="clientsListWrap">${clientsListHTML()}</div>`;
}
function clientsListHTML(){
  const q = (window._clientsQuery||'').trim().toLowerCase();
  let list = DB.clients.slice();
  if(q) list = list.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(q));
  list.sort((a,b)=>a.name.localeCompare(b.name));
  if(!list.length){ return `<div class="empty"><div class="eic">👤</div><div class="et">Sin clientes registrados todavía</div><div class="ed">Toca + para agregar el primero.</div></div>`; }
  return `<div class="card">` + list.map(c=>{
    const debt = clientDebt(c.id);
    return `<div class="list-item" style="cursor:pointer" onclick="openClientDetail('${c.id}')">
      <div class="thumb">👤</div>
      <div class="li-body"><div class="li-title">${esc(c.name)}</div><div class="li-sub">${esc(c.phone||'Sin teléfono')}</div></div>
      <div class="li-right">${debt>0?`<div class="mono small" style="color:var(--danger);font-weight:800">Debe ${fmt(debt)}</div>`:`<div class="small muted">Al día</div>`}</div>
    </div>`;
  }).join('') + `</div>`;
}
function renderClientsList(){
  const wrap = document.getElementById('clientsListWrap');
  if(!wrap) return;
  wrap.innerHTML = clientsListHTML();
}

function openClientForm(id, onSave){
  const c = id ? DB.clients.find(c=>c.id===id) : null;
  window._clientFormOnSave = onSave || null;
  window._clientFormEditId = id || null;
  ui.openPicker(`
    <div class="sheet-header"><div class="sheet-title">${c?'Editar cliente':'Nuevo cliente'}</div><button class="sheet-close" onclick="ui.closePicker()">✕</button></div>
    ${(!c && supportsContactPicker())?`<button class="btn btn-outline btn-block mb-2" onclick="pickClientFromContacts()">📇 Elegir de mis contactos</button>`:''}
    <div class="field"><label>Nombre</label><input type="text" id="cfName" value="${c?esc(c.name):''}" placeholder="Nombre del cliente"></div>
    <div class="field"><label>Teléfono</label><input type="text" id="cfPhone" value="${c?esc(c.phone||''):''}" placeholder="Ej. +53 5555-1234">
      <div class="small muted mt-2" style="margin-bottom:0">Incluye el código de país (ej. +53) para que el acceso directo a WhatsApp funcione bien.</div>
    </div>
    <div class="field"><label>Descripción</label><textarea id="cfDesc" rows="2" placeholder="Notas sobre el cliente (opcional)">${c?esc(c.desc||''):''}</textarea></div>
    <button class="btn btn-primary btn-block" onclick="saveClientForm()">Guardar cliente</button>
    ${c?`<button class="btn btn-outline btn-block mt-2" style="color:var(--danger)" onclick="removeClient('${c.id}')">Eliminar cliente</button>`:''}
  `);
  setTimeout(()=>{ const i=document.getElementById('cfName'); if(i) i.focus(); }, 150);
}
function removeOrder(id){
  if(!confirm('¿Eliminar este pedido?')) return;
  DB.orders = DB.orders.filter(x=>x.id!==id);
  if(app.userId){
    sb.from('orders').delete().eq('id', id).then(({error})=>{
      if(error) console.error('No se pudo borrar el pedido en la nube', error);
    });
  }
  const set = _syncedIds['orders']; if(set) set.delete(id);
  save(); ui.closeSheet(); renderView();
}
function removeClient(id){
  if(!confirm('¿Eliminar este cliente? No se borra su historial de ventas.')) return;
  DB.clients = DB.clients.filter(x=>x.id!==id);
  // Borrado explícito y puntual en la nube — acción directa del usuario sobre un registro
  // concreto, igual que removeReminder. No depende de ningún borrado automático por diferencia.
  if(app.userId){
    sb.from('clients').delete().eq('id', id).then(({error})=>{
      if(error) console.error('No se pudo borrar el cliente en la nube', error);
    });
  }
  const set = _syncedIds['clients']; if(set) set.delete(id);
  save(); ui.closePicker(); ui.closeSheet();
}
function supportsContactPicker(){
  return ('contacts' in navigator) && ('ContactsManager' in window);
}
async function pickClientFromContacts(){
  if(!supportsContactPicker()){ toast('Tu navegador no admite elegir contactos directamente'); return; }
  try{
    const props = ['name','tel'];
    const opts = {multiple:false};
    const contacts = await navigator.contacts.select(props, opts);
    if(!contacts || !contacts.length) return;
    const c = contacts[0];
    const nameInput = document.getElementById('cfName');
    const phoneInput = document.getElementById('cfPhone');
    if(nameInput && c.name && c.name.length) nameInput.value = c.name[0];
    if(phoneInput && c.tel && c.tel.length) phoneInput.value = c.tel[0];
    toast('Datos del contacto cargados');
  }catch(e){
    // El usuario canceló el selector, o el permiso fue denegado — no hace falta avisar con error
  }
}
function saveClientForm(){
  const name = document.getElementById('cfName').value.trim();
  if(!name) return toast('Escribe el nombre del cliente');
  const phone = document.getElementById('cfPhone').value.trim();
  const desc = document.getElementById('cfDesc').value.trim();
  let c;
  if(window._clientFormEditId){
    c = DB.clients.find(x=>x.id===window._clientFormEditId);
    c.name = name; c.phone = phone; c.desc = desc;
  } else {
    c = {id:uid(), name, phone, desc, createdAt:new Date().toISOString()};
    DB.clients.push(c);
  }
  save();
  ui.closePicker();
  toast(window._clientFormEditId ? 'Cliente actualizado' : 'Cliente agregado');
  const cb = window._clientFormOnSave;
  if(cb) cb(c);
  else if(document.getElementById('clientsListWrap')) renderClientsList();
  else if(window._clientDetailId===c.id) openClientDetail(c.id);
}

function openClientDetail(id){
  window._clientDetailId = id;
  const c = DB.clients.find(c=>c.id===id);
  if(!c) return;
  const debt = clientDebt(id);

  // Combinar ventas y pagos en un solo historial, más reciente primero
  const salesTx = DB.sales.filter(s=>s.clientId===id).map(s=>({
    kind:'sale', date:s.date, sale:s
  }));
  const paymentTx = DB.clientPayments.filter(p=>p.clientId===id).map(p=>({
    kind:'payment', date:p.date, payment:p
  }));
  const consignSaleTx = (DB.clientSales||[]).filter(s=>s.clientId===id).map(s=>({
    kind:'consignSale', date:s.date, csale:s
  }));
  const depositTx = (DB.consignments||[]).filter(c=>c.clientId===id).map(c=>({
    kind:'deposit', date:c.date, deposit:c
  }));
  const returnTx = (DB.clientReturns||[]).filter(r=>r.clientId===id).map(r=>({
    kind:'return', date:r.date, ret:r
  }));
  const adjTx = (DB.clientDebtAdjustments||[]).filter(a=>a.clientId===id).map(a=>({
    kind:'adjustment', date:a.date, adj:a
  }));
  const tx = salesTx.concat(paymentTx, consignSaleTx, depositTx, returnTx, adjTx).sort((a,b)=> new Date(b.date) - new Date(a.date));

  // Agrupar por mes
  const groups = {};
  const order = [];
  tx.forEach(t=>{
    const d = new Date(t.date);
    const key = d.toLocaleDateString('es-MX', {month:'long', year:'numeric'});
    if(!groups[key]){ groups[key]=[]; order.push(key); }
    groups[key].push(t);
  });

  let historyHtml = '';
  if(!tx.length){
    historyHtml = `<div class="small muted" style="padding:8px 0">Sin compras ni pagos registrados todavía</div>`;
  } else {
    order.forEach(monthKey=>{
      historyHtml += `<div class="picker-group-title">${monthKey}</div>`;
      groups[monthKey].forEach(t=>{
        const d = new Date(t.date);
        const dateLabel = d.toLocaleDateString('es-MX', {day:'2-digit', month:'short'});
        if(t.kind==='sale'){
          const s = t.sale;
          const detail = s.items.map(it=>`${esc(it.name)} x${it.qty}`).join(', ');
          const tag = s.payment==='credit'?'🤝 Fiado':(s.payment==='transfer'?'💳 Transferencia':'💵 Efectivo');
          historyHtml += `<div class="list-item">
            <div class="thumb">🛒</div>
            <div class="li-body"><div class="li-title">${dateLabel} · ${tag}</div><div class="li-sub">${detail}</div></div>
            <div class="li-right"><div class="mono small" style="font-weight:800">${fmt(s.total)}</div></div>
          </div>`;
        } else if(t.kind==='payment'){
          const p = t.payment;
          historyHtml += `<div class="list-item">
            <div class="thumb">💰</div>
            <div class="li-body"><div class="li-title">${dateLabel} · Pago de deuda</div>${p.note?`<div class="li-sub">${esc(p.note)}</div>`:''}</div>
            <div class="li-right"><div class="mono small" style="font-weight:800;color:var(--ok)">-${fmt(p.amount)}</div></div>
          </div>`;
        } else if(t.kind==='consignSale'){
          const s = t.csale;
          const detail = s.items.map(it=>{ const p=DB.products.find(p=>p.id===it.productId); return `${esc(p?p.name:'?')} x${it.qty}`; }).join(', ');
          historyHtml += `<div class="list-item">
            <div class="thumb">🧾</div>
            <div class="li-body"><div class="li-title">${dateLabel} · Venta reportada por el cliente</div><div class="li-sub">${detail}</div></div>
            <div class="li-right"><div class="mono small" style="font-weight:800">+${fmt(s.total)}</div></div>
          </div>`;
        } else if(t.kind==='deposit'){
          const dep = t.deposit;
          const detail = dep.items.map(it=>{ const p=DB.products.find(p=>p.id===it.productId); const sign = dep.isInitialBalance && it.qty>=0 ? '+' : ''; return `${esc(p?p.name:'?')} ${sign}${it.qty}`; }).join(', ');
          const label = dep.isInitialBalance ? 'Ajuste de inventario (no salió del almacén)' : 'Depósito de mercancía';
          const icon = dep.isInitialBalance ? '⚙️' : '📦';
          historyHtml += `<div class="list-item">
            <div class="thumb">${icon}</div>
            <div class="li-body"><div class="li-title">${dateLabel} · ${label}</div><div class="li-sub">${detail}</div></div>
          </div>`;
        } else if(t.kind==='return'){
          const ret = t.ret;
          const detail = ret.items.map(it=>{ const p=DB.products.find(p=>p.id===it.productId); return `${esc(p?p.name:'?')} x${it.qty}`; }).join(', ');
          historyHtml += `<div class="list-item">
            <div class="thumb">↩️</div>
            <div class="li-body"><div class="li-title">${dateLabel} · Devolución al almacén</div><div class="li-sub">${detail}</div></div>
          </div>`;
        } else if(t.kind==='adjustment'){
          const a = t.adj;
          historyHtml += `<div class="list-item">
            <div class="thumb">⚖️</div>
            <div class="li-body"><div class="li-title">${dateLabel} · Ajuste manual de deuda</div>${a.note?`<div class="li-sub">${esc(a.note)}</div>`:''}</div>
            <div class="li-right"><div class="mono small" style="font-weight:800;color:${a.amount>=0?'inherit':'var(--ok)'}">${a.amount>=0?'+':''}${fmt(a.amount)}</div></div>
          </div>`;
        }
      });
    });
  }

  const stockMap = clientProductStockMap(id);
  const heldProducts = Object.keys(stockMap).filter(pid=>stockMap[pid]>0);
  let stockHtml;
  if(heldProducts.length){
    stockHtml = heldProducts.map(pid=>{
      const p = DB.products.find(p=>p.id===pid);
      const price = getClientProductPrice(id,pid)||0;
      const qty = stockMap[pid];
      return `<div class="list-item">
        ${thumbHtml(p)}
        <div class="li-body"><div class="li-title">${esc(p?p.name:'?')}</div><div class="li-sub">${qty} unidades · ${fmt(price)} c/u</div></div>
        <div class="li-right" style="text-align:right">
          <div class="mono small" style="font-weight:800">${fmt(qty*price)}</div>
          ${app.role==='admin'?`<button class="btn btn-ghost btn-sm" onclick="openEditClientPriceForm('${id}','${pid}')">✏️ Precio</button>`:''}
        </div>
      </div>`;
    }).join('');
  } else {
    stockHtml = `<div class="small muted" style="padding:4px 0">Sin mercancía depositada actualmente</div>`;
  }

  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">${esc(c.name)}</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="card">
      <div class="row"><span class="small muted">Teléfono</span><span class="small">${esc(c.phone||'—')}</span></div>
      ${c.phone?`<div class="gap-2 mt-2">
        <a class="btn btn-outline btn-block btn-sm" style="text-decoration:none;text-align:center" href="tel:${esc(cleanPhone(c.phone))}">📞 Llamar</a>
        <a class="btn btn-outline btn-block btn-sm" style="text-decoration:none;text-align:center" href="https://wa.me/${esc(cleanPhone(c.phone))}" target="_blank" rel="noopener">💬 WhatsApp</a>
      </div>`:''}
      ${c.desc?`<div class="row mt-2"><span class="small muted">Notas</span><span class="small" style="text-align:right;max-width:60%">${esc(c.desc)}</span></div>`:''}
      <hr class="sep">
      <div class="row"><span style="font-weight:800">Estado</span>
        <span class="mono" style="font-weight:800;color:${debt>0?'var(--danger)':'var(--ok)'}">${debt>0?'Debe '+fmt(debt):'Al día'}</span></div>
      <div class="gap-2 mt-2">
        ${canVendor('addClients')?`<button class="btn btn-outline btn-block btn-sm" onclick="openClientForm('${c.id}')">✏️ Editar</button>`:''}
        ${debt>0?`<button class="btn btn-primary btn-block btn-sm" onclick="openClientPaymentForm('${c.id}')">💰 Registrar pago</button>`:''}
      </div>
    </div>
    <div class="section-title">Mercancía en su almacén</div>
    <div class="card">${stockHtml}</div>
    <div class="gap-2 mt-2">
      <button class="btn btn-outline btn-block btn-sm" onclick="openClientDepositForm('${c.id}')">📦 Depositar</button>
      <button class="btn btn-outline btn-block btn-sm" onclick="openClientReportSaleForm('${c.id}')">🧾 Venta reportada</button>
    </div>
    <div class="gap-2 mt-2">
      <button class="btn btn-outline btn-block btn-sm" onclick="openClientReturnForm('${c.id}')">↩️ Devolución</button>
      ${app.role==='admin'?`<button class="btn btn-outline btn-block btn-sm" onclick="openClientDebtAdjustForm('${c.id}')">⚖️ Ajustar deuda</button>`:''}
    </div>
    ${app.role==='admin'?`<div class="gap-2 mt-2">
      <button class="btn btn-outline btn-block btn-sm" onclick="openClientInventoryAdjustForm('${c.id}')">⚙️ Editar inventario</button>
    </div>`:''}
    <div class="section-title">Historial</div>
    ${historyHtml}
  `);
}

function openClientPaymentForm(clientId){
  const debt = clientDebt(clientId);
  ui.openPicker(`
    <div class="sheet-header"><div class="sheet-title">Registrar pago</div><button class="sheet-close" onclick="ui.closePicker()">✕</button></div>
    <div class="small muted" style="margin-bottom:10px">Deuda actual: <b class="mono">${fmt(debt)}</b></div>
    <div class="field"><label>Monto pagado</label><input type="number" step="0.01" id="cpAmount" value="0" placeholder="0"></div>
    <div class="field"><label>Nota (opcional)</label><input type="text" id="cpNote" placeholder="Ej. Pago parcial"></div>
    <button class="btn btn-primary btn-block" onclick="saveClientPayment('${clientId}')">Guardar pago</button>
  `);
  setTimeout(()=>{ const i=document.getElementById('cpAmount'); if(i) i.focus(); }, 150);
}
function saveClientPayment(clientId){
  const amount = parseFloat(document.getElementById('cpAmount').value)||0;
  if(amount<=0) return toast('Escribe un monto válido');
  const note = document.getElementById('cpNote').value.trim();
  DB.clientPayments.push({id:uid(), clientId, amount, note, date:new Date().toISOString(), createdAt:new Date().toISOString()});
  save();
  ui.closePicker();
  openClientDetail(clientId);
}

function viewSaleHistory(){
  const isAdmin = app.role==='admin';
  const allForRole = isAdmin ? DB.sales : DB.sales.filter(s=>s.date.slice(0,10)===todayISO());
  if(!DB.sales.length) return `<div class="empty"><div class="eic">📜</div><div class="et">Sin ventas todavía</div></div>`;

  let html = '';
  if(!isAdmin){
    html += `<div class="card small muted" style="margin-bottom:10px">Solo se muestran las ventas de hoy.</div>`;
  } else {
    const mode = app._saleHistMode || 'list';
    html += `<div class="tabbar">
      <div class="tab-pill ${mode==='list'?'active':''}" onclick="app._saleHistMode='list';renderView()">Lista</div>
      <div class="tab-pill ${mode==='calendar'?'active':''}" onclick="app._saleHistMode='calendar';renderView()">📅 Por día</div>
    </div>`;
    if(mode==='calendar'){
      html += historyCalendarHTML('_saleCal', s=>s.date, DB.sales, 'renderView');
      const sel = app._saleCal.sel;
      const dayList = DB.sales.filter(s=>s.date.slice(0,10)===sel);
      html += `<div class="section-title">${sel}${dayList.length?' — '+dayList.length+' venta(s)':''}</div>`;
      if(!dayList.length){ html += `<div class="empty" style="padding:20px"><div class="ed">Sin ventas este día</div></div>`; return html; }
      html += saleListHTML(dayList);
      return html;
    }
  }
  html += saleListHTML(allForRole.slice().reverse());
  return html;
}
function saleListHTML(list){
  let html = `<div class="card">`;
  list.forEach(s=>{
    const detail = s.items.map(it=>`${esc(it.name)} x${it.qty}`).join(', ');
    const chips = [];
    if(s.payment==='transfer') chips.push('💳 Transferencia');
    if(s.payment==='credit') chips.push('🤝 Fiado');
    if(s.isDelivery) chips.push('🛵 Domicilio');
    html += `<div class="list-item" style="cursor:pointer" onclick="openSaleDetail('${s.id}')">
      <div class="thumb">🧾</div>
      <div class="li-body"><div class="li-title">${detail}</div><div class="li-sub">${new Date(s.date).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'})}${chips.length?' · '+chips.join(' · '):''}</div></div>
      <div class="li-right"><div class="li-price mono">${fmt(s.total)}</div>${fmtUsdLine(s.total, s.usdRateAtSale)}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}
function openSaleDetail(saleId){
  const s = DB.sales.find(s=>s.id===saleId);
  if(!s) return;
  if(app.role!=='admin' && s.date.slice(0,10)!==todayISO()){ toast('Solo puedes ver el detalle de las ventas de hoy'); return; }
  const client = s.clientId ? DB.clients.find(c=>c.id===s.clientId) : null;
  const chips = [];
  if(s.payment==='transfer') chips.push('💳 Transferencia');
  else if(s.payment==='credit') chips.push('🤝 Fiado');
  else chips.push('💵 Efectivo');
  if(s.isDelivery) chips.push('🛵 Domicilio');
  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">Detalle de venta</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="card">
      <div class="row"><b>${new Date(s.date).toLocaleString('es-MX',{dateStyle:'long',timeStyle:'short'})}</b></div>
      ${client?`<div class="small muted mt-2">Cliente: ${esc(client.name)}</div>`:'<div class="small muted mt-2">Sin cliente asociado</div>'}
      ${s.receiptNo?`<div class="small muted">Recibo #${s.receiptNo}</div>`:''}
      <hr class="sep">
      ${s.items.map(it=>`<div class="row" style="padding:5px 0"><span class="small">${esc(it.name)} ${it.priceLabel?`(${esc(it.priceLabel)})`:''} x${it.qty}</span><span style="text-align:right"><span class="mono small">${fmt(it.qty*it.price)}</span>${fmtUsdLine(it.qty*it.price, s.usdRateAtSale)}</span></div>`).join('')}
      ${s.transferSurchargeAmount>0?`<div class="row" style="padding:5px 0"><span class="small muted">Recargo transferencia (${s.transferSurchargePct}%)</span><span class="mono small">${fmt(s.transferSurchargeAmount)}</span></div>`:''}
      ${s.deliveryFee>0?`<div class="row" style="padding:5px 0"><span class="small muted">Domicilio</span><span class="mono small">${fmt(s.deliveryFee)}</span></div>`:''}
      <hr class="sep">
      <div class="row"><b>Total</b><span style="text-align:right"><b class="mono">${fmt(s.total)}</b>${fmtUsdLine(s.total, s.usdRateAtSale)}</span></div>
      <div class="gap-2 mt-2">${chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>
      ${s.usdRateAtSale>0?`<div class="small muted mt-2">Tasa vigente en ese momento: 1 USD = ${s.usdRateAtSale} ${esc(DB.meta.currency)}</div>`:''}
    </div>
    <button class="btn btn-outline btn-block" onclick="viewSaleReceipt('${s.id}')">🧾 Ver factura para enviar</button>
  `);
}

/* =========================================================
   CAJA (conteo de efectivo + conversor de moneda)
   ========================================================= */
/* Los conteos de caja guardados antes de este cambio tienen la fecha ya en texto
   formateado (no ISO), y no se pueden reinterpretar de forma confiable. Esta función
   los muestra igual tal cual, y a los nuevos (formato ISO) les da formato bonito. */
function cashCountDateLabel(c){
  if(c.date.includes('T')) return new Date(c.date).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'});
  return c.date; // conteo antiguo, ya viene como texto legible
}
function cashCountDateKey(c){
  return c.date.includes('T') ? c.date.slice(0,10) : ''; // '' = no coincide con ningún día del calendario
}
function viewCash(){
  const denoms = DB.settings.cashDenoms;
  let html = `<div class="section-title">Conversor de moneda</div>
  <div class="card">
    ${DB.settings.usdRate>0? `<div class="small muted mb-2">1 USD = ${DB.settings.usdRate} ${DB.meta.currency} <span class="chip" style="margin-left:6px">${DB.settings.usdRateUpdated?('act. '+DB.settings.usdRateUpdated):''}</span></div>`
      : `<div class="small mb-2" style="color:var(--danger)">Configura la tasa del dólar en Ajustes para usar el conversor.</div>`}
    <div class="field-row">

    </div>
  </div>

  <div class="section-title">Conteo de efectivo</div>
  <div class="card"><div class="small muted mb-2">Cuenta cuántos billetes/monedas tienes de cada denominación. Puedes editarlas en Ajustes.</div>`;
  html += `<div id="denomList">`;
  denoms.forEach((d,i)=>{
    const isLast = i===denoms.length-1;
    html += `<div class="denom-row">
      <div><div class="denom-label mono">${fmt(d)}</div></div>
      <input type="number" min="0" class="denom-input" id="denom_${d}" value="0" oninput="calcCash()" enterkeyhint="${isLast?'done':'next'}">

  });
  html += `</div></div>

    <div class="row"><span style="font-weight:800">Total contado</span><span class="mono" id="cashTotal" style="font-weight:800;font-size:calc(18px * var(--font-scale))">${fmt(0)}</span></div>

      <div class="tab-pill ${mode==='list'?'active':''}" onclick="app._cashHistMode='list';renderView()">Lista</div>
      <div class="tab-pill ${mode==='calendar'?'active':''}" onclick="app._cashHistMode='calendar';renderView()">📅 Por día</div>
    </div>`;
    if(mode==='calendar'){
      html += historyCalendarHTML('_cashCal', cashCountDateKey, DB.cashCounts, 'renderView');
      const sel = app._cashCal.sel;
      const dayList = DB.cashCounts.filter(c=>cashCountDateKey(c)===sel);
      html += `<div class="section-title">${sel}${dayList.length?' — '+dayList.length+' conteo(s)':''}</div>`;
      if(!dayList.length){
        html += `<div class="empty" style="padding:20px"><div class="ed">Sin conteos este día</div></div>`;
      } else {
        html += `<div class="card">` + dayList.slice().reverse().map(c=>`
          <div class="list-item" style="cursor:pointer" onclick="openCashCountDetail('${c.id}')"><div class="thumb">💵</div>
            <div class="li-body"><div class="li-title">${cashCountDateLabel(c)}</div></div>
            <div class="li-right"><div class="li-price mono">${fmt(c.total)}</div></div></div>`).join('') + `</div>`;
      }
    } else {
      html += `<div class="card">`;
      DB.cashCounts.slice().reverse().slice(0,10).forEach(c=>{
        html += `<div class="list-item" style="cursor:pointer" onclick="openCashCountDetail('${c.id}')"><div class="thumb">💵</div>
          <div class="li-body"><div class="li-title">${cashCountDateLabel(c)}</div></div>
          <div class="li-right"><div class="li-price mono">${fmt(c.total)}</div></div></div>`;
      });
      html += `</div>`;
    }
  }
  return html;
}
function openCashCountDetail(id){
  const c = DB.cashCounts.find(c=>c.id===id);
  if(!c) return;
  const denoms = c.denoms || {};
  const rows = Object.keys(denoms).map(Number).sort((a,b)=>b-a)
    .filter(d=>denoms[d]>0)
    .map(d=>`<div class="row" style="padding:4px 0"><span class="small">${fmt(d)} x${denoms[d]}</span><span class="mono small">${fmt(d*denoms[d])}</span></div>`)
    .join('') || `<div class="small muted">Sin billetes/monedas contados</div>`;
  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">Conteo del ${cashCountDateLabel(c)}</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="card">${rows}
      <hr class="sep">
      <div class="row"><span style="font-weight:800">Total</span><span class="mono" style="font-weight:800">${fmt(c.total)}</span></div>
    </div>
    <button class="btn btn-outline btn-block" onclick="ui.closeSheet()">Cerrar</button>
  `);
}
function convFromUsd(){
  const rate = DB.settings.usdRate||0;
  const usd = parseFloat(document.getElementById('convUsd').value)||0;
  document.getElementById('convCup').value = rate? (usd*rate).toFixed(2) : '';
}
function convFromCup(){
  const rate = DB.settings.usdRate||0;
  const cup = parseFloat(document.getElementById('convCup').value)||0;
  document.getElementById('convUsd').value = rate? (cup/rate).toFixed(2) : '';
}
function calcCash(){
  let total=0;
  DB.settings.cashDenoms.forEach(d=>{
    const el = document.getElementById('denom_'+d);
    const n = el? (parseInt(el.value)||0) : 0;
    total += n*d;
  });
  document.getElementById('cashTotal').textContent = fmt(total);
  return total;
}
function saveCashCount(){
  const denoms={};
  DB.settings.cashDenoms.forEach(d=>{ denoms[d] = parseInt(document.getElementById('denom_'+d).value)||0; });
  const total = calcCash();
  DB.cashCounts.push({id:uid(), date:new Date().toISOString(), denoms, total});
  save(); toast('Conteo guardado'); renderView();
}

/* =========================================================
   GASTOS Y FINANZAS
   ========================================================= */
function viewExpenses(){
  const period = app._expPeriod || 'mes';
  const {from} = periodRange(period);
  const salesP = DB.sales.filter(s=> new Date(s.date) >= from);
  const expP = DB.expenses.filter(e=> new Date(e.date) >= from);
  const lossesP = (DB.losses||[]).filter(l=> new Date(l.date) >= from);
  const revenue = salesP.reduce((a,s)=>a+s.total,0);
  const cogs = salesP.reduce((a,s)=> a + s.items.reduce((b,it)=>{
    if(it.costPriceAtSale!=null) return b + it.costPriceAtSale*it.qty;
    const p = DB.products.find(p=>p.id===it.productId);
    return b + (p? p.costPrice*it.qty : 0);
  },0),0);
  const totalOut = expP.filter(e=>e.type!=='ingreso').reduce((a,e)=>a+e.amount,0);
  const totalIn = expP.filter(e=>e.type==='ingreso').reduce((a,e)=>a+e.amount,0);
  const totalLosses = lossesP.reduce((a,l)=>a+l.costImpact,0);
  const profit = revenue - cogs - totalOut + totalIn - totalLosses;

  let html = `<div class="tabbar">
    ${['hoy','semana','mes','todo'].map(p=>`<div class="tab-pill ${period===p?'active':''}" onclick="app._expPeriod='${p}';renderView()">${p[0].toUpperCase()+p.slice(1)}</div>`).join('')}
  </div>
  <div class="gap-2 mb-2">
    <button class="btn btn-outline btn-block" onclick="openExpenseForm('gasto')">💸 Sacar dinero</button>
    <button class="btn btn-outline btn-block" onclick="openExpenseForm('ingreso')">💰 Meter dinero</button>
  </div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-val mono">${fmt(revenue)}</div><div class="stat-lbl">Ventas</div></div>
    <div class="stat-card"><div class="stat-val mono">${fmt(cogs)}</div><div class="stat-lbl">Costo de mercancía</div></div>
    <div class="stat-card"><div class="stat-val mono">${fmt(totalOut)}</div><div class="stat-lbl">Dinero sacado</div></div>
    <div class="stat-card"><div class="stat-val mono" style="color:var(--ok)">${fmt(totalIn)}</div><div class="stat-lbl">Dinero metido</div></div>
    <div class="stat-card"><div class="stat-val mono" style="color:var(--danger)">${fmt(totalLosses)}</div><div class="stat-lbl">Pérdidas de productos</div></div>
    <div class="stat-card" style="border-color:${profit>=0?'#B9DEC1':'#E9BBB6'}"><div class="stat-val mono" style="color:${profit>=0?'var(--ok)':'var(--danger)'}">${fmt(profit)}</div><div class="stat-lbl">${profit>=0?'Utilidad neta':'Pérdida'}</div></div>
  </div>
  <div class="section-title">Movimientos registrados</div>`;

  if(!DB.expenses.length){
    html += `<div class="empty"><div class="eic">💸</div><div class="et">Sin movimientos registrados</div><div class="ed">Usa los botones de arriba para agregar uno.</div></div>`;
  } else {
    html += `<div class="card">`;
    DB.expenses.slice().reverse().forEach(e=>{
      const isIncome = e.type==='ingreso';
      html += `<div class="list-item">
        <div class="thumb">${isIncome?'💰':'💸'}</div>
        <div class="li-body"><div class="li-title">${esc(e.concept)}</div><div class="li-sub">${e.date}${e.category?' · '+esc(e.category):''}</div></div>
        <div class="li-right"><div class="li-price mono" style="color:${isIncome?'var(--ok)':'var(--danger)'}">${isIncome?'+':'-'}${fmt(e.amount)}</div></div>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}
function periodRange(period){
  const now = new Date();
  let from = new Date(0);
  if(period==='hoy'){ from = new Date(now.toDateString()); }
  else if(period==='semana'){ from = new Date(now); from.setDate(now.getDate()-7); }
  else if(period==='mes'){ from = new Date(now); from.setMonth(now.getMonth()-1); }
  return {from};
}
function openExpenseForm(type){
  type = type || 'gasto';
  const isIncome = type==='ingreso';
  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">${isIncome?'Meter dinero':'Sacar dinero'}</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>

/* =========================================================
   REPORTES
   ========================================================= */
function viewReports(){
  const limit = DB.settings.reportsLimit || 8;
  const salesByProduct = {};
  DB.sales.forEach(s=>s.items.forEach(it=>{
    salesByProduct[it.productId] = (salesByProduct[it.productId]||0) + it.qty;
  }));
  const withSales = activeProducts().map(p=>({p, qty:salesByProduct[p.id]||0}));
  const best = withSales.slice().sort((a,b)=>b.qty-a.qty).slice(0,limit);
  const worst = withSales.slice().sort((a,b)=>a.qty-b.qty).slice(0,limit);
  const margin = activeProducts().map(p=>{
    const price = p.prices[0]?p.prices[0].price:0;
    return {p, margin: price - p.costPrice};
  }).sort((a,b)=>a.margin-b.margin).slice(0,limit);

  function block(title, arr, valueFn){
    if(!arr.length) return `<div class="section-title">${title}</div><div class="empty" style="padding:20px"><div class="ed">Sin datos suficientes</div></div>`;
    return `<div class="section-title">${title}</div><div class="card">` +
      arr.map(x=>`<div class="list-item">${thumbHtml(x.p)}
        <div class="li-body"><div class="li-title">${esc(x.p.name)}</div></div>
        <div class="li-right"><div class="li-price mono">${valueFn(x)}</div></div></div>`).join('') + `</div>`;
  }
  return `<div class="card mb-2">
      <div class="field" style="margin-bottom:0"><label>Cantidad de productos a mostrar por sección</label><input type="number" id="setReportsLimit" value="${limit}" onchange="DB.settings.reportsLimit=parseInt(this.value)||8;save();renderView()"></div>
    </div>`
    + block('🏆 Más vendidos', best, x=>x.qty+' und.')
    + block('📉 Menos vendidos', worst, x=>x.qty+' und.')
    + block('⚠️ Menor margen de ganancia', margin, x=>fmt(x.margin));
}

/* ---------------- Calendario genérico reutilizable para navegar historiales por día ---------------- */
function historyCalendarHTML(stateKey, dateExtractor, records, onDayChangeFn){
  const st = app[stateKey] || (app[stateKey] = {y:new Date().getFullYear(), m:new Date().getMonth(), sel:todayISO()});
  const first = new Date(st.y, st.m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(st.y, st.m+1, 0).getDate();
  const monthName = first.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  const todayStr = todayISO();
  const datesWithData = new Set(records.map(r=>dateExtractor(r).slice(0,10)));

  let cells = '';
  const dows = ['D','L','M','X','J','V','S'];
  dows.forEach(d=> cells += `<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startDow;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${st.y}-${String(st.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasItems = datesWithData.has(dateStr);
    cells += `<div class="cal-cell inmonth ${dateStr===todayStr?'today':''} ${dateStr===st.sel?'sel':''}" onclick="app.${stateKey}.sel='${dateStr}';${onDayChangeFn}()">${d}${hasItems?'<span class="cal-dot"></span>':''}</div>`;
  }
  return `<div class="card">
    <div class="row">
      <button class="icon-btn" style="background:var(--surface-2);color:var(--ink)" onclick="app.${stateKey}.m--; if(app.${stateKey}.m<0){app.${stateKey}.m=11;app.${stateKey}.y--;} ${onDayChangeFn}()">‹</button>
      <b style="text-transform:capitalize">${monthName}</b>
      <button class="icon-btn" style="background:var(--surface-2);color:var(--ink)" onclick="app.${stateKey}.m++; if(app.${stateKey}.m>11){app.${stateKey}.m=0;app.${stateKey}.y++;} ${onDayChangeFn}()">›</button>
    </div>
    <div class="calendar-grid mt-3">${cells}</div>
  </div>`;
}

function viewReminders(){

    </div>`;
  } else if(Notification.permission!=='granted'){
    html += `<div class="card">

    // para recibir avisos de verdad (antes, si el permiso ya estaba en 'granted' por
    // cualquier motivo, este botón se escondía por completo y no había ninguna forma de
    // completar/reparar el registro — quedaba viendo notificaciones locales nada más,
    // que solo funcionan con la app abierta).
    html += `<div class="card">
      <div class="small muted" style="margin-bottom:8px">✅ Permiso concedido. Si no te están llegando avisos con la app cerrada, toca este botón para confirmar que este teléfono quedó registrado.</div>
      <button class="btn btn-outline btn-block btn-sm" onclick="subscribeToPush(true)">🔄 Confirmar registro de este dispositivo</button>
    </div>`;
  }
  if(!list.length){
    html += `<div class="empty"><div class="eic">⏰</div><div class="et">Sin recordatorios</div><div class="ed">Toca + para crear uno.</div></div>`;

  }

  list.forEach(r=>{
    const due = isReminderDue(r);
    html += `<div class="list-item">
      <div class="thumb">${r.done?'✅':(due?'⏰':'🔔')}</div>
      <div class="li-body">
        <div class="li-title" style="${r.done?'text-decoration:line-through;opacity:.5':''}">${esc(r.title)}</div>

        ${!r.done?`<button class="btn btn-ghost btn-sm" onclick="toggleReminder('${r.id}')">Hecho</button>`:''}
        <button class="btn btn-danger btn-sm" onclick="removeReminder('${r.id}')">✕</button>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}
let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx){
    try{ _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(_audioCtx.state==='suspended') _audioCtx.resume();
  return _audioCtx;
}
function beep(ctx, whenOffset, freq, duration, volume){
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sine'; osc.frequency.value = freq;
  const t0 = ctx.currentTime + whenOffset;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(volume, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+duration+0.05);
}
function playAlarmSound(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  [0, 0.45, 0.9].forEach(off=>{ beep(ctx, off, 880, 0.3, 0.3); beep(ctx, off+0.15, 660, 0.2, 0.25); });
  if(navigator.vibrate) navigator.vibrate([250,120,250,120,250]);
}
function playPingSound(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  beep(ctx, 0, 740, 0.22, 0.18);
  if(navigator.vibrate) navigator.vibrate(120);
}
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
async function subscribeToPush(manual){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    if(manual) toast('Este navegador no admite notificaciones push');
    return;
  }
  if(!app.userId) return;
  try{
    const { data: cfg, error: cfgErr } = await sb.from('push_public_config').select('vapid_public_key').eq('id',1).single();
    if(cfgErr || !cfg) { console.error('No se pudo leer la clave pública VAPID', cfgErr); if(manual) toast('No se pudo activar: sin conexión con el servidor'); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(cfg.vapid_public_key)
      });
    }
    const json = sub.toJSON();
    const { error: upsertErr } = await sb.from('push_subscriptions').upsert({
      user_id: app.userId, endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth
    }, {onConflict:'endpoint'});
    if(upsertErr){ console.error('Error guardando suscripción push:', upsertErr); if(manual) toast('No se pudo registrar este dispositivo: '+upsertErr.message); return; }
    if(manual) toast('✅ Este dispositivo va a recibir avisos, incluso con la app cerrada');
  }catch(err){
    console.error('Error suscribiendo a push:', err);
    if(manual) toast('No se pudo activar: '+(err && err.message ? err.message : 'error desconocido'));
  }
}
async function sendPushToOthers(title, message, tag){
  if(!app.userId) return;
  try{
    const { data: { session } } = await sb.auth.getSession();
    await fetch(SUPABASE_URL + '/functions/v1/send-push', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+(session ? session.access_token : SUPABASE_ANON_KEY), 'Content-Type':'application/json' },
      body: JSON.stringify({ title, message, tag, exclude_user_id: app.userId })
    });
  }catch(err){
    console.error('Error enviando push:', err);
  }
}

   dispositivo ya lo mostró. */
function _localNotifSet(key){
  try{ return new Set(JSON.parse(localStorage.getItem(key)||'[]')); }catch(e){ return new Set(); }
}
function _saveLocalNotifSet(key, set){
  try{ localStorage.setItem(key, JSON.stringify([...set])); }catch(e){}
}
function checkDueReminders(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const notifiedIds = _localNotifSet('almacenpro_notified_reminders_v1');
  let changed = false;
  (DB.reminders||[]).forEach(r=>{
    if(r.done || notifiedIds.has(r.id)) return;
    if(isReminderDue(r)){
      try{ const n = new Notification('⏰ '+r.title, {body:'Recordatorio de AlmacénPro', tag:'rem-'+r.id, icon:'./icon.png', badge:'./icon.png'}); n.onclick=()=>{ window.focus(); app.go('reminders'); n.close(); }; }catch(e){}

}
function checkLowStockAlerts(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const alertedIds = _localNotifSet('almacenpro_alerted_lowstock_v1');
  let changed = false;
  const low = activeProducts().filter(p=>p.stock<=p.minStock);
  const lowIds = new Set(low.map(p=>p.id));
  low.forEach(p=>{
    if(alertedIds.has(p.id)) return;
    try{ const n = new Notification('⚠️ Stock bajo: '+p.name, {body:'Quedan '+p.stock+' unidades (mínimo '+p.minStock+')', tag:'stock-'+p.id, icon:'./icon.png', badge:'./icon.png'}); n.onclick=()=>{ window.focus(); n.close(); }; }catch(e){}
    alertedIds.add(p.id); changed = true;
  });
  // si el producto se repuso por encima del mínimo, se vuelve a avisar la próxima vez que baje
  [...alertedIds].forEach(id=>{ if(!lowIds.has(id)){ alertedIds.delete(id); changed = true; } });
  if(changed) _saveLocalNotifSet('almacenpro_alerted_lowstock_v1', alertedIds);
}

function renderOrderItemsList(editable, order){
  const items = order ? (order.items||[]) : window._orderDraft.items;
  if(!items.length) return `<div class="small muted" style="padding:4px 0">Sin productos todavía</div>`;
  // Durante "preparando" (acomodando), quien arma el pedido ve un check por producto para ir
  // tachándolo a medida que lo aparta — esto es solo un checklist, NO decide todavía si el
  // producto se vende, se fía o se deposita; eso lo decide un paso posterior y separado
  // ("Confirmar pedido", en el estado "armado"), a propósito, para que sea otra persona/otro
  // momento el que tome esa decisión.
  const checklist = order && order.status==='preparando';
  return items.map((it,i)=>{
    const inputId = order ? `ordQty_${order.id}_${i}` : `ordDraftQty_${i}`;
    const qtyChangeAttr = order ? `onchange="setOrderItemQty('${order.id}',${i},this.value)"` : `onchange="setOrderItemQty(null,${i},this.value)"`;

function bumpOrderItemQty(orderId, i, delta){
  const items = orderId ? ((DB.orders.find(o=>o.id===orderId)||{}).items) : window._orderDraft.items;
  if(!items || !items[i]) return;
  items[i].qty = Math.max(1, (parseFloat(items[i].qty)||0) + delta);
  if(orderId){ const o=DB.orders.find(o=>o.id===orderId); o.updatedAt=new Date().toISOString(); save(); openOrderDetail(orderId); }
  else renderOrderFormSheet();
}
function setOrderItemQty(orderId, i, val){
  const items = orderId ? ((DB.orders.find(o=>o.id===orderId)||{}).items) : window._orderDraft.items;
  if(!items || !items[i]) return;
  let q = parseFloat(val)||0;
  if(q<=0){ items.splice(i,1); } else { items[i].qty = q; }
  if(orderId){ const o=DB.orders.find(o=>o.id===orderId); o.updatedAt=new Date().toISOString(); save(); openOrderDetail(orderId); }
  else renderOrderFormSheet();
}
function toggleOrderItemPicked(orderId, i){

    actions = `<div class="small muted" style="margin:6px 0">Se confirmó como <b>${o.kind==='deposito'?'depósito en almacén':(o.kind==='mixto'?'venta + depósito (mixto)':'venta')}</b>. Los productos ya no se editan aquí — para corregir algo usa devoluciones o ajuste de deuda desde el perfil del cliente.</div>

    actions = `<div class="small muted" style="margin:6px 0">Entregado${o.deliveredAt?' el '+new Date(o.deliveredAt).toLocaleDateString('es-MX'):''}.</div>
      ${(o.kind==='venta'||o.kind==='mixto') && o.saleId ? `<button class="btn btn-outline btn-block mt-2" onclick="openEditSaleCreditSplit('${o.saleId}')">✏️ Corregir qué quedó a crédito</button>` : ''}`;

    <div class="field mt-2"><label>Nota</label><textarea id="orderNote" rows="2" onchange="updateOrderNote('${id}', this.value)">${esc(o.note||'')}</textarea></div>

}
function updateOrderNote(id, val){
  const o = DB.orders.find(o=>o.id===id);
  if(!o) return;
  o.note = val; o.updatedAt = new Date().toISOString();
  save();
}
function finishPickingOrder(id){
  const o = DB.orders.find(o=>o.id===id);
  if(!o) return;
  const pending = o.items.filter(it=>!it.picked).length;
  if(pending>0 && !confirm('Todavía quedan '+pending+' producto(s) sin tachar. ¿Seguro que ya terminaste de acomodar?')) return;
  setOrderStatus(id, 'armado');
}
function setOrderStatus(id, status){
  const o = DB.orders.find(o=>o.id===id);
  if(!o) return;
  o.status = status; o.updatedAt = new Date().toISOString();
  if(status==='entregado') o.deliveredAt = new Date().toISOString();
  save();
  ui.closeSheet();
  toast('Pedido actualizado');
  if(status==='entregado') sendPushToOthers('🚚 Pedido entregado', 'El pedido de '+(o.clientName||(DB.clients.find(c=>c.id===o.clientId)||{}).name)+' ya se entregó', 'order-delivered');
  if(status==='armado') sendPushToOthers('📦 Pedido armado', 'El pedido de '+(o.clientName||(DB.clients.find(c=>c.id===o.clientId)||{}).name)+' ya está listo — falta confirmar el pago', 'order-armed');
  renderView();
}
function addOrderDetailItem(id, pid){
  const o = DB.orders.find(o=>o.id===id);
  const p = DB.products.find(p=>p.id===pid);
  if(!o || !p) return;
  o.items.push({productId:p.id, name:p.name, qty:1, price:(p.prices&&p.prices[0]?p.prices[0].price:0)});
  o.updatedAt = new Date().toISOString();
  save();
  openOrderDetail(id);
}
function promptFreeOrderDetailItem(id){
  const o = DB.orders.find(o=>o.id===id);
  if(!o) return;
  const name = prompt('¿Qué lleva? (nombre del producto)');
  if(!name) return;
  const qty = parseFloat(prompt('Cantidad:', '1'))||1;
  const price = parseFloat(prompt('Precio por unidad:', '0'))||0;
  o.items.push({productId:null, name:name.trim(), qty, price});
  o.updatedAt = new Date().toISOString();
  save();
  openOrderDetail(id);
}
function removeOrderDetailItem(id, idx){
  const o = DB.orders.find(o=>o.id===id);
  if(!o) return;
  o.items.splice(idx,1);
  o.updatedAt = new Date().toISOString();
  save();
  openOrderDetail(id);
}

function openConfirmOrder(id){
  const o = DB.orders.find(o=>o.id===id);
  if(!o) return;
  if(!o.items.length) return toast('El pedido no tiene productos');
  window._confirmOrderId = id;
  window._confirmOrderMode = o.items.map(()=>'venta');
  renderConfirmOrderSheet(id);
}
function renderConfirmOrderSheet(id){
  const o = DB.orders.find(o=>o.id===id);
  if(!o) return;
  const modes = window._confirmOrderMode;
  const rows = o.items.map((it,i)=>{
    const canDeposit = !!(it.productId && o.clientId);
    const mode = modes[i];
    return `<div class="list-item" style="flex-direction:column;align-items:stretch;gap:6px">
      <div class="li-body"><div class="li-title">${esc(it.name)}</div><div class="li-sub">${it.qty} x ${fmt(it.price)} = ${fmt(it.qty*it.price)}</div></div>
      <div class="gap-2">
        <button class="btn ${mode==='venta'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="setConfirmOrderMode(${i},'venta')">💰 Venta</button>
        <button class="btn ${mode==='deposito'?'btn-primary':'btn-outline'} btn-block btn-sm" ${canDeposit?'':'disabled'} onclick="setConfirmOrderMode(${i},'deposito')">📦 Depósito</button>
      </div>
      ${mode==='venta'?`<div style="width:130px;align-self:flex-end"><label class="small muted">A crédito</label><input type="number" class="mono" id="confCreditQty_${i}" value="0" min="0" max="${it.qty}" step="1" style="width:100%;text-align:right"></div>`:''}
      ${!canDeposit && !it.productId?`<div class="small muted">Fuera de inventario: solo puede ser venta.</div>`:''}
    </div>`;
  }).join('');
  ui.openPicker(`
    <div class="sheet-header"><div class="sheet-title">Confirmar pedido</div><button class="sheet-close" onclick="ui.closePicker()">✕</button></div>
    <div class="small muted" style="margin-bottom:8px">Elige, producto por producto, si se cobra ahora (venta, con lo que quede a crédito) o si queda en el almacén de este cliente (depósito).${!o.clientId?' <b style="color:var(--danger)">Este pedido no tiene un cliente con ficha — no se puede depositar nada, todo debe ser venta.</b>':''}</div>
    <div class="card">${rows}</div>
    <button class="btn btn-primary btn-block mt-3" onclick="saveConfirmOrder('${id}')">Confirmar</button>
  `);
}
function setConfirmOrderMode(i, mode){
  const o = DB.orders.find(o=>o.id===window._confirmOrderId);
  if(!o) return;
  if(mode==='deposito' && (!o.clientId || !o.items[i].productId)){
    toast(!o.clientId?'Este pedido no tiene cliente con ficha, no se puede depositar':'Ese producto no está en el inventario, no se puede depositar');
    return;
  }
  window._confirmOrderMode[i] = mode;
  renderConfirmOrderSheet(window._confirmOrderId);
}
function saveConfirmOrder(id){
  const o = DB.orders.find(o=>o.id===id);
  if(!o) return;
  const modes = window._confirmOrderMode;
  const ventaItems = [], depositoItems = [];
  o.items.forEach((it,i)=>{
    if(modes[i]==='deposito'){ depositoItems.push(it); return; }
    let creditQty = parseFloat((document.getElementById('confCreditQty_'+i)||{}).value)||0;
    if(!o.clientId) creditQty = 0;
    creditQty = Math.max(0, Math.min(creditQty, it.qty));
    ventaItems.push({productId:it.productId, name:it.name, price:it.price, qty:it.qty, creditQty});
  });
  for(const it of depositoItems){
    const p = DB.products.find(p=>p.id===it.productId);
    if(!p || p.stock < it.qty){ toast('No hay suficiente stock de "'+it.name+'" para depositar'); return; }
  }
  let saleId = null;
  if(ventaItems.length){
    const allCash = ventaItems.every(it=>it.creditQty===0);
    const allCredit = ventaItems.every(it=>it.creditQty===it.qty);
    const payment = allCash ? 'cash' : (allCredit ? 'credit' : 'mixed');
    const total = ventaItems.reduce((a,it)=>a+it.qty*it.price,0);
    const sale = { id:uid(), date:new Date().toISOString(), clientId:o.clientId||null, payment, total, items:ventaItems };
    DB.sales.push(sale);
    saleId = sale.id;
  }
  if(depositoItems.length){
    DB.consignments.push({id:uid(), clientId:o.clientId, date:new Date().toISOString(), items:depositoItems.map(it=>({productId:it.productId, qty:it.qty})), createdAt:new Date().toISOString()});
    depositoItems.forEach(it=>{
      if(getClientProductPrice(o.clientId, it.productId)==null) setClientProductPrice(o.clientId, it.productId, it.price);
    });
  }
  recomputeStock();
  o.status = 'confirmado';
  o.kind = ventaItems.length && depositoItems.length ? 'mixto' : (depositoItems.length ? 'deposito' : 'venta');
  o.saleId = saleId;
  o.updatedAt = new Date().toISOString();
  save();
  ui.closePicker(); ui.closeSheet();
  toast('Pedido confirmado');
  sendPushToOthers('✅ Pedido listo', 'El pedido de '+(o.clientName||(DB.clients.find(c=>c.id===o.clientId)||{}).name)+' ya está listo para entregar', 'order-ready');
  renderView();
}
function openEditSaleCreditSplit(saleId){
  const s = DB.sales.find(s=>s.id===saleId);
  if(!s) return;
  window._editSaleId = saleId;
  const rows = s.items.map((it,i)=>`
    <div class="list-item">
      <div class="li-body"><div class="li-title">${esc(it.name||'')}</div><div class="li-sub">${it.qty} x ${fmt(it.price)}</div></div>
      <div style="width:90px">
        <label class="small muted">A crédito</label>

      </div>
    </div>`).join('');
  ui.openPicker(`
    <div class="sheet-header"><div class="sheet-title">Corregir qué quedó a crédito</div><button class="sheet-close" onclick="ui.closePicker()">✕</button></div>
    <div class="small muted" style="margin-bottom:8px">Esto solo corrige cuánto quedó a deber de cada producto — no cambia cantidades ni precios de la venta ya hecha.</div>
    <div class="card">${rows}</div>
    <button class="btn btn-primary btn-block mt-3" onclick="saveEditSaleCreditSplit('${saleId}')">Guardar corrección</button>
  `);
}
function saveEditSaleCreditSplit(saleId){
  const s = DB.sales.find(s=>s.id===saleId);
  if(!s) return;
  s.items.forEach((it,i)=>{
    let v = parseFloat(document.getElementById('editCreditQty_'+i).value)||0;
    it.creditQty = Math.max(0, Math.min(v, it.qty));
  });
  const allCash = s.items.every(it=>(it.creditQty||0)===0);
  const allCredit = s.items.every(it=>(it.creditQty||0)===it.qty);
  s.payment = allCash ? 'cash' : (allCredit ? 'credit' : 'mixed');
  save();
  ui.closePicker();
  toast('Corregido');
  renderView();
}

let _pendingSwUpdate = null; // service worker nuevo esperando a que sea seguro activarlo
async function silentAutoUpdateCheck(){
  if(!('serviceWorker' in navigator)) return;
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    if(!reg) return;
    await reg.update();
    if(reg.waiting){
      _pendingSwUpdate = reg.waiting;
      tryApplyPendingUpdate();
    }
  }catch(e){ /* sin internet: no pasa nada, se reintenta más tarde */ }
}
function tryApplyPendingUpdate(){
  if(!_pendingSwUpdate) return;
  if(_syncBusy) return; // nunca cambies el código mientras hay una subida de datos en curso
  const active = document.activeElement;
  const isTyping = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA');
  if(isTyping) return; // tampoco interrumpas mientras alguien está escribiendo algo
  const worker = _pendingSwUpdate;
  _pendingSwUpdate = null;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(reloaded) return;
    reloaded = true;
    window.location.reload();
  }, {once:true});
  worker.postMessage({type:'SKIP_WAITING'});
}
setInterval(silentAutoUpdateCheck, 5*60*1000); // revisa en silencio cada 5 minutos
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ silentAutoUpdateCheck(); tryApplyPendingUpdate(); } });

async function checkForUpdate(){
  if(!('serviceWorker' in navigator)){
    toast('Este navegador no admite actualización automática');
    return;
  }
  const btn = document.getElementById('checkUpdateBtn');
  const status = document.getElementById('checkUpdateStatus');
  if(btn){ btn.disabled = true; btn.textContent = 'Buscando actualización...'; }
  try{
    backupData();
    if(status) status.textContent = 'Copia de seguridad guardada. Buscando actualización...';
    const reg = await navigator.serviceWorker.getRegistration();
    if(!reg){
      if(status) status.textContent = 'No se encontró el service worker registrado.';
      if(btn){ btn.disabled=false; btn.textContent='🔄 Buscar actualización'; }
      return;
    }
    await reg.update();
    if(reg.waiting){
      _pendingSwUpdate = reg.waiting;
      if(status) status.textContent = 'Hay una versión nueva. Se aplicará en cuanto no haya nada subiéndose (puede tardar unos segundos)...';
      const tryLoop = setInterval(()=>{
        if(!_pendingSwUpdate){ clearInterval(tryLoop); return; }
        tryApplyPendingUpdate();
      }, 1000);
      tryApplyPendingUpdate();
    } else {
      if(status) status.textContent = 'Ya tienes la última versión.';
      if(btn){ btn.disabled=false; btn.textContent='🔄 Buscar actualización'; }
    }
  }catch(e){
    if(status) status.textContent = 'No se pudo revisar (¿sin internet?). Tu copia de seguridad ya se descargó y tus datos están a salvo.';
    if(btn){ btn.disabled=false; btn.textContent='🔄 Buscar actualización'; }
  }
}

function mergeById(localArr, remoteArr){
  const map = {};
  (localArr||[]).forEach(x=> map[x.id]=x);
  let added=0;
  (remoteArr||[]).forEach(x=>{ if(!map[x.id]){ map[x.id]=x; added++; } });
  return {merged:Object.values(map), added};
}

/* ---------- Detección de casos que sí necesitan que el usuario decida ---------- */
function detectDeleteConflicts(localProducts, remoteProducts){
  const lMap = {}; localProducts.forEach(p=>lMap[p.id]=p);
  const rMap = {}; (remoteProducts||[]).forEach(p=>rMap[p.id]=p);
  const conflicts = [];
  Object.keys(lMap).forEach(id=>{
    const lp = lMap[id], rp = rMap[id];
    if(!rp) return;
    const lDel = !!lp.deletedAt, rDel = !!rp.deletedAt;
    if(lDel !== rDel){
      conflicts.push({type:'delete', productId:id, name:(lDel?lp.name:rp.name)||'(sin nombre)'});
    }
  });
  return conflicts;
}
function detectStockDupConflicts(localAdj, remoteAdj){
  const conflicts = [];
  const localIds = new Set((localAdj||[]).map(a=>a.id));
  const localManual = (localAdj||[]).filter(a=>a.reason==='Ajuste manual');
  const remoteNewManual = (remoteAdj||[]).filter(a=> a.reason==='Ajuste manual' && !localIds.has(a.id));
  remoteNewManual.forEach(ra=>{
    const match = localManual.find(la=> la.productId===ra.productId && Math.abs(new Date(la.ts)-new Date(ra.ts)) < 48*3600*1000);
    if(match){
      conflicts.push({type:'stockdup', productId:ra.productId, localAdjId:match.id, remoteAdjId:ra.id, localDelta:match.delta, remoteDelta:ra.delta});
    }
  });
  return conflicts;
}
function conflictKey(c){
  if(c.type==='stockdup') return c.type+':'+c.productId+':'+c.remoteAdjId;
  if(c.type==='oversell') return c.type+':'+c.productId;
  return c.type+':'+c.productId;
}

/* ---------- Sobregiro de stock: reconstruir la línea de tiempo exacta de un producto ---------- */
function buildProductTimeline(productId, purchases, sales, adjustments){
  const events = [];
  (purchases||[]).forEach(pu=> (pu.items||[]).forEach(it=>{
    if(it.productId===productId) events.push({ts:pu.createdAt||pu.date, qty:it.qty, kind:'compra', ref:pu.id});
  }));
  (sales||[]).forEach(s=> (s.items||[]).forEach((it,idx)=>{
    if(it.productId===productId) events.push({ts:s.date, qty:-it.qty, kind:'venta', ref:s.id, itemIndex:idx, totalQtyInSale:it.qty});
  }));
  (adjustments||[]).forEach(a=>{
    if(a.productId===productId) events.push({ts:a.ts, qty:a.delta, kind:'ajuste', ref:a.id, reason:a.reason});
  });
  events.sort((a,b)=> new Date(a.ts) - new Date(b.ts));
  let bal = 0, culprit = null, balanceBeforeCulprit = 0;
  events.forEach(e=>{
    const before = bal;
    bal += e.qty;
    e.balanceAfter = bal;
    if(bal<0 && !culprit){ culprit = e; balanceBeforeCulprit = before; }
  });
  return {events, finalBalance:bal, culprit, balanceBeforeCulprit};
}
function detectOversellConflicts(remote){
  const purchases = mergeById(DB.purchases, remote.purchases).merged;
  const sales = mergeById(DB.sales, remote.sales).merged;
  const adjustments = mergeById(DB.stockAdjustments, remote.stockAdjustments).merged;
  const productIds = new Set(DB.products.map(p=>p.id).concat((remote.products||[]).map(p=>p.id)));
  const conflicts = [];
  productIds.forEach(pid=>{
    const tl = buildProductTimeline(pid, purchases, sales, adjustments);
    if(tl.finalBalance < 0 && tl.culprit){
      conflicts.push({
        type:'oversell', productId:pid, deficit:-tl.finalBalance,
        balanceBeforeCulprit: tl.balanceBeforeCulprit,
        culprit: tl.culprit
      });
    }
  });
  return conflicts;
}
function fmtTime(ts){ try{ return new Date(ts).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }catch(e){ return ts; } }

function syncCounts(remote){
  function newCount(key){ const localIds = new Set((DB[key]||[]).map(x=>x.id)); return (remote[key]||[]).filter(x=>!localIds.has(x.id)).length; }
  const localProdIds = new Set(DB.products.map(p=>p.id));
  return {
    ventas:newCount('sales'), compras:newCount('purchases'), gastos:newCount('expenses'),
    caja:newCount('cashCounts'), notas:newCount('notes'), eventos:newCount('events'),
    recordatorios:newCount('reminders'), perdidas:newCount('losses'),
    clientes:newCount('clients'), pagos:newCount('clientPayments'),
    productos:(remote.products||[]).filter(p=>!localProdIds.has(p.id)).length
  };
}

function openSyncReview(remote){
  if(!remote || !remote.deviceId){ toast('Archivo de sincronización inválido'); return; }
  if(remote.deviceId === DB.deviceId){ toast('Ese archivo es de este mismo dispositivo'); return; }
  window._syncRemote = remote;
  window._syncConflicts = [
    ...detectDeleteConflicts(DB.products, remote.products||[]),
    ...detectStockDupConflicts(DB.stockAdjustments, remote.stockAdjustments||[]),
    ...detectOversellConflicts(remote)
  ];
  window._syncDecisions = {};
  renderSyncReview();
}
function renderSyncReview(){
  const remote = window._syncRemote;
  const conflicts = window._syncConflicts;
  const counts = syncCounts(remote);
  const parts = [];
  if(counts.ventas) parts.push(counts.ventas+' venta(s)');
  if(counts.compras) parts.push(counts.compras+' compra(s)');
  if(counts.productos) parts.push(counts.productos+' producto(s) nuevo(s)');
  if(counts.gastos) parts.push(counts.gastos+' gasto(s)');
  if(counts.caja) parts.push(counts.caja+' conteo(s) de caja');
  if(counts.notas) parts.push(counts.notas+' nota(s)');
  if(counts.eventos) parts.push(counts.eventos+' evento(s)');
  if(counts.recordatorios) parts.push(counts.recordatorios+' recordatorio(s)');
  if(counts.perdidas) parts.push(counts.perdidas+' pérdida(s) de producto');
  if(counts.clientes) parts.push(counts.clientes+' cliente(s) nuevo(s)');
  if(counts.pagos) parts.push(counts.pagos+' pago(s) de cliente');
  const summaryText = parts.length? parts.join(', ')+' se combinarán automáticamente.' : 'No hay registros nuevos para combinar.';

  let html = `
    <div class="sheet-header"><div class="sheet-title">Revisar sincronización</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="card"><div class="small">✅ ${summaryText}</div></div>`;

  if(conflicts.length){
    html += `<div class="section-title">Necesita tu decisión (${conflicts.length})</div>`;
    conflicts.forEach(c=>{
      const key = conflictKey(c);
      const decided = window._syncDecisions[key];
      if(c.type==='delete'){
        html += `<div class="card">
          <div class="small" style="margin-bottom:10px">🗑️ <b>${esc(c.name)}</b>: está eliminado en un teléfono y activo en el otro.</div>
          <div class="gap-2">
            <button class="btn ${decided==='delete'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="resolveSyncConflict('${key}','delete')">Eliminar</button>
            <button class="btn ${decided==='keep'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="resolveSyncConflict('${key}','keep')">Mantener activo</button>
          </div>
        </div>`;
      } else if(c.type==='stockdup'){
        const pName = (DB.products.find(p=>p.id===c.productId)||(remote.products||[]).find(p=>p.id===c.productId)||{}).name || 'Producto';
        html += `<div class="card">
          <div class="small" style="margin-bottom:10px">⚠️ <b>${esc(pName)}</b>: el stock se ajustó dos veces cerca de la misma hora (${c.localDelta>0?'+':''}${c.localDelta} y ${c.remoteDelta>0?'+':''}${c.remoteDelta}). ¿Fue la misma corrección contada dos veces?</div>
          <div class="gap-2">
            <button class="btn ${decided==='once'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="resolveSyncConflict('${key}','once')">Sí, aplicar solo una</button>
            <button class="btn ${decided==='both'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="resolveSyncConflict('${key}','both')">No, son distintas</button>
          </div>
        </div>`;
      } else if(c.type==='oversell'){
        const pName = (DB.products.find(p=>p.id===c.productId)||(remote.products||[]).find(p=>p.id===c.productId)||{}).name || 'Producto';
        const cul = c.culprit;
        const culLabel = cul.kind==='venta' ? 'Se vendieron '+cul.totalQtyInSale+' unidades' : (cul.kind==='ajuste' ? 'Ajuste de '+cul.qty : 'Movimiento');
        html += `<div class="card">
          <div class="small" style="margin-bottom:8px">⚠️ <b>${esc(pName)}</b>: al combinar las ventas de los dos teléfonos, quedó en <b style="color:var(--danger)">${-c.deficit}</b> (faltan ${c.deficit} unidad${c.deficit>1?'es':''}).</div>
          <div class="wa-preview" style="margin-bottom:10px">Antes había ${c.balanceBeforeCulprit} disponibles.
${culLabel} a las ${fmtTime(cul.ts)} → esto deja el faltante de ${c.deficit}.</div>
          <div class="small muted" style="margin-bottom:8px">¿Qué pasó en realidad?</div>
          <div class="stack">
            <button class="btn ${decided==='zero'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="resolveSyncConflict('${key}','zero')">No había más — ajustar a 0</button>
            <button class="btn ${decided==='addstock'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="resolveSyncConflict('${key}','addstock')">Sí tenía ${c.deficit} más — se me olvidó registrarlo</button>
            <button class="btn ${decided==='fixsale'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="resolveSyncConflict('${key}','fixsale')">Esa venta de las ${fmtTime(cul.ts)} estuvo mal — corregirla</button>
          </div>
        </div>`;
      }
    });
  }

  html += `<button class="btn btn-primary btn-block mt-3" onclick="confirmSync()">✅ Confirmar sincronización</button>`;

function resolveSyncConflict(key, choice){
  window._syncDecisions[key] = choice;
  renderSyncReview();
}
function confirmSync(){
  const conflicts = window._syncConflicts;
  const unresolved = conflicts.filter(c=>!window._syncDecisions[conflictKey(c)]);
  if(unresolved.length){ toast('Resuelve los '+unresolved.length+' caso(s) marcados antes de continuar'); return; }
  applySync(window._syncRemote, window._syncDecisions, conflicts);
}

function applySync(remote, decisions, conflicts){
  let addedCount = 0;

  ['purchases','sales','expenses','cashCounts','notes','events','reminders','losses','clients','clientPayments'].forEach(key=>{
    const r = mergeById(DB[key], remote[key]);
    DB[key] = r.merged;
    addedCount += r.added;
  });

  // Ajustes de stock: si el usuario marcó un par como duplicado, no se agrega el del otro teléfono
  const skipIds = new Set(conflicts.filter(c=>c.type==='stockdup' && decisions[conflictKey(c)]==='once').map(c=>c.remoteAdjId));
  const filteredRemoteAdj = (remote.stockAdjustments||[]).filter(a=>!skipIds.has(a.id));
  const rAdj = mergeById(DB.stockAdjustments, filteredRemoteAdj);
  DB.stockAdjustments = rAdj.merged;
  addedCount += rAdj.added;

  // Categorías y subcategorías: unir por id
  const catMap = {};
  DB.categories.forEach(c=> catMap[c.id]=c);
  (remote.categories||[]).forEach(rc=>{
    if(!catMap[rc.id]){ catMap[rc.id]=rc; addedCount++; }
    else{
      const subMap = {};
      catMap[rc.id].subs.forEach(s=> subMap[s.id]=s);
      (rc.subs||[]).forEach(rs=>{ if(!subMap[rs.id]){ catMap[rc.id].subs.push(rs); addedCount++; } });
    }
  });
  DB.categories = Object.values(catMap);

  // Productos: unir por id. Si hubo conflicto de eliminado/activo, se aplica lo que decidió el usuario.
  const deleteDecision = {};
  conflicts.filter(c=>c.type==='delete').forEach(c=>{ deleteDecision[c.productId] = decisions[conflictKey(c)]; });

  const prodMap = {};
  DB.products.forEach(p=> prodMap[p.id]=p);
  (remote.products||[]).forEach(rp=>{
    const lp = prodMap[rp.id];
    if(!lp){ prodMap[rp.id]=rp; addedCount++; return; }
    const decision = deleteDecision[rp.id];
    const lt = lp.updatedAt||lp.createdAt||'';
    const rt = rp.updatedAt||rp.createdAt||'';
    let merged = (rt > lt) ? Object.assign({}, rp) : Object.assign({}, lp);
    if(decision){
      merged.deletedAt = decision==='delete' ? (lp.deletedAt || rp.deletedAt || new Date().toISOString()) : null;
    }
    merged.stock = lp.stock;
    prodMap[rp.id] = merged;
  });
  DB.products = Object.values(prodMap);

  DB.invoiceCounter = Math.max(DB.invoiceCounter||1001, remote.invoiceCounter||1001);
  DB.saleCounter = Math.max(DB.saleCounter||1001, remote.saleCounter||1001);
  recomputeStock();

  // Sobregiros: aplicar lo que el usuario decidió para cada producto que quedó en negativo
  const noteLines = [];
  conflicts.filter(c=>c.type==='oversell').forEach(c=>{
    const key = conflictKey(c);
    const choice = decisions[key];
    const p = DB.products.find(p=>p.id===c.productId);
    const pName = p? p.name : 'Producto';
    const cul = c.culprit;
    let resultLine = '';
    if(choice==='zero'){
      DB.stockAdjustments.push({id:uid(), productId:c.productId, delta:c.deficit, reason:'Ajuste por sobregiro (a 0)', ts:new Date().toISOString()});
      resultLine = `Se ajustó a 0: no había más existencia real.`;
    } else if(choice==='addstock'){
      DB.stockAdjustments.push({id:uid(), productId:c.productId, delta:c.deficit, reason:'Ajuste por sobregiro (unidad no registrada)', ts:new Date().toISOString()});
      resultLine = `Se agregaron ${c.deficit} unidad(es) al almacén: sí existían pero no se habían registrado.`;
    } else if(choice==='fixsale' && cul.kind==='venta'){
      const sale = DB.sales.find(s=>s.id===cul.ref);
      if(sale){
        const item = sale.items[cul.itemIndex];
        if(item){
          const newQty = Math.max(0, item.qty - c.deficit);
          item.qty = newQty;
          sale.total = sale.items.reduce((a,it)=>a+it.qty*it.price,0);
        }
      }
      resultLine = `Se corrigió la venta de las ${fmtTime(cul.ts)}: se registraron ${c.deficit} unidad(es) de menos.`;
    }
    noteLines.push(`🧾 ${pName} — sobregiro de ${c.deficit} unidad(es) detectado al sincronizar.\nAntes había ${c.balanceBeforeCulprit} disponibles. Venta de las ${fmtTime(cul.ts)} dejó el faltante.\nDecisión: ${resultLine}`);
  });
  conflicts.filter(c=>c.type==='delete').forEach(c=>{
    const choice = decisions[conflictKey(c)];
    noteLines.push(`🗑️ ${c.name} — estaba eliminado en un teléfono y activo en el otro. Decisión: ${choice==='delete'?'se eliminó':'se mantuvo activo'}.`);
  });
  conflicts.filter(c=>c.type==='stockdup').forEach(c=>{
    const choice = decisions[conflictKey(c)];
    const pName = (DB.products.find(p=>p.id===c.productId)||{}).name || 'Producto';
    noteLines.push(`⚠️ ${pName} — posible ajuste de stock duplicado (${c.localDelta} y ${c.remoteDelta}). Decisión: ${choice==='once'?'se aplicó solo una vez':'se aplicaron las dos, eran distintas'}.`);
  });
  if(noteLines.length){
    DB.notes.push({
      id:uid(), date:todayISO(),
      text:`Resumen de sincronización (${nowStamp()}):\n\n`+noteLines.join('\n\n')
    });
  }

  recomputeStock();
  save();
  ui.closeSheet();
  DB.lastSyncAt = nowStamp();
  save();
  toast(addedCount>0? `Sincronizado: ${addedCount} registro(s) combinado(s)` : 'Ya estaba todo sincronizado');
  renderView();
}

document.getElementById('restoreInputHidden').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = mergeWithDefaults(JSON.parse(ev.target.result));
      // Ya no reemplaza nada: SOLO agrega lo que no exista todavía (por id). Nunca borra,
      // así un archivo viejo jamás puede llevarse por delante lo que ya tienes en la nube.
      let addedCount = 0;
      ['products','purchases','sales','expenses','cashCounts','notes','events','reminders','losses',
       'clients','clientPayments','clientDebtAdjustments','consignments','clientReturns','clientSales','orders'
      ].forEach(key=>{
        if(!Array.isArray(DB[key]) || !Array.isArray(data[key])) return;
        const r = mergeById(DB[key], data[key]);
        DB[key] = r.merged;
        addedCount += r.added;
      });
      const catMap = {}; DB.categories.forEach(c=>catMap[c.id]=c);
      (data.categories||[]).forEach(c=>{ if(!catMap[c.id]){ DB.categories.push(c); catMap[c.id]=c; } });
      recomputeStock();
      save(); applySettings(); renderView();
      toast(addedCount>0 ? 'Se agregaron '+addedCount+' registro(s) que no tenías. Nada se borró.' : 'Ese archivo no tenía nada nuevo que agregar.');
    }catch(err){ toast('Archivo inválido'); }
  };
  reader.readAsText(file);
  e.target.value='';
});
async function resetApp(){
  if(!app.userId){
    if(!confirm('Esto borrará TODOS los datos (productos, ventas, compras, etc). ¿Seguro?')) return;
    if(!confirm('Última confirmación: esta acción no se puede deshacer. ¿Restablecer todo?')) return;
    DB = defaultDB();
    save(); applySettings(); toast('Aplicación restablecida'); app.go('home');
    return;
  }
  const typed = prompt('Esto borra TODOS los datos del negocio para TODO EL EQUIPO (no solo este teléfono), incluida la nube: productos, ventas, clientes, todo. No se puede deshacer.\n\nEscribe BORRAR TODO para confirmar:');
  if(typed !== 'BORRAR TODO'){ toast('Cancelado, no se borró nada'); return; }
  toast('Borrando en la nube, un momento...');
  // Se borra la nube PRIMERO y se espera a que termine, y solo DESPUÉS se reemplaza el DB
  // local por uno nuevo (que sí se vuelve a subir). Si se hiciera al revés, la subida del
  // DB local nuevo podría cruzarse con el borrado y el reset quedaría a medias.
  const tables = ['products','categories','clients','reminders','orders',
    'purchases','sales','client_payments','client_debt_adjustments','consignments','client_returns',
    'client_sales','expenses','losses','stock_adjustments','cash_counts','calendar_events','calendar_notes'];
  for(const t of tables){
    try{ await sb.from(t).delete().not('id','is', null); }catch(err){ console.error('Reset '+t, err); }
  }
  try{ await sb.from('client_product_prices').delete().not('client_id','is', null); }catch(err){ console.error('Reset client_product_prices', err); }
  Object.keys(_syncedIds).forEach(k=>_syncedIds[k]=new Set());
  DB = defaultDB();
  save(); applySettings(); toast('Aplicación restablecida para todo el equipo, incluida la nube'); app.go('home');
}

applySettings();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
</script>
