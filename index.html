<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AlmacénPro</title>
<meta name="theme-color" content="#173F38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AlmacénPro">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EA;
  --surface:#FFFFFF;
  --surface-2:#FBF9F4;
  --ink:#1E2420;
  --ink-soft:#5B655F;
  --primary:#173F38;
  --primary-2:#2A6357;
  --accent:#DE9A3C;
  --accent-ink:#3A2A0D;
  --danger:#B23A3A;
  --ok:#3E7A4D;
  --border:#E4DFD1;
  --radius:14px;
  --font-scale:1;
  --shadow:0 2px 10px rgba(23,63,56,.08);
}
*{box-sizing:border-box;}
html{-webkit-tap-highlight-color:transparent;}
body{
  margin:0;
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:calc(15px * var(--font-scale));
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:1em;}
h1,h2,h3,h4{margin:0;font-family:'Inter',sans-serif;letter-spacing:-.01em;}
p{margin:0;}
img{max-width:100%;display:block;}

/* ---------- SCREENS ---------- */
.screen{display:none;min-height:100vh;}
.screen.active{display:block;}

/* Login */
#screen-login{
  background:radial-gradient(circle at 20% 10%, #2A6357 0%, #173F38 45%, #0E2924 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  color:#fff;
}
.login-card{width:100%;max-width:380px;text-align:center;}
.login-mark{
  width:64px;height:64px;border-radius:16px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  font-size:30px;font-weight:800;color:var(--accent-ink);
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.login-title{font-size:26px;font-weight:800;margin-bottom:4px;}
.login-sub{opacity:.75;font-size:14px;margin-bottom:34px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.role-btn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  border-radius:var(--radius);
  padding:22px 10px;
  color:#fff;
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:.15s;
}
.role-btn:active{transform:scale(.96);background:rgba(255,255,255,.16);}
.role-icon{font-size:28px;}
.role-label{font-weight:700;font-size:14.5px;}
.role-desc{font-size:11.5px;opacity:.7;}
.login-footer{margin-top:28px;font-size:11px;opacity:.5;}

/* App shell */
#screen-main{display:flex;flex-direction:column;min-height:100vh;}
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--primary);
  color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
.topbar-title{font-size:15px;font-weight:700;}
.topbar-role{font-size:10.5px;opacity:.75;text-transform:uppercase;letter-spacing:.06em;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.icon-btn{
  background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;
}
.icon-btn:active{background:rgba(255,255,255,.24);}

#view-container{flex:1;padding:14px 14px 90px;max-width:640px;margin:0 auto;width:100%;}

.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -2px 12px rgba(0,0,0,.06);
}
.nav-btn{
  flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;color:var(--ink-soft);cursor:pointer;border-radius:10px;
}
.nav-btn .ic{font-size:19px;}
.nav-btn .lb{font-size:9.5px;font-weight:600;}
.nav-btn.active{color:var(--primary);}
.nav-btn.active .ic{transform:translateY(-1px);}

/* Cards / generic */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:18px 2px 8px;}
.section-title:first-child{margin-top:0;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stack{display:flex;flex-direction:column;gap:10px;}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--ink-soft);}
.chip.warn{background:#FBEBD8;border-color:#F0CE9C;color:#8A5A17;}
.chip.danger{background:#F8E3E1;border-color:#E9BBB6;color:#8A2E2E;}
.chip.ok{background:#E3F1E6;border-color:#B9DEC1;color:#2C5C38;}
.badge-num{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:11px;padding:2px 7px;border-radius:999px;}

.btn{
  border:none;border-radius:11px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-2);}
.btn-accent{background:var(--accent);color:var(--accent-ink);}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--ink);}
.btn-danger{background:#F8E3E1;color:var(--danger);}
.btn-ghost{background:var(--surface-2);color:var(--ink);}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:9px;}
.btn-block{width:100%;}
.fab{
  position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));
  width:54px;height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);
  border:none;font-size:26px;box-shadow:0 8px 20px rgba(222,154,60,.45);cursor:pointer;z-index:15;
  display:flex;align-items:center;justify-content:center;
}

input[type=text],input[type=number],input[type=date],input[type=search],input[type=password],select,textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-2);outline-offset:1px;}
label{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;display:block;}
.field{margin-bottom:12px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.searchbar{position:relative;margin-bottom:14px;}
.searchbar input{padding-left:36px;}
.searchbar .sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;}

.empty{
  text-align:center;padding:40px 16px;color:var(--ink-soft);
}
.empty .eic{font-size:34px;margin-bottom:8px;}
.empty .et{font-weight:700;color:var(--ink);margin-bottom:4px;}
.empty .ed{font-size:12.5px;}

/* Modal / sheet */
.overlay{position:fixed;inset:0;background:rgba(15,25,20,.5);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.overlay.active{display:flex;}
.sheet{
  background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;
  max-height:92vh;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));
  animation:slideup .22s ease-out;
}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:38px;height:4px;background:var(--border);border-radius:99px;margin:2px auto 14px;}
.sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sheet-title{font-size:17px;font-weight:800;}
.sheet-close{background:var(--surface-2);border:none;width:30px;height:30px;border-radius:9px;font-size:15px;cursor:pointer;color:var(--ink-soft);}

.toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;
  z-index:80;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.list-item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.thumb{width:46px;height:46px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-soft);overflow:hidden;flex-shrink:0;border:1px solid var(--border);}
.thumb img{width:100%;height:100%;object-fit:cover;}
.li-body{flex:1;min-width:0;}
.li-title{font-weight:700;font-size:13.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.li-right{text-align:right;flex-shrink:0;}
.li-price{font-weight:800;font-size:14px;}
.li-stock{font-size:10.5px;color:var(--ink-soft);}

.tabbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.tabbar::-webkit-scrollbar{display:none;}
.tab-pill{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
.tab-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
.stat-val{font-size:20px;font-weight:800;}
.stat-lbl{font-size:11px;color:var(--ink-soft);font-weight:600;margin-top:2px;}

.swatch-row{display:flex;gap:10px;flex-wrap:wrap;}
.swatch{width:38px;height:38px;border-radius:11px;cursor:pointer;border:2px solid transparent;}
.swatch.sel{border-color:var(--ink);}

.denom-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
.denom-row:last-child{border-bottom:none;}
.denom-label{font-weight:700;font-size:14px;}
.denom-input{width:78px;text-align:center;}
.denom-sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}

.cart-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.qty-ctl{display:flex;align-items:center;gap:8px;}
.qty-btn{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface-2);font-weight:800;cursor:pointer;}

.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;position:relative;color:var(--ink-soft);}
.cal-cell.inmonth{color:var(--ink);}
.cal-cell.today{border:1.5px solid var(--primary);}
.cal-cell.sel{background:var(--primary);color:#fff;}
.cal-dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent);}
.cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--ink-soft);padding-bottom:4px;}

.wa-preview{background:#E9FBE0;border:1px solid #BFE9AC;border-radius:12px;padding:12px;font-size:12.5px;white-space:pre-wrap;font-family:'JetBrains Mono',monospace;line-height:1.5;color:#264A1B;}

hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
.muted{color:var(--ink-soft);}
.small{font-size:11.5px;}
.text-right{text-align:right;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.gap-2{display:flex;gap:8px;}
.mt-2{margin-top:8px;}
.mt-3{margin-top:14px;}
.w-full{width:100%;}
.hidden{display:none !important;}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="screen-login" class="screen active">
  <div class="login-card">
    <div class="login-mark">A</div>
    <div class="login-title" id="loginBizName">AlmacénPro</div>
    <div class="login-sub">Elige cómo vas a entrar</div>
    <div class="role-grid">
      <div class="role-btn" onclick="app.login('admin')">
        <div class="role-icon">🗝️</div>
        <div class="role-label">Administrador</div>
        <div class="role-desc">Acceso total</div>
      </div>
      <div class="role-btn" onclick="app.login('vendedor')">
        <div class="role-icon">🛒</div>
        <div class="role-label">Vendedor</div>
        <div class="role-desc">Solo ventas y consulta</div>
      </div>
    </div>
    <div class="login-footer">AlmacénPro · datos guardados en este dispositivo</div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="screen-main" class="screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-mark">A</div>
      <div>
        <div class="topbar-title" id="topTitle">Inicio</div>
        <div class="topbar-role" id="topRole">Administrador</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" onclick="app.logout()" title="Cambiar modo">⇄</button>
    </div>
  </div>

  <main id="view-container"></main>

  <nav class="bottomnav" id="bottomnav"></nav>
  <button class="fab hidden" id="fabBtn"></button>
</div>

<!-- ===================== MODAL / SHEET ===================== -->
<div class="overlay" id="overlay" onclick="if(event.target===this)ui.closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="fileInputHidden" accept="image/*" style="display:none">
<input type="file" id="restoreInputHidden" accept="application/json" style="display:none">

<script>
/* =========================================================
   ALMACÉNPRO — App de gestión de inventario y ventas
   Todo se guarda en localStorage del navegador/dispositivo.
   ========================================================= */

const STORE_KEY = 'almacenpro_db_v1';
const THEMES = {
  verde:   {primary:'#173F38', primary2:'#2A6357', accent:'#DE9A3C'},
  azul:    {primary:'#173A56', primary2:'#2A5C82', accent:'#3CA7DE'},
  ciruela: {primary:'#3B1D3E', primary2:'#5E3163', accent:'#DE7B9A'},
  carbon:  {primary:'#22262B', primary2:'#3A4048', accent:'#E0B23C'},
  terra:   {primary:'#4A2A1B', primary2:'#7A4529', accent:'#3CA789'},
};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowStamp(){ return new Date().toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}); }
function fmt(n){ n = Number(n)||0; return DB.meta.currency + n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function defaultDB(){
  return {
    meta:{bizName:'Mi Negocio', currency:'$'},
    categories:[
      {id:uid(), name:'General', subs:[{id:uid(), name:'Varios'}]}
    ],
    products:[],
    purchases:[],
    sales:[],
    expenses:[],
    cashCounts:[],
    notes:[],
    events:[],
    settings:{fontScale:1, theme:'verde'},
    invoiceCounter: 1001
  };
}

let DB = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultDB();
    const d = JSON.parse(raw);
    return Object.assign(defaultDB(), d);
  }catch(e){ return defaultDB(); }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch(e){ toast('No se pudo guardar (memoria llena)'); }
}

/* ---------------- TOAST ---------------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- UI: sheet / modal ---------------- */
const ui = {
  openSheet(html){
    document.getElementById('sheet').innerHTML =
      '<div class="sheet-handle"></div>' + html;
    document.getElementById('overlay').classList.add('active');
  },
  closeSheet(){
    document.getElementById('overlay').classList.remove('active');
  }
};

/* ---------------- APP CORE ---------------- */
const app = {
  role: null,
  view: 'home',
  invContext: {catId:null, subId:null, q:''},
  cart: [],

  login(role){
    this.role = role;
    document.getElementById('screen-login').classList.remove('active');
    document.getElementById('screen-main').classList.add('active');
    document.getElementById('topRole').textContent = role==='admin' ? 'Administrador' : 'Vendedor';
    applySettings();
    buildNav();
    this.go(role==='admin' ? 'home' : 'sales');
  },
  logout(){
    this.role = null;
    document.getElementById('screen-main').classList.remove('active');
    document.getElementById('screen-login').classList.add('active');
    document.getElementById('loginBizName').textContent = DB.meta.bizName || 'AlmacénPro';
  },
  go(view){
    this.view = view;
    ui.closeSheet();
    renderView();
    highlightNav();
  }
};

function applySettings(){
  const s = DB.settings;
  document.documentElement.style.setProperty('--font-scale', s.fontScale || 1);
  const th = THEMES[s.theme] || THEMES.verde;
  document.documentElement.style.setProperty('--primary', th.primary);
  document.documentElement.style.setProperty('--primary-2', th.primary2);
  document.documentElement.style.setProperty('--accent', th.accent);
  document.getElementById('loginBizName').textContent = DB.meta.bizName || 'AlmacénPro';
}

/* ---------------- NAV ---------------- */
function buildNav(){
  const nav = document.getElementById('bottomnav');
  let items;
  if(app.role==='admin'){
    items = [
      {v:'home', ic:'🏠', lb:'Inicio'},
      {v:'inventory', ic:'📦', lb:'Inventario'},
      {v:'sales', ic:'🛒', lb:'Vender'},
      {v:'cash', ic:'💵', lb:'Caja'},
      {v:'more', ic:'⋯', lb:'Más'},
    ];
  } else {
    items = [
      {v:'sales', ic:'🛒', lb:'Vender'},
      {v:'inventory', ic:'📦', lb:'Inventario'},
      {v:'salehistory', ic:'🧾', lb:'Historial'},
      {v:'cash', ic:'💵', lb:'Caja'},
      {v:'more', ic:'⋯', lb:'Más'},
    ];
  }
  nav.innerHTML = items.map(i=>
    `<button class="nav-btn" data-v="${i.v}" onclick="handleNav('${i.v}')">
      <span class="ic">${i.ic}</span><span class="lb">${i.lb}</span>
    </button>`).join('');
}
function handleNav(v){
  if(v==='more'){ openMoreSheet(); return; }
  app.go(v);
}
function highlightNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.v===app.view || (b.dataset.v==='more' && ['purchases','expenses','reports','calendar','settings'].includes(app.view)));
  });
  const titles = {home:'Inicio', inventory:'Inventario', sales:'Vender', cash:'Caja',
    purchases:'Compras', salehistory:'Historial de ventas', expenses:'Gastos y finanzas',
    reports:'Reportes', calendar:'Calendario y notas', settings:'Ajustes'};
  document.getElementById('topTitle').textContent = titles[app.view] || 'AlmacénPro';
}
function openMoreSheet(){
  const admin = app.role==='admin';
  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">Más opciones</div>
      <button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="stack">
      ${admin? moreRow('purchases','🧾','Compras e invoices'):''}
      ${admin? moreRow('salehistory','📜','Historial de ventas'):''}
      ${admin? moreRow('expenses','💸','Gastos y finanzas'):''}
      ${admin? moreRow('reports','📊','Reportes de productos'):''}
      ${moreRow('calendar','🗓️','Calendario y notas')}
      ${moreRow('settings','⚙️','Ajustes')}
    </div>
  `);
}
function moreRow(v,ic,lb){
  return `<button class="btn btn-ghost btn-block" style="justify-content:flex-start;font-size:14.5px" onclick="app.go('${v}')">
    <span style="font-size:18px;margin-right:4px">${ic}</span> ${lb}
  </button>`;
}

function renderView(){
  const c = document.getElementById('view-container');
  const fab = document.getElementById('fabBtn');
  fab.classList.add('hidden'); fab.onclick=null;
  switch(app.view){
    case 'home': c.innerHTML = viewHome(); break;
    case 'inventory': c.innerHTML = viewInventory(); fab.classList.toggle('hidden', app.role!=='admin'); fab.textContent='+'; fab.onclick=()=>openProductForm(); break;
    case 'sales': c.innerHTML = viewSales(); break;
    case 'cash': c.innerHTML = viewCash(); break;
    case 'purchases': c.innerHTML = viewPurchases(); fab.classList.remove('hidden'); fab.textContent='+'; fab.onclick=()=>openPurchaseForm(); break;
    case 'salehistory': c.innerHTML = viewSaleHistory(); break;
    case 'expenses': c.innerHTML = viewExpenses(); fab.classList.remove('hidden'); fab.textContent='+'; fab.onclick=()=>openExpenseForm(); break;
    case 'reports': c.innerHTML = viewReports(); break;
    case 'calendar': c.innerHTML = viewCalendar(); break;
    case 'settings': c.innerHTML = viewSettings(); break;
    default: c.innerHTML = viewHome();
  }
}

function thumbHtml(p){
  return p.photo ? `<div class="thumb"><img src="${p.photo}"></div>` : `<div class="thumb">📦</div>`;
}
function allSubcats(){
  const list=[];
  DB.categories.forEach(c=>c.subs.forEach(s=>list.push({catId:c.id,catName:c.name,subId:s.id,subName:s.name})));
  return list;
}
function catName(id){ const c=DB.categories.find(c=>c.id===id); return c?c.name:''; }
function subName(catId,subId){ const c=DB.categories.find(c=>c.id===catId); const s=c&&c.subs.find(s=>s.id===subId); return s?s.name:''; }

function viewInventory(){
  const ctx = app.invContext;
  let products = DB.products.slice();
  if(ctx.catId) products = products.filter(p=>p.catId===ctx.catId);
  if(ctx.subId) products = products.filter(p=>p.subId===ctx.subId);
  if(ctx.q){
    const q = ctx.q.toLowerCase();
    products = products.filter(p=>(p.name+' '+(p.desc||'')).toLowerCase().includes(q));
  }
  const isAdmin = app.role==='admin';

  let html = `<div class="searchbar">
    <span class="sic">🔎</span>
    <input type="text" placeholder="Buscar producto..." value="${esc(ctx.q)}" oninput="app.invContext.q=this.value; renderView()">
  </div>`;

  html += `<div class="tabbar">
    <div class="tab-pill ${!ctx.catId?'active':''}" onclick="app.invContext.catId=null;app.invContext.subId=null;renderView()">Todos</div>
    ${DB.categories.map(c=>`<div class="tab-pill ${ctx.catId===c.id?'active':''}" onclick="app.invContext.catId='${c.id}';app.invContext.subId=null;renderView()">${esc(c.name)}</div>`).join('')}
    ${isAdmin? `<div class="tab-pill" onclick="openCategoryForm()">+ Categoría</div>`:''}
  </div>`;

  if(ctx.catId){
    const cat = DB.categories.find(c=>c.id===ctx.catId);
    if(cat && cat.subs.length){
      html += `<div class="tabbar">
        <div class="tab-pill ${!ctx.subId?'active':''}" onclick="app.invContext.subId=null;renderView()">Todas las subcat.</div>
        ${cat.subs.map(s=>`<div class="tab-pill ${ctx.subId===s.id?'active':''}" onclick="app.invContext.subId='${s.id}';renderView()">${esc(s.name)}</div>`).join('')}
        ${isAdmin? `<div class="tab-pill" onclick="openSubcatForm('${cat.id}')">+ Subcat.</div>`:''}
      </div>`;
    } else if(isAdmin){
      html += `<button class="btn btn-outline btn-sm mt-2" onclick="openSubcatForm('${cat.id}')">+ Agregar subcategoría</button>`;
    }
  }

  if(!products.length){
    html += `<div class="empty"><div class="eic">📦</div><div class="et">Sin productos</div>
      <div class="ed">${isAdmin?'Toca el botón + para agregar el primero.':'No hay productos que coincidan.'}</div></div>`;
  } else {
    html += `<div class="card">`;
    products.forEach(p=>{
      const low = p.stock<=p.minStock;
      const mainPrice = (p.prices && p.prices[0]) ? p.prices[0].price : 0;
      html += `<div class="list-item" onclick="openProductDetail('${p.id}')" style="cursor:pointer">
        ${thumbHtml(p)}
        <div class="li-body">
          <div class="li-title">${esc(p.name)}</div>
          <div class="li-sub">${esc(catName(p.catId))}${p.subId? ' · '+esc(subName(p.catId,p.subId)):''}</div>
        </div>
        <div class="li-right">
          <div class="li-price mono">${fmt(mainPrice)}</div>
          <div class="li-stock">${low?'<span class="chip danger">bajo</span>':''} ${p.stock} und.</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}

document.getElementById('fileInputHidden').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const maxDim = 360;
      let w=img.width, h=img.height;
      if(w>h){ if(w>maxDim){h=h*maxDim/w; w=maxDim;} } else { if(h>maxDim){w=w*maxDim/h; h=maxDim;} }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      window._editingProduct.photo = dataUrl;
      const prev = document.getElementById('prodPhotoPreview');
      if(prev) prev.innerHTML = `<img src="${dataUrl}">`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value='';
});

  const ep = window._editingProduct;

    subId: document.getElementById('fpSub').value,
    name,
    desc: document.getElementById('fpDesc').value.trim(),
    measures: document.getElementById('fpMeasures').value.trim(),
    photo: ep.photo || '',
    costPrice: parseFloat(document.getElementById('fpCost').value)||0,
    stock: parseFloat(document.getElementById('fpStock').value)||0,
    minStock: parseFloat(document.getElementById('fpMin').value)||0,
    prices: ep.prices.filter(pr=>pr.label.trim()!=='').map(pr=>({label:pr.label.trim(),price:pr.price||0})),
    createdAt: ep.createdAt || new Date().toISOString()
  };
  if(!data.prices.length) data.prices=[{label:'Venta', price:0}];
  const idx = DB.products.findIndex(p=>p.id===data.id);
  if(idx>=0) DB.products[idx]=data; else DB.products.push(data);
  save(); ui.closeSheet(); toast('Producto guardado'); renderView();
}

function addPurchaseLine(){
  const pid = document.getElementById('pfProduct').value;
  const qty = parseFloat(document.getElementById('pfQty').value)||0;
  const cost = parseFloat(document.getElementById('pfCost').value)||0;
  if(!pid || qty<=0) return toast('Selecciona producto y cantidad');
  window._purchaseCart.push({productId:pid, qty, cost});
  renderPurchaseLines();
}
function renderPurchaseLines(){
  const wrap = document.getElementById('purchaseLines');
  let total=0;
  wrap.innerHTML = window._purchaseCart.map((l,i)=>{
    const p = DB.products.find(p=>p.id===l.productId);
    total += l.qty*l.cost;
    return `<div class="cart-line"><div class="li-body"><div class="li-title">${esc(p?p.name:'?')}</div><div class="li-sub">${l.qty} x ${fmt(l.cost)}</div></div>
      <div class="mono" style="font-weight:700">${fmt(l.qty*l.cost)}</div>
      <button class="btn btn-danger btn-sm" onclick="window._purchaseCart.splice(${i},1);renderPurchaseLines()">✕</button></div>`;
  }).join('');
  document.getElementById('purchaseTotal').textContent = fmt(total);
}
function savePurchase(){
  if(!window._purchaseCart.length) return toast('Agrega al menos un producto');
  const supplier = document.getElementById('pfSupplier').value.trim();
  const date = document.getElementById('pfDate').value || todayISO();
  const items = window._purchaseCart;
  const total = items.reduce((a,l)=>a+l.qty*l.cost,0);
  const invoiceNo = DB.invoiceCounter++;
  const purchase = {id:uid(), date, supplier, items, total, invoiceNo};
  DB.purchases.push(purchase);
  items.forEach(l=>{
    const p = DB.products.find(p=>p.id===l.productId);
    if(p){ p.stock = (p.stock||0) + l.qty; p.costPrice = l.cost; }
  });
  save();
  toast('Compra registrada');
  viewInvoice(purchase.id);
}
function viewInvoice(purchaseId){
  const pu = DB.purchases.find(p=>p.id===purchaseId);
  if(!pu) return;
  const lines = pu.items.map(l=>{
    const p = DB.products.find(p=>p.id===l.productId);
    return {name:p?p.name:'Producto', qty:l.qty, cost:l.cost, sub:l.qty*l.cost};
  });
  const waText = buildWhatsappPurchaseText(pu, lines);
  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">Factura #${pu.invoiceNo}</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="card" id="invoiceArea">
      <div class="row"><b>${esc(DB.meta.bizName)}</b><span class="small muted">${pu.date}</span></div>
      <div class="small muted mt-2">Proveedor: ${esc(pu.supplier||'—')}</div>
      <hr class="sep">
      ${lines.map(l=>`<div class="row" style="padding:4px 0"><span class="small">${esc(l.name)} x${l.qty}</span><span class="mono small">${fmt(l.sub)}</span></div>`).join('')}
      <hr class="sep">
      <div class="row"><b>Total</b><b class="mono">${fmt(pu.total)}</b></div>
    </div>
    <div class="section-title">Mensaje para WhatsApp</div>
    <div class="wa-preview" id="waMsg">${esc(waText)}</div>
    <div class="gap-2 mt-2">
      <button class="btn btn-ghost btn-block" onclick="copyToClipboard(\`${waText.replace(/`/g,"'")}\`)">📋 Copiar mensaje</button>
      <button class="btn btn-accent btn-block" onclick="window.open('https://wa.me/?text='+encodeURIComponent(\`${waText.replace(/`/g,"'")}\`),'_blank')">💬 Abrir WhatsApp</button>
    </div>
    <button class="btn btn-outline btn-block mt-2" onclick="window.print()">🖨️ Imprimir / guardar como PDF</button>
  `);
}
function buildWhatsappPurchaseText(pu, lines){
  let t = `🧾 *${DB.meta.bizName}*\nCompra / Factura #${pu.invoiceNo}\nFecha: ${pu.date}\nProveedor: ${pu.supplier||'—'}\n\n`;
  lines.forEach(l=> t += `• ${l.name} x${l.qty} — ${fmt(l.sub)}\n`);
  t += `\n*Total: ${fmt(pu.total)}*`;
  return t;
}
function copyToClipboard(text){
  navigator.clipboard? navigator.clipboard.writeText(text).then(()=>toast('Mensaje copiado')).catch(()=>fallbackCopy(text))
   : fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Mensaje copiado'); }catch(e){ toast('No se pudo copiar'); }
  document.body.removeChild(ta);
}

/* =========================================================
   VENTAS (POS)
   ========================================================= */
function viewSales(){
  let html = `<div class="searchbar"><span class="sic">🔎</span>
    <input type="text" id="posSearch" placeholder="Buscar producto para vender..." oninput="renderPosResults(this.value)"></div>
    <div id="posResults" class="card"></div>
    <div class="section-title">Carrito</div>
    <div id="cartWrap"></div>`;
  setTimeout(()=>{ renderPosResults(''); renderCart(); },0);
  return html;
}
function renderPosResults(q){
  const wrap = document.getElementById('posResults');
  if(!wrap) return;
  q = q.toLowerCase();
  let list = DB.products;
  if(q) list = list.filter(p=>p.name.toLowerCase().includes(q));
  list = list.slice(0,8);
  if(!list.length){ wrap.innerHTML = `<div class="empty" style="padding:20px"><div class="ed">Sin resultados</div></div>`; return; }
  wrap.innerHTML = list.map(p=>`
    <div class="list-item" style="cursor:pointer" onclick="addToCart('${p.id}')">
      ${thumbHtml(p)}
      <div class="li-body"><div class="li-title">${esc(p.name)}</div><div class="li-sub">${p.stock} disponibles</div></div>
      <div class="li-right"><div class="li-price mono">${fmt(p.prices[0]?p.prices[0].price:0)}</div></div>
    </div>`).join('');
}
function addToCart(pid){
  const p = DB.products.find(p=>p.id===pid);
  if(!p) return;
  if(p.stock<=0) return toast('Sin stock disponible');
  let line = app.cart.find(l=>l.productId===pid);
  if(line){ if(line.qty<p.stock) line.qty++; else toast('No hay más stock'); }
  else app.cart.push({productId:pid, qty:1, priceIndex:0});
  renderCart();
  toast(p.name+' agregado');
}
function renderCart(){
  const wrap = document.getElementById('cartWrap');
  if(!wrap) return;
  if(!app.cart.length){ wrap.innerHTML = `<div class="empty" style="padding:24px"><div class="eic">🛒</div><div class="ed">Agrega productos para iniciar una venta</div></div>`; return; }
  let total=0;
  let html = `<div class="card">`;
  app.cart.forEach((l,i)=>{
    const p = DB.products.find(p=>p.id===l.productId);
    if(!p) return;
    const price = p.prices[l.priceIndex]?p.prices[l.priceIndex].price:p.prices[0].price;
    const sub = price*l.qty;
    total += sub;
    html += `<div class="cart-line">
      <div class="li-body">
        <div class="li-title">${esc(p.name)}</div>
        ${p.prices.length>1?`<select style="margin-top:4px;padding:4px 6px;font-size:11px" onchange="app.cart[${i}].priceIndex=parseInt(this.value);renderCart()">
          ${p.prices.map((pr,pi)=>`<option value="${pi}" ${pi===l.priceIndex?'selected':''}>${esc(pr.label)} — ${fmt(pr.price)}</option>`).join('')}
        </select>`:''}
      </div>
      <div class="qty-ctl">
        <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
        <span class="mono">${l.qty}</span>
        <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
      </div>
      <div class="mono" style="font-weight:800;width:64px;text-align:right">${fmt(sub)}</div>
    </div>`;
  });
  html += `</div>
    <div class="card">
      <div class="row"><span style="font-weight:800;font-size:16px">Total</span><span class="mono" style="font-weight:800;font-size:18px">${fmt(total)}</span></div>
    </div>
    <div class="gap-2">
      <button class="btn btn-outline btn-block" onclick="app.cart=[];renderCart()">Vaciar</button>
      <button class="btn btn-primary btn-block" onclick="checkout()">Cobrar</button>
    </div>`;
  wrap.innerHTML = html;
}
function changeQty(i, delta){
  const l = app.cart[i];
  const p = DB.products.find(p=>p.id===l.productId);
  const newQty = l.qty+delta;
  if(newQty<=0){ app.cart.splice(i,1); renderCart(); return; }
  if(newQty>p.stock){ toast('No hay más stock'); return; }
  l.qty = newQty;
  renderCart();
}
function checkout(){
  if(!app.cart.length) return;
  const items = app.cart.map(l=>{
    const p = DB.products.find(p=>p.id===l.productId);
    const price = p.prices[l.priceIndex]?p.prices[l.priceIndex].price:p.prices[0].price;
    return {productId:l.productId, name:p.name, qty:l.qty, priceLabel:p.prices[l.priceIndex]?p.prices[l.priceIndex].label:p.prices[0].label, price};
  });
  const total = items.reduce((a,l)=>a+l.qty*l.price,0);
  const sale = {id:uid(), date:new Date().toISOString(), items, total, seller: app.role};
  DB.sales.push(sale);
  items.forEach(it=>{
    const p = DB.products.find(p=>p.id===it.productId);
    if(p) p.stock = Math.max(0, (p.stock||0) - it.qty);
  });
  app.cart = [];
  save();
  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">✅ Venta registrada</div><button class="sheet-close" onclick="ui.closeSheet();app.go('sales')">✕</button></div>
    <div class="card">
      ${items.map(it=>`<div class="row" style="padding:4px 0"><span class="small">${esc(it.name)} x${it.qty}</span><span class="mono small">${fmt(it.qty*it.price)}</span></div>`).join('')}
      <hr class="sep"><div class="row"><b>Total</b><b class="mono">${fmt(total)}</b></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="ui.closeSheet();app.go('sales')">Nueva venta</button>
  `);
}

function viewSaleHistory(){
  if(!DB.sales.length) return `<div class="empty"><div class="eic">📜</div><div class="et">Sin ventas todavía</div></div>`;
  let html = `<div class="card">`;
  DB.sales.slice().reverse().forEach(s=>{
    html += `<div class="list-item">
      <div class="thumb">🧾</div>
      <div class="li-body"><div class="li-title">${s.items.length} producto(s)</div><div class="li-sub">${new Date(s.date).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'})}</div></div>
      <div class="li-right"><div class="li-price mono">${fmt(s.total)}</div></div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

/* =========================================================
   CAJA (conteo de efectivo)
   ========================================================= */
const DENOMS = [1000,500,200,100,50,20,10,5,2,1,0.5];
function viewCash(){
  let html = `<div class="card"><div class="small muted mb-2">Cuenta cuántos billetes/monedas tienes de cada denominación.</div>`;
  html += `<div id="denomList">`;
  DENOMS.forEach(d=>{
    html += `<div class="denom-row">
      <div><div class="denom-label mono">${fmt(d)}</div></div>
      <input type="number" min="0" class="denom-input" id="denom_${d}" value="0" oninput="calcCash()">
    </div>`;
  });
  html += `</div></div>
  <div class="card">
    <div class="row"><span style="font-weight:800">Total contado</span><span class="mono" id="cashTotal" style="font-weight:800;font-size:18px">${fmt(0)}</span></div>
  </div>
  <button class="btn btn-primary btn-block" onclick="saveCashCount()">Guardar conteo</button>`;

  if(DB.cashCounts.length){
    html += `<div class="section-title">Historial de conteos</div><div class="card">`;
    DB.cashCounts.slice().reverse().slice(0,10).forEach(c=>{
      html += `<div class="list-item"><div class="thumb">💵</div>
        <div class="li-body"><div class="li-title">${c.date}</div></div>
        <div class="li-right"><div class="li-price mono">${fmt(c.total)}</div></div></div>`;
    });
    html += `</div>`;
  }
  return html;
}
function calcCash(){
  let total=0;
  DENOMS.forEach(d=>{
    const el = document.getElementById('denom_'+d);
    const n = parseInt(el.value)||0;
    total += n*d;
  });
  document.getElementById('cashTotal').textContent = fmt(total);
  return total;
}
function saveCashCount(){
  const denoms={};
  DENOMS.forEach(d=>{ denoms[d] = parseInt(document.getElementById('denom_'+d).value)||0; });
  const total = calcCash();
  DB.cashCounts.push({id:uid(), date:nowStamp(), denoms, total});
  save(); toast('Conteo guardado'); renderView();
}

/* =========================================================
   GASTOS Y FINANZAS
   ========================================================= */
function viewExpenses(){
  const period = app._expPeriod || 'mes';
  const {from} = periodRange(period);
  const salesP = DB.sales.filter(s=> new Date(s.date) >= from);
  const expP = DB.expenses.filter(e=> new Date(e.date) >= from);
  const revenue = salesP.reduce((a,s)=>a+s.total,0);
  const cogs = salesP.reduce((a,s)=> a + s.items.reduce((b,it)=>{
    const p = DB.products.find(p=>p.id===it.productId);
    return b + (p? p.costPrice*it.qty : 0);
  },0),0);
  const totalExp = expP.reduce((a,e)=>a+e.amount,0);
  const profit = revenue - cogs - totalExp;

  let html = `<div class="tabbar">
    ${['hoy','semana','mes','todo'].map(p=>`<div class="tab-pill ${period===p?'active':''}" onclick="app._expPeriod='${p}';renderView()">${p[0].toUpperCase()+p.slice(1)}</div>`).join('')}
  </div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-val mono">${fmt(revenue)}</div><div class="stat-lbl">Ventas</div></div>
    <div class="stat-card"><div class="stat-val mono">${fmt(cogs)}</div><div class="stat-lbl">Costo de mercancía</div></div>
    <div class="stat-card"><div class="stat-val mono">${fmt(totalExp)}</div><div class="stat-lbl">Gastos</div></div>
    <div class="stat-card" style="border-color:${profit>=0?'#B9DEC1':'#E9BBB6'}"><div class="stat-val mono" style="color:${profit>=0?'var(--ok)':'var(--danger)'}">${fmt(profit)}</div><div class="stat-lbl">${profit>=0?'Utilidad neta':'Pérdida'}</div></div>
  </div>
  <div class="section-title">Gastos registrados</div>`;

  if(!DB.expenses.length){
    html += `<div class="empty"><div class="eic">💸</div><div class="et">Sin gastos registrados</div><div class="ed">Toca + para agregar uno.</div></div>`;
  } else {
    html += `<div class="card">`;
    DB.expenses.slice().reverse().forEach(e=>{
      html += `<div class="list-item">
        <div class="thumb">💸</div>
        <div class="li-body"><div class="li-title">${esc(e.concept)}</div><div class="li-sub">${e.date}${e.category?' · '+esc(e.category):''}</div></div>
        <div class="li-right"><div class="li-price mono" style="color:var(--danger)">-${fmt(e.amount)}</div></div>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}
function periodRange(period){
  const now = new Date();
  let from = new Date(0);
  if(period==='hoy'){ from = new Date(now.toDateString()); }
  else if(period==='semana'){ from = new Date(now); from.setDate(now.getDate()-7); }
  else if(period==='mes'){ from = new Date(now); from.setMonth(now.getMonth()-1); }
  return {from};
}
function openExpenseForm(){
  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">Nuevo gasto</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="field"><label>Concepto</label><input type="text" id="efConcept" placeholder="Ej. Renta, luz, transporte"></div>
    <div class="field-row">
      <div class="field"><label>Monto</label><input type="number" step="0.01" id="efAmount"></div>
      <div class="field"><label>Fecha</label><input type="date" id="efDate" value="${todayISO()}"></div>
    </div>
    <div class="field"><label>Categoría (opcional)</label><input type="text" id="efCategory" placeholder="Ej. Operativo"></div>
    <button class="btn btn-primary btn-block" onclick="saveExpense()">Guardar gasto</button>
  `);
}
function saveExpense(){
  const concept = document.getElementById('efConcept').value.trim();
  const amount = parseFloat(document.getElementById('efAmount').value)||0;
  if(!concept || amount<=0) return toast('Completa concepto y monto');
  DB.expenses.push({id:uid(), concept, amount, date:document.getElementById('efDate').value||todayISO(), category:document.getElementById('efCategory').value.trim()});
  save(); ui.closeSheet(); toast('Gasto registrado'); renderView();
}

/* =========================================================
   REPORTES
   ========================================================= */
function viewReports(){
  const salesByProduct = {};
  DB.sales.forEach(s=>s.items.forEach(it=>{
    salesByProduct[it.productId] = (salesByProduct[it.productId]||0) + it.qty;
  }));
  const withSales = DB.products.map(p=>({p, qty:salesByProduct[p.id]||0}));
  const best = withSales.slice().sort((a,b)=>b.qty-a.qty).slice(0,8);
  const worst = withSales.slice().sort((a,b)=>a.qty-b.qty).slice(0,8);
  const margin = DB.products.map(p=>{
    const price = p.prices[0]?p.prices[0].price:0;
    return {p, margin: price - p.costPrice};
  }).sort((a,b)=>a.margin-b.margin).slice(0,8);

  function block(title, arr, valueFn){
    if(!arr.length) return `<div class="section-title">${title}</div><div class="empty" style="padding:20px"><div class="ed">Sin datos suficientes</div></div>`;
    return `<div class="section-title">${title}</div><div class="card">` +
      arr.map(x=>`<div class="list-item">${thumbHtml(x.p)}
        <div class="li-body"><div class="li-title">${esc(x.p.name)}</div></div>
        <div class="li-right"><div class="li-price mono">${valueFn(x)}</div></div></div>`).join('') + `</div>`;
  }
  return block('🏆 Más vendidos', best, x=>x.qty+' und.')
    + block('📉 Menos vendidos', worst, x=>x.qty+' und.')
    + block('⚠️ Menor margen de ganancia', margin, x=>fmt(x.margin));
}

/* =========================================================
   CALENDARIO Y NOTAS
   ========================================================= */
function viewCalendar(){
  const st = app._cal || (app._cal = {y:new Date().getFullYear(), m:new Date().getMonth(), sel:todayISO()});
  const first = new Date(st.y, st.m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(st.y, st.m+1, 0).getDate();
  const monthName = first.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  const todayStr = todayISO();

  let cells = '';
  const dows = ['D','L','M','X','J','V','S'];
  dows.forEach(d=> cells += `<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startDow;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${st.y}-${String(st.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasItems = DB.events.some(e=>e.date===dateStr) || DB.notes.some(n=>n.date===dateStr);
    cells += `<div class="cal-cell inmonth ${dateStr===todayStr?'today':''} ${dateStr===st.sel?'sel':''}" onclick="app._cal.sel='${dateStr}';renderView()">${d}${hasItems?'<span class="cal-dot"></span>':''}</div>`;
  }

  const dayEvents = DB.events.filter(e=>e.date===st.sel);
  const dayNotes = DB.notes.filter(n=>n.date===st.sel);

  return `<div class="card">
    <div class="row">
      <button class="icon-btn" style="background:var(--surface-2);color:var(--ink)" onclick="app._cal.m--; if(app._cal.m<0){app._cal.m=11;app._cal.y--;} renderView()">‹</button>
      <b style="text-transform:capitalize">${monthName}</b>
      <button class="icon-btn" style="background:var(--surface-2);color:var(--ink)" onclick="app._cal.m++; if(app._cal.m>11){app._cal.m=0;app._cal.y++;} renderView()">›</button>
    </div>
    <div class="calendar-grid mt-3">${cells}</div>
  </div>
  <div class="section-title">${st.sel}</div>
  <div class="card">
    ${dayEvents.map(e=>`<div class="row" style="padding:6px 0"><span>📌 ${esc(e.title)}</span><button class="btn btn-sm btn-danger" onclick="removeEvent('${e.id}')">✕</button></div>`).join('')}
    ${dayNotes.map(n=>`<div class="row" style="padding:6px 0;align-items:flex-start"><span class="small">📝 ${esc(n.text)}</span><button class="btn btn-sm btn-danger" onclick="removeNote('${n.id}')">✕</button></div>`).join('')}
    ${(!dayEvents.length && !dayNotes.length)?'<div class="small muted">Sin eventos ni notas para este día.</div>':''}
  </div>
  <div class="gap-2">
    <button class="btn btn-outline btn-block" onclick="openEventForm()">+ Evento</button>
    <button class="btn btn-ghost btn-block" onclick="openNoteForm()">+ Nota</button>
  </div>`;
}
function openEventForm(){
  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">Nuevo evento</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="field"><label>Título</label><input type="text" id="evTitle" placeholder="Ej. Entrega de pedido"></div>
    <button class="btn btn-primary btn-block" onclick="saveEvent()">Guardar</button>
  `);
}
function saveEvent(){
  const title = document.getElementById('evTitle').value.trim();
  if(!title) return toast('Escribe un título');
  DB.events.push({id:uid(), date:app._cal.sel, title});
  save(); ui.closeSheet(); renderView();
}
function removeEvent(id){ DB.events = DB.events.filter(e=>e.id!==id); save(); renderView(); }
function openNoteForm(){
  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">Nueva nota</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="field"><label>Nota</label><textarea id="noteText" rows="3" placeholder="Escribe tu nota..."></textarea></div>
    <button class="btn btn-primary btn-block" onclick="saveNote()">Guardar</button>
  `);
}
function saveNote(){
  const text = document.getElementById('noteText').value.trim();
  if(!text) return toast('Escribe algo');
  DB.notes.push({id:uid(), date:app._cal.sel, text});
  save(); ui.closeSheet(); renderView();
}
function removeNote(id){ DB.notes = DB.notes.filter(n=>n.id!==id); save(); renderView(); }

/* =========================================================
   AJUSTES
   ========================================================= */
function viewSettings(){
  const isAdmin = app.role==='admin';
  let html = `<div class="section-title">Negocio</div>
  <div class="card">
    <div class="field"><label>Nombre del negocio</label><input type="text" id="setBizName" value="${esc(DB.meta.bizName)}" ${isAdmin?'':'disabled'} onchange="DB.meta.bizName=this.value;save();applySettings()"></div>
    <div class="field" style="margin-bottom:0"><label>Símbolo de moneda</label><input type="text" id="setCurrency" value="${esc(DB.meta.currency)}" maxlength="3" ${isAdmin?'':'disabled'} onchange="DB.meta.currency=this.value||'$';save()"></div>
  </div>

  <div class="section-title">Tamaño de letra</div>
  <div class="card"><div class="gap-2">
    ${[{k:0.9,l:'A'},{k:1,l:'A'},{k:1.15,l:'A'},{k:1.3,l:'A'}].map((o,i)=>`
      <button class="btn ${DB.settings.fontScale==o.k?'btn-primary':'btn-outline'} btn-block" style="font-size:${13+i*3}px" onclick="DB.settings.fontScale=${o.k};save();applySettings();renderView()">${o.l}</button>`).join('')}
  </div></div>

  <div class="section-title">Color de la interfaz</div>
  <div class="card"><div class="swatch-row">
    ${Object.keys(THEMES).map(k=>`<div class="swatch ${DB.settings.theme===k?'sel':''}" style="background:${THEMES[k].primary}" onclick="DB.settings.theme='${k}';save();applySettings();renderView()"></div>`).join('')}
  </div></div>`;

  if(isAdmin){
    html += `<div class="section-title">Copia de seguridad</div>
    <div class="card stack">
      <button class="btn btn-outline btn-block" onclick="backupData()">⬇️ Descargar copia de seguridad</button>
      <button class="btn btn-outline btn-block" onclick="document.getElementById('restoreInputHidden').click()">⬆️ Restaurar desde archivo</button>
      <button class="btn btn-danger btn-block" onclick="resetApp()">🗑️ Restablecer aplicación</button>
    </div>`;
  }
  html += `<div class="small muted" style="text-align:center;margin-top:18px">AlmacénPro · datos guardados solo en este dispositivo</div>`;
  return html;
}
function backupData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `almacenpro_backup_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Copia de seguridad descargada');
}
document.getElementById('restoreInputHidden').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!confirm('Esto reemplazará todos los datos actuales. ¿Continuar?')){ e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = JSON.parse(ev.target.result);
      DB = Object.assign(defaultDB(), data);
      save(); applySettings(); renderView();
      toast('Datos restaurados');
    }catch(err){ toast('Archivo inválido'); }
  };
  reader.readAsText(file);
  e.target.value='';
});
function resetApp(){
  if(!confirm('Esto borrará TODOS los datos (productos, ventas, compras, etc). ¿Seguro?')) return;
  if(!confirm('Última confirmación: esta acción no se puede deshacer. ¿Restablecer todo?')) return;
  DB = defaultDB();
  save(); applySettings(); toast('Aplicación restablecida'); app.go('home');
}

applySettings();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
