<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AlmacénPro</title>
<meta name="theme-color" content="#173F38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AlmacénPro">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EA;
  --surface:#FFFFFF;
  --surface-2:#FBF9F4;
  --ink:#1E2420;
  --ink-soft:#5B655F;
  --primary:#173F38;
  --primary-2:#2A6357;
  --accent:#DE9A3C;
  --accent-ink:#3A2A0D;
  --danger:#B23A3A;
  --ok:#3E7A4D;
  --border:#E4DFD1;
  --radius:16px;
  --font-scale:1;
  --shadow:0 1px 2px rgba(23,63,56,.04), 0 1px 12px rgba(23,63,56,.05);
}
*{box-sizing:border-box;}
html{-webkit-tap-highlight-color:transparent;}
body{
  margin:0;
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:calc(15px * var(--font-scale));
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:1em;}
h1,h2,h3,h4{margin:0;font-family:'Inter',sans-serif;letter-spacing:-.01em;}
p{margin:0;}
img{max-width:100%;display:block;}

/* ---------- SCREENS ---------- */
.screen{display:none;min-height:100vh;}
.screen.active{display:block;}

/* Login */
#screen-login{
  background:var(--primary);
  min-height:100vh;
  align-items:center;
  justify-content:center;
  padding:24px;
  color:#fff;
}
#screen-login.active{display:flex;}
.login-card{width:100%;max-width:360px;text-align:center;}
.login-mark{
  width:56px;height:56px;border-radius:16px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
  font-size:calc(26px * var(--font-scale));font-weight:800;color:var(--accent-ink);
}
.login-title{font-size:calc(23px * var(--font-scale));font-weight:700;margin-bottom:6px;letter-spacing:-.01em;}
.login-sub{opacity:.6;font-size:calc(13.5px * var(--font-scale));margin-bottom:38px;font-weight:500;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.role-btn{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.14);
  border-radius:var(--radius);
  padding:26px 10px;
  color:#fff;
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:9px;
  transition:.15s;
}
.role-btn:active{transform:scale(.97);background:rgba(255,255,255,.1);}
.role-icon{font-size:calc(24px * var(--font-scale));opacity:.9;}
.role-label{font-weight:600;font-size:calc(14px * var(--font-scale));}
.role-desc{font-size:calc(11px * var(--font-scale));opacity:.55;}
.login-footer{margin-top:32px;font-size:calc(10.5px * var(--font-scale));opacity:.4;}

/* App shell */
#screen-main{flex-direction:column;min-height:100vh;}
#screen-main.active{display:flex;}
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--primary);
  color:#fff;
  padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;
}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(15px * var(--font-scale));}
.topbar-title{font-size:calc(15px * var(--font-scale));font-weight:700;}
.topbar-role{font-size:calc(10.5px * var(--font-scale));opacity:.75;text-transform:uppercase;letter-spacing:.06em;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.icon-btn{
  background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:calc(16px * var(--font-scale));cursor:pointer;
}
.icon-btn:active{background:rgba(255,255,255,.24);}

#view-container{flex:1;padding:14px 14px 90px;max-width:640px;margin:0 auto;width:100%;}

.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -2px 12px rgba(0,0,0,.06);
}
.nav-btn{
  flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;color:var(--ink-soft);cursor:pointer;border-radius:10px;
}
.nav-btn .ic{font-size:calc(19px * var(--font-scale));}
.nav-btn .lb{font-size:calc(9.5px * var(--font-scale));font-weight:600;}
.nav-btn.active{color:var(--primary);}
.nav-btn.active .ic{transform:translateY(-1px);}

/* Cards / generic */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px;margin-bottom:12px;box-shadow:var(--shadow);}
.section-title{font-size:calc(12px * var(--font-scale));font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:20px 2px 9px;}
.section-title:first-child{margin-top:0;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stack{display:flex;flex-direction:column;gap:10px;}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);padding:4px 10px;border-radius:999px;font-size:calc(11.5px * var(--font-scale));font-weight:600;color:var(--ink-soft);}
.chip.warn{background:#FBEBD8;border-color:#F0CE9C;color:#8A5A17;}
.chip.danger{background:#F8E3E1;border-color:#E9BBB6;color:#8A2E2E;}
.chip.ok{background:#E3F1E6;border-color:#B9DEC1;color:#2C5C38;}
.badge-num{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:calc(11px * var(--font-scale));padding:2px 7px;border-radius:999px;}

.btn{
  border:none;border-radius:11px;padding:12px 16px;font-weight:700;font-size:calc(14px * var(--font-scale));cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-2);}
.btn-accent{background:var(--accent);color:var(--accent-ink);}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--ink);}
.btn-danger{background:#F8E3E1;color:var(--danger);}
.btn-ghost{background:var(--surface-2);color:var(--ink);}
.btn-sm{padding:8px 12px;font-size:calc(12.5px * var(--font-scale));border-radius:9px;}
.btn-block{width:100%;}
.fab{
  position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));
  width:54px;height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);
  border:none;font-size:calc(26px * var(--font-scale));box-shadow:0 8px 20px rgba(222,154,60,.45);cursor:pointer;z-index:15;
  display:flex;align-items:center;justify-content:center;
}

input[type=text],input[type=number],input[type=date],input[type=search],input[type=password],select,textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-2);outline-offset:1px;}
label{font-size:calc(12px * var(--font-scale));font-weight:700;color:var(--ink-soft);margin-bottom:5px;display:block;}
.field{margin-bottom:12px;min-width:0;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0;}
.field-row > .field{min-width:0;}
.field input, .field select, .field-row input, .field-row select{width:100%;min-width:0;box-sizing:border-box;}
.hscroll{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.hscroll::-webkit-scrollbar{height:4px;}

.searchbar{position:relative;margin-bottom:14px;}
.searchbar input{padding-left:36px;}
.searchbar .sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;}

.empty{
  text-align:center;padding:40px 16px;color:var(--ink-soft);
}
.empty .eic{font-size:calc(34px * var(--font-scale));margin-bottom:8px;}
.empty .et{font-weight:700;color:var(--ink);margin-bottom:4px;}
.empty .ed{font-size:calc(12.5px * var(--font-scale));}

/* Modal / sheet */
.overlay{position:fixed;inset:0;background:rgba(15,25,20,.5);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.overlay.active{display:flex;}
.sheet{
  background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;
  max-height:92vh;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));
  animation:slideup .22s ease-out;
}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:38px;height:4px;background:var(--border);border-radius:99px;margin:2px auto 14px;}
.sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sheet-title{font-size:calc(17px * var(--font-scale));font-weight:800;}
.sheet-close{background:var(--surface-2);border:none;width:30px;height:30px;border-radius:9px;font-size:calc(15px * var(--font-scale));cursor:pointer;color:var(--ink-soft);}

.picker-overlay{position:fixed;inset:0;background:rgba(15,25,20,.6);z-index:60;display:none;align-items:flex-end;justify-content:center;}
.picker-overlay.active{display:flex;}
.picker-sheet{
  background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;
  height:90vh;max-height:90vh;display:flex;flex-direction:column;
  padding:16px 16px calc(12px + env(safe-area-inset-bottom,0px));
  animation:slideup .22s ease-out;
}
.picker-results{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.picker-group-title{font-size:calc(11.5px * var(--font-scale));font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;margin:14px 0 4px;}
.picker-group-title:first-child{margin-top:0;}

.toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:calc(13px * var(--font-scale));font-weight:600;
  z-index:80;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.list-item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.thumb{width:46px;height:46px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:calc(18px * var(--font-scale));color:var(--ink-soft);overflow:hidden;flex-shrink:0;border:1px solid var(--border);}
.thumb img{width:100%;height:100%;object-fit:cover;}
.li-body{flex:1;min-width:0;}
.li-title{font-weight:700;font-size:calc(13.8px * var(--font-scale));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-sub{font-size:calc(11.5px * var(--font-scale));color:var(--ink-soft);margin-top:2px;}
.li-right{text-align:right;flex-shrink:0;}
.li-price{font-weight:800;font-size:calc(14px * var(--font-scale));}
.li-stock{font-size:calc(10.5px * var(--font-scale));color:var(--ink-soft);}

.tabbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.tabbar::-webkit-scrollbar{display:none;}
.tab-pill{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:calc(12.5px * var(--font-scale));font-weight:700;color:var(--ink-soft);cursor:pointer;}
.tab-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
.stat-val{font-size:calc(20px * var(--font-scale));font-weight:800;}
.stat-lbl{font-size:calc(11px * var(--font-scale));color:var(--ink-soft);font-weight:600;margin-top:2px;}

.swatch-row{display:flex;gap:10px;flex-wrap:wrap;}
.swatch{width:38px;height:38px;border-radius:11px;cursor:pointer;border:2px solid transparent;}
.swatch.sel{border-color:var(--ink);}

.denom-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
.denom-row:last-child{border-bottom:none;}
.denom-label{font-weight:700;font-size:calc(14px * var(--font-scale));}
.denom-input{width:78px;text-align:center;}
.denom-sub{font-size:calc(11px * var(--font-scale));color:var(--ink-soft);margin-top:1px;}

.cart-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.qty-ctl{display:flex;align-items:center;gap:8px;}
.qty-btn{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface-2);font-weight:800;cursor:pointer;}

.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:calc(12.5px * var(--font-scale));font-weight:600;cursor:pointer;position:relative;color:var(--ink-soft);}
.cal-cell.inmonth{color:var(--ink);}
.cal-cell.today{border:1.5px solid var(--primary);}
.cal-cell.sel{background:var(--primary);color:#fff;}
.cal-dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent);}
.cal-dow{text-align:center;font-size:calc(10px * var(--font-scale));font-weight:700;color:var(--ink-soft);padding-bottom:4px;}

.wa-preview{background:#E9FBE0;border:1px solid #BFE9AC;border-radius:12px;padding:12px;font-size:calc(12.5px * var(--font-scale));white-space:pre-wrap;font-family:'JetBrains Mono',monospace;line-height:1.5;color:#264A1B;}

hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
.muted{color:var(--ink-soft);}
.small{font-size:calc(11.5px * var(--font-scale));}
.text-right{text-align:right;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.gap-2{display:flex;gap:8px;}
.mt-2{margin-top:8px;}
.mt-3{margin-top:14px;}
.w-full{width:100%;}
.hidden{display:none !important;}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="screen-login" class="screen active">
  <div class="login-card">
    <div class="login-mark">A</div>
    <div class="login-title" id="loginBizName">AlmacénPro</div>
    <div class="login-sub">Elige cómo vas a entrar</div>
    <div class="role-grid">
      <div class="role-btn" onclick="app.login('admin')">
        <div class="role-icon">🗝️</div>
        <div class="role-label">Administrador</div>
        <div class="role-desc">Acceso total</div>
      </div>
      <div class="role-btn" onclick="app.login('vendedor')">
        <div class="role-icon">🛒</div>
        <div class="role-label">Vendedor</div>
        <div class="role-desc">Solo ventas y consulta</div>
      </div>
    </div>
    <div class="login-footer">AlmacénPro · datos guardados en este dispositivo</div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="screen-main" class="screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-mark">A</div>
      <div>
        <div class="topbar-title" id="topTitle">Inicio</div>
        <div class="topbar-role" id="topRole">Administrador</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" onclick="app.logout()" title="Cambiar modo">⇄</button>
    </div>
  </div>

  <main id="view-container"></main>

  <nav class="bottomnav" id="bottomnav"></nav>
  <button class="fab hidden" id="fabBtn"></button>
</div>

<!-- ===================== MODAL / SHEET ===================== -->
<div class="overlay" id="overlay" onclick="if(event.target===this)ui.closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<!-- ===================== PICKER (búsqueda de producto, apilado sobre una hoja abierta) ===================== -->
<div class="picker-overlay" id="pickerOverlay" onclick="if(event.target===this)ui.closePicker()">
  <div class="picker-sheet" id="pickerSheetEl"></div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="fileInputHidden" accept="image/*" style="display:none">
<input type="file" id="restoreInputHidden" accept="application/json" style="display:none">
<input type="file" id="syncInputHidden" accept="application/json" style="display:none">

<script>
/* =========================================================
   ALMACÉNPRO — App de gestión de inventario y ventas
   Todo se guarda en localStorage del navegador/dispositivo.
   ========================================================= */

const STORE_KEY = 'almacenpro_db_v1';
const THEMES = {
  verde:    {label:'Verde',    primary:'#173F38', primary2:'#2A6357', accent:'#DE9A3C', accentInk:'#3A2A0D'},
  azul:     {label:'Azul',     primary:'#173A56', primary2:'#2A5C82', accent:'#3CA7DE', accentInk:'#072436'},
  ciruela:  {label:'Ciruela',  primary:'#3B1D3E', primary2:'#5E3163', accent:'#DE7B9A', accentInk:'#3A0F1E'},
  carbon:   {label:'Carbón',   primary:'#22262B', primary2:'#3A4048', accent:'#E0B23C', accentInk:'#332600'},
  terra:    {label:'Terracota',primary:'#4A2A1B', primary2:'#7A4529', accent:'#3CA789', accentInk:'#0C2620'},
  vino:     {label:'Vino',     primary:'#4A1620', primary2:'#7A2436', accent:'#E0855C', accentInk:'#331B0A'},
  bosque:   {label:'Bosque',   primary:'#123021', primary2:'#1F4F38', accent:'#B7D65A', accentInk:'#233008'},
  lavanda:  {label:'Lavanda',  primary:'#2E2359', primary2:'#473A82', accent:'#B79CF0', accentInk:'#241539'},
  coral:    {label:'Coral',    primary:'#5C1F1F', primary2:'#8C3232', accent:'#F2A65A', accentInk:'#3A1E06'},
  petroleo: {label:'Petróleo', primary:'#0D3B44', primary2:'#155866', accent:'#5CC8CE', accentInk:'#062A2D'},
  mostaza:  {label:'Mostaza',  primary:'#3D2E0A', primary2:'#5C4712', accent:'#E8C547', accentInk:'#332600'},
  rosado:   {label:'Rosado',   primary:'#4A1035', primary2:'#701A52', accent:'#F28FB2', accentInk:'#3A0D28'},
  grafito:  {label:'Grafito',  primary:'#1B2432', primary2:'#2E3D53', accent:'#7FA8D9', accentInk:'#0D1A28'},
  oliva:    {label:'Oliva',    primary:'#2B3417', primary2:'#465421', accent:'#C7D66D', accentInk:'#242B10'},
  cobre:    {label:'Cobre',    primary:'#3A2410', primary2:'#5C3A1A', accent:'#E8935A', accentInk:'#331F0A'},
};
const MODE_VARS = {
  light: {bg:'#F5F2EA', surface:'#FFFFFF', surface2:'#FBF9F4', ink:'#1E2420', inkSoft:'#5B655F', border:'#E4DFD1'},
  dark:  {bg:'#12161A', surface:'#1B2024', surface2:'#22282C', ink:'#ECEFEE', inkSoft:'#9AA4A2', border:'#31383C'},
};
const ACCENT_SWATCHES = [
  {hex:'#DE9A3C', ink:'#3A2A0D'}, {hex:'#3CA7DE', ink:'#072436'}, {hex:'#DE7B9A', ink:'#3A0F1E'},
  {hex:'#E0B23C', ink:'#332600'}, {hex:'#3CA789', ink:'#0C2620'}, {hex:'#E0855C', ink:'#331B0A'},
  {hex:'#B7D65A', ink:'#233008'}, {hex:'#B79CF0', ink:'#241539'}, {hex:'#F2A65A', ink:'#3A1E06'},
  {hex:'#5CC8CE', ink:'#062A2D'}, {hex:'#E8C547', ink:'#332600'}, {hex:'#F28FB2', ink:'#3A0D28'},
  {hex:'#7FA8D9', ink:'#0D1A28'}, {hex:'#C7D66D', ink:'#242B10'}, {hex:'#E8935A', ink:'#331F0A'},
];

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowStamp(){ return new Date().toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}); }
function fmt(n){ n = Number(n)||0; return DB.meta.currency + n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function usdEq(n){ const r=DB.settings.usdRate; if(!r) return ''; return '$'+((Number(n)||0)/r).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})+' USD'; }
function fmtUsdLine(n){ return DB.settings.usdRate>0 ? `<div class="small muted" style="margin-top:1px">≈ ${usdEq(n)}</div>` : ''; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function defaultDB(){
  return {
    deviceId: uid(),
    meta:{bizName:'Mi Negocio', currency:'$'},
    categories:[
      {id:uid(), name:'General', subs:[{id:uid(), name:'Varios'}]}
    ],
    products:[],
    purchases:[],
    sales:[],
    expenses:[],
    cashCounts:[],
    notes:[],
    events:[],
    reminders:[],
    losses:[],
    stockAdjustments:[],
    clients:[],
    clientPayments:[],
    settings:{fontScale:1, theme:'verde', themeMode:'light', accentOverride:null, cashDenoms:[1000,500,200,100,50,20,10,5,2,1], usdRate:0, usdRateUpdated:'', defaultMinStock:5, qtySteps:[5,10,20,24], transferSurchargePct:0, notifEnabled:false},
    invoiceCounter: 1001
  };
}

let DB = load();
recomputeStock();
function mergeWithDefaults(d){
  const merged = Object.assign(defaultDB(), d);
  merged.settings = Object.assign(defaultDB().settings, d.settings||{});
  merged.meta = Object.assign(defaultDB().meta, d.meta||{});
  return merged;
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultDB();
    const d = JSON.parse(raw);
    return mergeWithDefaults(d);
  }catch(e){ return defaultDB(); }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch(e){ toast('No se pudo guardar (memoria llena)'); }
}

/* ---------------- STOCK BASADO EN HISTORIAL (evita conflictos al sincronizar) ---------------- */
function deviceShort(){ return (DB.deviceId||'XXXX').slice(-4).toUpperCase(); }
function recomputeStock(){
  const map = {};
  DB.products.forEach(p=> map[p.id]=0);
  DB.purchases.forEach(pu=> pu.items.forEach(it=>{ if(map[it.productId]!=null) map[it.productId]+=it.qty; }));
  DB.sales.forEach(s=> s.items.forEach(it=>{ if(map[it.productId]!=null) map[it.productId]-=it.qty; }));
  (DB.stockAdjustments||[]).forEach(a=>{ if(map[a.productId]!=null) map[a.productId]+=a.delta; });
  DB.products.forEach(p=> p.stock = map[p.id]||0);
}

/* ---------------- TOAST ---------------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* Mantiene la hoja (sheet) visible por encima del teclado en móviles,
   ajustando su altura al viewport visual real en vez del 100vh fijo. */
function fitOverlayToViewport(){
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  const pickerOverlay = document.getElementById('pickerOverlay');
  const pickerSheet = document.getElementById('pickerSheetEl');
  if(window.visualViewport){
    const vv = window.visualViewport;
    if(overlay){ overlay.style.height = vv.height + 'px'; overlay.style.top = vv.offsetTop + 'px'; }
    if(sheet) sheet.style.maxHeight = (vv.height*0.94) + 'px';
    if(pickerOverlay){ pickerOverlay.style.height = vv.height + 'px'; pickerOverlay.style.top = vv.offsetTop + 'px'; }
    if(pickerSheet) pickerSheet.style.height = pickerSheet.style.maxHeight = (vv.height*0.94) + 'px';
  }
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', fitOverlayToViewport);
  window.visualViewport.addEventListener('scroll', fitOverlayToViewport);
}

/* Enter/Ir en el teclado guarda el formulario (toca el botón principal de la hoja),
   en vez de solo bajar de línea. También evita que el foco quede oculto tras el teclado. */
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter') return;
  const t = e.target;
  if(!t || t.tagName!=='INPUT') return;
  if(!t.closest('#sheet')) return;
  e.preventDefault();
  const sheet = document.getElementById('sheet');
  const mainBtn = sheet.querySelector('.btn-primary') || sheet.querySelector('.btn-accent');
  if(mainBtn) mainBtn.click();
});

/* Al enfocar un campo dentro de una hoja o del buscador de productos, lo desplaza
   a la vista para que no quede tapado por el teclado. */
document.addEventListener('focusin', function(e){
  const t = e.target;
  if(!t || !(t.tagName==='INPUT' || t.tagName==='SELECT' || t.tagName==='TEXTAREA')) return;
  const container = t.closest('#sheet') || t.closest('#pickerSheetEl');
  if(!container) return;
  setTimeout(()=>{ t.scrollIntoView({block:'center', behavior:'smooth'}); fitOverlayToViewport(); }, 250);
  /* Si es un campo numérico que arranca en 0, lo deja vacío para escribir directo */
  if(t.tagName==='INPUT' && t.type==='number' && t.value==='0'){
    t.value = '';
  }
});

function applySettings(){
  const s = DB.settings;
  document.documentElement.style.setProperty('--font-scale', s.fontScale || 1);
  const th = THEMES[s.theme] || THEMES.verde;
  document.documentElement.style.setProperty('--primary', th.primary);
  document.documentElement.style.setProperty('--primary-2', th.primary2);
  const accentColor = s.accentOverride || th.accent;
  const accentInk = s.accentOverride ? (ACCENT_SWATCHES.find(a=>a.hex===s.accentOverride)?.ink || '#1E2420') : th.accentInk;
  document.documentElement.style.setProperty('--accent', accentColor);
  document.documentElement.style.setProperty('--accent-ink', accentInk);
  const mv = MODE_VARS[s.themeMode] || MODE_VARS.light;
  document.documentElement.style.setProperty('--bg', mv.bg);
  document.documentElement.style.setProperty('--surface', mv.surface);
  document.documentElement.style.setProperty('--surface-2', mv.surface2);
  document.documentElement.style.setProperty('--ink', mv.ink);
  document.documentElement.style.setProperty('--ink-soft', mv.inkSoft);
  document.documentElement.style.setProperty('--border', mv.border);
  document.getElementById('loginBizName').textContent = DB.meta.bizName || 'AlmacénPro';
}

/* =========================================================
   HOME
   ========================================================= */
function viewHome(){
  const today = todayISO();
  const salesToday = DB.sales.filter(s=>s.date.slice(0,10)===today);
  const totalToday = salesToday.reduce((a,s)=>a+s.total,0);
  const lowStock = activeProducts().filter(p=>p.stock<=p.minStock);
  const lastCash = DB.cashCounts[DB.cashCounts.length-1];

  let html = `<div class="section-title">Resumen de hoy</div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-val mono">${fmt(totalToday)}</div><div class="stat-lbl">Ventas de hoy (${salesToday.length})</div></div>
    <div class="stat-card"><div class="stat-val mono">${lowStock.length}</div><div class="stat-lbl">Productos con stock bajo</div></div>
    <div class="stat-card"><div class="stat-val mono">${activeProducts().length}</div><div class="stat-lbl">Productos registrados</div></div>
    <div class="stat-card"><div class="stat-val mono">${lastCash? fmt(lastCash.total): '—'}</div><div class="stat-lbl">Último conteo de caja</div></div>
  </div>`;

  if(app.role==='admin'){
    html += `<div class="section-title">Accesos rápidos</div>
    <div class="stack">
      <button class="btn btn-primary btn-block" onclick="openPurchaseForm()">🧾 Registrar compra</button>
      <button class="btn btn-accent btn-block" onclick="app.go('sales')">🛒 Nueva venta</button>
      <button class="btn btn-outline btn-block" onclick="app.go('cash')">💵 Contar efectivo</button>
    </div>`;
  }

  const nowStr = new Date().toISOString().slice(0,16).replace('T',' ');
  const pendingReminders = (DB.reminders||[]).filter(r=>!r.done && (r.date+' '+(r.time||'23:59'))<=nowStr);
  if(pendingReminders.length){
    html += `<div class="section-title">⏰ Recordatorios pendientes</div><div class="card">`;
    pendingReminders.slice(0,5).forEach(r=>{
      html += `<div class="list-item">
        <div class="thumb">⏰</div>
        <div class="li-body"><div class="li-title">${esc(r.title)}</div><div class="li-sub">${r.date}${r.time?' · '+r.time:''}</div></div>
        <button class="btn btn-ghost btn-sm" onclick="toggleReminder('${r.id}')">Hecho</button>
      </div>`;
    });
    html += `</div>`;
  }

  if(lowStock.length){
    html += `<div class="section-title">⚠️ Alertas de stock bajo</div><div class="card">`;
    lowStock.slice(0,8).forEach(p=>{
      html += `<div class="list-item">
        ${thumbHtml(p)}
        <div class="li-body"><div class="li-title">${esc(p.name)}</div><div class="li-sub">Mínimo: ${p.minStock}</div></div>
        <div class="li-right"><span class="chip danger">${p.stock} en stock</span></div>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}

function thumbHtml(p){
  return p.photo ? `<div class="thumb"><img src="${p.photo}"></div>` : `<div class="thumb">📦</div>`;
}
function allSubcats(){
  const list=[];
  DB.categories.forEach(c=>c.subs.forEach(s=>list.push({catId:c.id,catName:c.name,subId:s.id,subName:s.name})));
  return list;
}
function catName(id){ const c=DB.categories.find(c=>c.id===id); return c?c.name:''; }
function subName(catId,subId){ const c=DB.categories.find(c=>c.id===catId); const s=c&&c.subs.find(s=>s.id===subId); return s?s.name:''; }

function activeProducts(){ return DB.products.filter(p=>!p.deletedAt); }
function filterProductsByCtx(list, ctx){
  let out = list;
  if(ctx.catId) out = out.filter(p=>p.catId===ctx.catId);
  if(ctx.subId) out = out.filter(p=>p.subId===ctx.subId);
  if(ctx.q){
    const q = ctx.q.toLowerCase();
    out = out.filter(p=>(p.name+' '+(p.desc||'')).toLowerCase().includes(q));
  }
  return out;
}
function categoryTabsHTML(ctx, ctxVarName, onChangeFn){
  let html = `<div class="tabbar">
    <div class="tab-pill ${!ctx.catId?'active':''}" onclick="${ctxVarName}.catId=null;${ctxVarName}.subId=null;${onChangeFn}()">Todos</div>
    ${DB.categories.map(c=>`<div class="tab-pill ${ctx.catId===c.id?'active':''}" onclick="${ctxVarName}.catId='${c.id}';${ctxVarName}.subId=null;${onChangeFn}()">${esc(c.name)}</div>`).join('')}
  </div>`;
  if(ctx.catId){
    const cat = DB.categories.find(c=>c.id===ctx.catId);
    if(cat && cat.subs.length){
      html += `<div class="tabbar">
        <div class="tab-pill ${!ctx.subId?'active':''}" onclick="${ctxVarName}.subId=null;${onChangeFn}()">Todas las subcat.</div>
        ${cat.subs.map(s=>`<div class="tab-pill ${ctx.subId===s.id?'active':''}" onclick="${ctxVarName}.subId='${s.id}';${onChangeFn}()">${esc(s.name)}</div>`).join('')}
      </div>`;
    }
  }
  return html;
}
function viewInventory(){
  const ctx = app.invContext;
  let products = filterProductsByCtx(activeProducts(), ctx);
  const isAdmin = app.role==='admin';

  let html = `<div class="searchbar">
    <span class="sic">🔎</span>
    <input type="text" placeholder="Buscar producto..." value="${esc(ctx.q)}" oninput="app.invContext.q=this.value; renderView()">
  </div>`;

  html += `<div class="tabbar">
    <div class="tab-pill ${!ctx.catId?'active':''}" onclick="app.invContext.catId=null;app.invContext.subId=null;renderView()">Todos</div>
    ${DB.categories.map(c=>`<div class="tab-pill ${ctx.catId===c.id?'active':''}" onclick="app.invContext.catId='${c.id}';app.invContext.subId=null;renderView()">${esc(c.name)}</div>`).join('')}
    ${isAdmin? `<div class="tab-pill" onclick="openCategoryForm()">+ Categoría</div>`:''}
  </div>`;

  if(ctx.catId){
    const cat = DB.categories.find(c=>c.id===ctx.catId);
    if(cat && cat.subs.length){
      html += `<div class="tabbar">
        <div class="tab-pill ${!ctx.subId?'active':''}" onclick="app.invContext.subId=null;renderView()">Todas las subcat.</div>
        ${cat.subs.map(s=>`<div class="tab-pill ${ctx.subId===s.id?'active':''}" onclick="app.invContext.subId='${s.id}';renderView()">${esc(s.name)}</div>`).join('')}
        ${isAdmin? `<div class="tab-pill" onclick="openSubcatForm('${cat.id}')">+ Subcat.</div>`:''}
      </div>`;
    } else if(isAdmin){
      html += `<button class="btn btn-outline btn-sm mt-2" onclick="openSubcatForm('${cat.id}')">+ Agregar subcategoría</button>`;
    }
  }

  if(!products.length){
    html += `<div class="empty"><div class="eic">📦</div><div class="et">Sin productos</div>
      <div class="ed">${isAdmin?'Toca el botón + para agregar el primero.':'No hay productos que coincidan.'}</div></div>`;
  } else {
    html += `<div class="card">`;
    products.forEach(p=>{
      const low = p.stock<=p.minStock;
      const mainPrice = (p.prices && p.prices[0]) ? p.prices[0].price : 0;
      html += `<div class="list-item" onclick="openProductDetail('${p.id}')" style="cursor:pointer">
        ${thumbHtml(p)}
        <div class="li-body">
          <div class="li-title">${esc(p.name)}</div>
          <div class="li-sub">${esc(catName(p.catId))}${p.subId? ' · '+esc(subName(p.catId,p.subId)):''}</div>
        </div>
        <div class="li-right">
          <div class="li-price mono">${fmt(mainPrice)}</div>
          ${fmtUsdLine(mainPrice)}
          <div class="li-stock">${low?'<span class="chip danger">bajo</span>':''} ${p.stock} und.</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}

/* ---- Producto: alta / edición ---- */
function openProductForm(existing){
  const p = existing || {id:null, catId:DB.categories[0]?.id, subId:'', name:'', desc:'', measures:'', photo:'', costPrice:0, prices:[{label:'Venta', price:0}], stock:0, minStock:DB.settings.defaultMinStock};
  const cats = DB.categories;
  window._editingProduct = JSON.parse(JSON.stringify(p));
  window._editingProduct.prices = window._editingProduct.prices && window._editingProduct.prices.length ? window._editingProduct.prices : [{label:'Venta', price:0}];

  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">${existing?'Editar producto':'Nuevo producto'}</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="field" style="text-align:center">
      <div class="thumb" id="prodPhotoPreview" style="width:84px;height:84px;margin:0 auto 8px;border-radius:14px;font-size:30px;">
        ${p.photo?`<img src="${p.photo}">`:'📦'}
      </div>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('fileInputHidden').click()">Elegir foto</button>
    </div>
    <div class="field"><label>Nombre del producto</label><input type="text" id="fpName" value="${esc(p.name)}" placeholder="Ej. Playera talla M"></div>
    <div class="field-row">
      <div class="field"><label>Categoría</label>
        <select id="fpCat" onchange="fillSubSelect(this.value)">
          ${cats.map(c=>`<option value="${c.id}" ${c.id===p.catId?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Subcategoría</label><select id="fpSub"></select></div>
    </div>
    <div class="field"><label>Descripción</label><textarea id="fpDesc" rows="2" placeholder="Detalles del producto">${esc(p.desc)}</textarea></div>
    <div class="field"><label>Medidas / presentación</label><input type="text" id="fpMeasures" value="${esc(p.measures)}" placeholder="Ej. 30x20cm, talla M, 1L"></div>
    <div class="field-row">
      <div class="field"><label>Precio de compra (costo)</label><input type="number" step="0.01" id="fpCost" value="${p.costPrice}"></div>
      <div class="field"><label>Stock actual</label><input type="number" id="fpStock" value="${p.stock}"></div>
    </div>
    <div class="field"><label>Alerta de stock bajo (mínimo)</label><input type="number" id="fpMin" value="${p.minStock}"></div>
    <label>Precios de venta (puedes agregar varios: menudeo, mayoreo, etc.)</label>
    <div id="priceRangeList" class="stack mt-2"></div>
    <button class="btn btn-ghost btn-sm mt-2" onclick="addPriceRow()">+ Agregar precio</button>
    <button class="btn btn-primary btn-block mt-3" onclick="saveProduct()">Guardar producto</button>
    ${existing? `<button class="btn btn-danger btn-block mt-2" onclick="deleteProduct('${p.id}')">Eliminar producto</button>`:''}
  `);
  fillSubSelect(p.catId, p.subId);
  renderPriceRows();
}
function fillSubSelect(catId, selectedSub){
  const cat = DB.categories.find(c=>c.id===catId);
  const sel = document.getElementById('fpSub');
  sel.innerHTML = `<option value="">(ninguna)</option>` + (cat?cat.subs.map(s=>`<option value="${s.id}" ${s.id===selectedSub?'selected':''}>${esc(s.name)}</option>`).join(''):'');
}
function renderPriceRows(){
  const wrap = document.getElementById('priceRangeList');
  wrap.innerHTML = window._editingProduct.prices.map((pr,i)=>`
    <div class="gap-2">
      <input type="text" placeholder="Etiqueta (ej. Mayoreo)" value="${esc(pr.label)}" style="flex:1.3" oninput="window._editingProduct.prices[${i}].label=this.value">
      <input type="number" step="0.01" placeholder="Precio" value="${pr.price}" style="flex:1" oninput="window._editingProduct.prices[${i}].price=parseFloat(this.value)||0">
      ${window._editingProduct.prices.length>1?`<button class="btn btn-danger btn-sm" onclick="removePriceRow(${i})">✕</button>`:''}
    </div>`).join('');
}
function addPriceRow(){ window._editingProduct.prices.push({label:'',price:0}); renderPriceRows(); }
function removePriceRow(i){ window._editingProduct.prices.splice(i,1); renderPriceRows(); }

document.getElementById('fileInputHidden').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const maxDim = 360;
      let w=img.width, h=img.height;
      if(w>h){ if(w>maxDim){h=h*maxDim/w; w=maxDim;} } else { if(h>maxDim){w=w*maxDim/h; h=maxDim;} }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      window._editingProduct.photo = dataUrl;
      const prev = document.getElementById('prodPhotoPreview');
      if(prev) prev.innerHTML = `<img src="${dataUrl}">`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value='';
});

function saveProduct(){
  const name = document.getElementById('fpName').value.trim();
  if(!name) return toast('Escribe el nombre del producto');
  const ep = window._editingProduct;
  const isNew = !ep.id;
  const enteredStock = parseFloat(document.getElementById('fpStock').value)||0;
  const currentStock = isNew ? 0 : (DB.products.find(p=>p.id===ep.id)?.stock || 0);
  const data = {
    id: ep.id || uid(),
    catId: document.getElementById('fpCat').value,
    subId: document.getElementById('fpSub').value,
    name,
    desc: document.getElementById('fpDesc').value.trim(),
    measures: document.getElementById('fpMeasures').value.trim(),
    photo: ep.photo || '',
    costPrice: parseFloat(document.getElementById('fpCost').value)||0,
    stock: currentStock,
    minStock: parseFloat(document.getElementById('fpMin').value)||0,
    prices: ep.prices.filter(pr=>pr.label.trim()!=='').map(pr=>({label:pr.label.trim(),price:pr.price||0})),
    createdAt: ep.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  if(!data.prices.length) data.prices=[{label:'Venta', price:0}];
  const idx = DB.products.findIndex(p=>p.id===data.id);
  if(idx>=0) DB.products[idx]=data; else DB.products.push(data);
  const delta = enteredStock - currentStock;
  if(delta !== 0){
    DB.stockAdjustments.push({id:uid(), productId:data.id, delta, reason: isNew?'Stock inicial':'Ajuste manual', ts:new Date().toISOString()});
  }
  recomputeStock();
  save(); ui.closeSheet(); toast('Producto guardado'); renderView();
}
function deleteProduct(id){
  if(!confirm('¿Eliminar este producto? Desaparecerá del inventario (se conserva en el historial).')) return;
  const p = DB.products.find(p=>p.id===id);
  if(p){ p.deletedAt = new Date().toISOString(); p.updatedAt = p.deletedAt; }
  save(); ui.closeSheet(); toast('Producto eliminado'); renderView();
}

    <div style="text-align:center;margin-bottom:12px">
      <div class="thumb" style="width:100px;height:100px;margin:0 auto;border-radius:16px;font-size:34px;">${p.photo?`<img src="${p.photo}">`:'📦'}</div>
    </div>
    <div class="card">
      <div class="row"><span class="muted small">Categoría</span><span>${esc(catName(p.catId))}${p.subId?' / '+esc(subName(p.catId,p.subId)):''}</span></div>
      ${p.measures?`<div class="row mt-2"><span class="muted small">Medidas</span><span>${esc(p.measures)}</span></div>`:''}
      <div class="row mt-2"><span class="muted small">Stock</span><span class="${p.stock<=p.minStock?'chip danger':'chip ok'}">${p.stock} unidades</span></div>
      ${isAdmin?`<div class="row mt-2"><span class="muted small">Costo</span><span class="mono">${fmt(p.costPrice)} <span class="muted">(${usdEq(p.costPrice)||'—'})</span></span></div>`:''}
      ${p.desc?`<hr class="sep"><div class="small">${esc(p.desc)}</div>`:''}

    ${isAdmin?`<button class="btn btn-primary btn-block mt-2" onclick="openProductForm(DB.products.find(x=>x.id==='${p.id}'))">Editar producto</button>`:
      `<button class="btn btn-accent btn-block mt-2" onclick="ui.closeSheet();addToCart('${p.id}')">Agregar a la venta</button>`}
  `);
}

function viewPurchases(){
  if(!DB.purchases.length){
    return `<div class="empty"><div class="eic">🧾</div><div class="et">Sin compras registradas</div><div class="ed">Toca + para registrar una compra a proveedor.</div></div>`;
  }
  let html = `<div class="card">`;
  DB.purchases.slice().reverse().forEach(pu=>{
    html += `<div class="list-item" style="cursor:pointer" onclick="viewInvoice('${pu.id}')">
      <div class="thumb">🧾</div>
      <div class="li-body"><div class="li-title">${esc(pu.supplier||'Proveedor')}</div><div class="li-sub">Factura #${pu.invoiceNo} · ${pu.date}</div></div>
      <div class="li-right"><div class="li-price mono">${fmt(pu.total)}</div>${fmtUsdLine(pu.total)}<div class="li-stock">${pu.items.length} items</div></div>
    </div>`;
  });
  html += `</div>`;
  return html;
}
/* ---------------- Buscador genérico de producto (apilado sobre cualquier hoja) ---------------- */
function openProductSearch(onSelect, opts){
  opts = opts || {};
  window._psQuery = '';
  window._psOnSelect = onSelect;
  window._psExtra = opts;
  ui.openPicker(`
    <div class="sheet-header"><div class="sheet-title">Buscar producto</div><button class="sheet-close" onclick="ui.closePicker()">✕</button></div>
    <div class="searchbar">
      <span class="sic">🔎</span>
      <input type="text" id="psQueryInput" placeholder="Escribe el nombre del producto..." oninput="window._psQuery=this.value; renderProductSearchResults()">
    </div>
    <div class="picker-results" id="psResults"></div>
  `);
  renderProductSearchResults();
  setTimeout(()=>{ const i = document.getElementById('psQueryInput'); if(i) i.focus(); }, 150);
}
function renderProductSearchResults(){
  const wrap = document.getElementById('psResults');
  if(!wrap) return;
  const q = (window._psQuery||'').trim().toLowerCase();
  let list = activeProducts();
  if(q) list = list.filter(p=>(p.name+' '+(p.desc||'')).toLowerCase().includes(q));

  if(!list.length){
    wrap.innerHTML = `<div class="small muted" style="padding:14px 0">Sin resultados</div>`;
    return;
  }

  // Agrupar por categoría, respetando el orden de DB.categories
  const byCat = {};
  list.forEach(p=>{ (byCat[p.catId] = byCat[p.catId]||[]).push(p); });
  let html = '';
  DB.categories.forEach(c=>{
    const items = byCat[c.id];
    if(!items || !items.length) return;
    html += `<div class="picker-group-title">${esc(c.name)}</div>`;
    html += items.map(p=>productSearchRowHTML(p)).join('');
    delete byCat[c.id];
  });
  // Productos con categoría no encontrada (por si acaso)
  Object.keys(byCat).forEach(catId=>{
    html += `<div class="picker-group-title">Otros</div>`;
    html += byCat[catId].map(p=>productSearchRowHTML(p)).join('');
  });
  wrap.innerHTML = html;
}
function productSearchRowHTML(p){
  return `<div class="list-item" style="cursor:pointer" onclick="selectFromProductSearch('${p.id}')">
    ${thumbHtml(p)}
    <div class="li-body"><div class="li-title">${esc(p.name)}</div><div class="li-sub">${p.stock} en stock · Costo actual: ${fmt(p.costPrice)}</div></div>
  </div>`;
}
function selectFromProductSearch(pid){
  const cb = window._psOnSelect;
  ui.closePicker();
  if(cb) cb(pid);
}

function openPurchaseForm(){
  window._purchaseCart = [];
  window._pfSelectedProduct = null;
  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">Nueva compra</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="field"><label>Proveedor</label><input type="text" id="pfSupplier" placeholder="Nombre del proveedor"></div>
    <div class="field"><label>Fecha</label><input type="date" id="pfDate" value="${todayISO()}"></div>
    <hr class="sep">
    <label>Agregar producto a la compra</label>
    <div id="pfSelectedBox" class="mt-2"></div>
    <button class="btn btn-outline btn-block mt-2" onclick="openProductSearch(function(pid){selectPfProduct(pid);})">🔎 Buscar producto</button>

    <div class="field-row mt-2">
      <div class="field">
        <label>Cantidad</label>
        <input type="number" id="pfQty" value="0" oninput="updatePfLineTotal()">
        <div class="gap-2 mt-2" id="pfQtySteps"></div>
      </div>
      <div class="field"><label>Costo unitario</label><input type="number" step="0.01" id="pfCost" value="0" oninput="updatePfLineTotal()"></div>
    </div>
    <div class="small muted" id="pfLineTotal" style="margin-bottom:8px"></div>
    <button class="btn btn-ghost btn-block" onclick="addPurchaseLine()">+ Agregar a la compra</button>
    <div id="purchaseLines" class="stack mt-2"></div>
    <div class="row mt-3"><span style="font-weight:800">Total</span><span style="text-align:right"><span class="mono" style="font-weight:800" id="purchaseTotal">${fmt(0)}</span><div class="small muted" id="purchaseTotalUsd"></div></span></div>
    <button class="btn btn-primary btn-block mt-2" onclick="savePurchase()">Guardar y generar factura</button>
  `);
  renderPfQtySteps();
  renderPurchaseLines();
}
function renderPfQtySteps(){
  const wrap = document.getElementById('pfQtySteps');
  if(!wrap) return;
  wrap.innerHTML = `<div class="hscroll">` + DB.settings.qtySteps.map(n=>
    `<button class="btn btn-outline btn-sm" style="flex:0 0 auto" onclick="bumpPfQty(${n})">+${n}</button>`
  ).join('') + `</div><div class="hscroll mt-2">` + DB.settings.qtySteps.map(n=>
    `<button class="btn btn-outline btn-sm" style="flex:0 0 auto" onclick="bumpPfQty(-${n})">−${n}</button>`
  ).join('') + `</div>`;
}
function bumpPfQty(n){
  const el = document.getElementById('pfQty');
  el.value = Math.max(0, (parseFloat(el.value)||0) + n);
  updatePfLineTotal();
}
function selectPfProduct(pid){
  const p = DB.products.find(p=>p.id===pid);
  if(!p) return;
  window._pfSelectedProduct = p;
  document.getElementById('pfSelectedBox').innerHTML = `
    <div class="list-item" style="background:var(--surface-2);border-radius:10px;padding:8px 10px">
      ${thumbHtml(p)}
      <div class="li-body"><div class="li-title">${esc(p.name)}</div><div class="li-sub">Seleccionado</div></div>
      <button class="btn btn-danger btn-sm" onclick="window._pfSelectedProduct=null;document.getElementById('pfSelectedBox').innerHTML=''">✕</button>
    </div>`;
  document.getElementById('pfCost').value = p.costPrice || 0;
  updatePfLineTotal();
}
function updatePfLineTotal(){
  const el = document.getElementById('pfLineTotal');
  if(!el) return;
  const qty = parseFloat(document.getElementById('pfQty').value)||0;
  const cost = parseFloat(document.getElementById('pfCost').value)||0;
  el.textContent = qty && cost ? `Subtotal: ${fmt(qty*cost)}` : '';
}
function addPurchaseLine(){
  const p = window._pfSelectedProduct;
  const qty = parseFloat(document.getElementById('pfQty').value)||0;
  const cost = parseFloat(document.getElementById('pfCost').value)||0;
  if(!p || qty<=0) return toast('Busca y selecciona un producto primero');
  window._purchaseCart.push({productId:p.id, qty, cost});
  window._pfSelectedProduct = null;
  document.getElementById('pfSelectedBox').innerHTML='';
  document.getElementById('pfQty').value = 0;
  document.getElementById('pfCost').value = 0;
  document.getElementById('pfLineTotal').textContent = '';
  renderPurchaseLines();
}
function renderPurchaseLines(){
  const wrap = document.getElementById('purchaseLines');
  let total=0;
  wrap.innerHTML = window._purchaseCart.map((l,i)=>{
    const p = DB.products.find(p=>p.id===l.productId);
    total += l.qty*l.cost;
    return `<div class="cart-line"><div class="li-body"><div class="li-title">${esc(p?p.name:'?')}</div><div class="li-sub">${l.qty} x ${fmt(l.cost)}</div></div>
      <div style="text-align:right"><div class="mono" style="font-weight:700">${fmt(l.qty*l.cost)}</div>${fmtUsdLine(l.qty*l.cost)}</div>
      <button class="btn btn-danger btn-sm" onclick="window._purchaseCart.splice(${i},1);renderPurchaseLines()">✕</button></div>`;
  }).join('');
  document.getElementById('purchaseTotal').textContent = fmt(total);
  document.getElementById('purchaseTotalUsd').innerHTML = DB.settings.usdRate>0 ? '≈ '+usdEq(total) : '';
}
function savePurchase(){
  if(!window._purchaseCart.length) return toast('Agrega al menos un producto');
  const supplier = document.getElementById('pfSupplier').value.trim();
  const date = document.getElementById('pfDate').value || todayISO();
  const items = window._purchaseCart;
  const total = items.reduce((a,l)=>a+l.qty*l.cost,0);
  const invoiceNo = DB.invoiceCounter+'-'+deviceShort();
  DB.invoiceCounter++;
  const purchase = {id:uid(), date, supplier, items, total, invoiceNo, createdAt:new Date().toISOString()};
  DB.purchases.push(purchase);
  items.forEach(l=>{
    const p = DB.products.find(p=>p.id===l.productId);
    if(p){ p.costPrice = l.cost; p.updatedAt = new Date().toISOString(); }
  });
  recomputeStock();
  save();
  toast('Compra registrada');
  viewInvoice(purchase.id);
}
function viewInvoice(purchaseId){
  const pu = DB.purchases.find(p=>p.id===purchaseId);
  if(!pu) return;
  const lines = pu.items.map(l=>{
    const p = DB.products.find(p=>p.id===l.productId);
    return {name:p?p.name:'Producto', qty:l.qty, cost:l.cost, sub:l.qty*l.cost};
  });
  const waText = buildWhatsappPurchaseText(pu, lines);
  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">Factura #${pu.invoiceNo}</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="card" id="invoiceArea">
      <div class="row"><b>${esc(DB.meta.bizName)}</b><span class="small muted">${pu.date}</span></div>
      <div class="small muted mt-2">Proveedor: ${esc(pu.supplier||'—')}</div>
      <hr class="sep">
      ${lines.map(l=>`<div class="row" style="padding:4px 0"><span class="small">${esc(l.name)} x${l.qty}</span><span style="text-align:right"><span class="mono small">${fmt(l.sub)}</span>${fmtUsdLine(l.sub)}</span></div>`).join('')}
      <hr class="sep">
      <div class="row"><b>Total</b><span style="text-align:right"><b class="mono">${fmt(pu.total)}</b>${fmtUsdLine(pu.total)}</span></div>
    </div>
    <div class="section-title">Mensaje para WhatsApp</div>
    <div class="wa-preview" id="waMsg">${esc(waText)}</div>
    <div class="gap-2 mt-2">
      <button class="btn btn-ghost btn-block" onclick="copyToClipboard(\`${waText.replace(/`/g,"'")}\`)">📋 Copiar mensaje</button>
      <button class="btn btn-accent btn-block" onclick="window.open('https://wa.me/?text='+encodeURIComponent(\`${waText.replace(/`/g,"'")}\`),'_blank')">💬 Abrir WhatsApp</button>
    </div>
    <button class="btn btn-outline btn-block mt-2" onclick="window.print()">🖨️ Imprimir / guardar como PDF</button>
  `);
}
function buildWhatsappPurchaseText(pu, lines){
  let t = `🧾 *${DB.meta.bizName}*\nCompra / Factura #${pu.invoiceNo}\nFecha: ${pu.date}\nProveedor: ${pu.supplier||'—'}\n\n`;
  lines.forEach(l=> t += `• ${l.name} x${l.qty} — ${fmt(l.sub)}\n`);
  t += `\n*Total: ${fmt(pu.total)}*`;
  if(DB.settings.usdRate>0) t += ` (≈ ${usdEq(pu.total)})`;
  return t;
}
function copyToClipboard(text){
  navigator.clipboard? navigator.clipboard.writeText(text).then(()=>toast('Mensaje copiado')).catch(()=>fallbackCopy(text))
   : fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Mensaje copiado'); }catch(e){ toast('No se pudo copiar'); }
  document.body.removeChild(ta);
}

   VENTAS (POS)
   ========================================================= */
function viewSales(){
  const ctx = app.posContext;
  let html = categoryTabsHTML(ctx, 'app.posContext', 'renderView');
  html += `<div class="searchbar"><span class="sic">🔎</span>
    <input type="text" id="posSearch" placeholder="Buscar producto para vender..." value="${esc(ctx.q)}" oninput="app.posContext.q=this.value; renderPosResults()"></div>
    <div id="posResults" class="card"></div>
    <div class="section-title">Carrito</div>
    <div id="cartWrap"></div>`;
  setTimeout(()=>{ renderPosResults(); renderCart(); },0);
  return html;
}
function renderPosResults(){
  const wrap = document.getElementById('posResults');
  if(!wrap) return;
  const ctx = app.posContext;
  let list = filterProductsByCtx(activeProducts(), ctx);
  if(!list.length){ wrap.innerHTML = `<div class="empty" style="padding:20px"><div class="ed">Sin resultados</div></div>`; return; }
  wrap.innerHTML = list.map(p=>`
    <div class="list-item" style="cursor:pointer" onclick="addToCart('${p.id}')">
      ${thumbHtml(p)}
      <div class="li-body"><div class="li-title">${esc(p.name)}</div><div class="li-sub">${p.stock} disponibles</div></div>
      <div class="li-right"><div class="li-price mono">${fmt(p.prices[0]?p.prices[0].price:0)}</div>${fmtUsdLine(p.prices[0]?p.prices[0].price:0)}</div>
    </div>`).join('');
}
function addToCart(pid){
  const p = DB.products.find(p=>p.id===pid);
  if(!p) return;
  if(p.stock<=0) return toast('Sin stock disponible');
  let line = app.cart.find(l=>l.productId===pid);
  if(line){ if(line.qty<p.stock) line.qty++; else toast('No hay más stock'); }
  else app.cart.push({productId:pid, qty:1, priceIndex:0});
  renderCart();
  toast(p.name+' agregado');
}
function renderCart(){
  const wrap = document.getElementById('cartWrap');
  if(!wrap) return;
  if(!app.cart.length){ wrap.innerHTML = `<div class="empty" style="padding:24px"><div class="eic">🛒</div><div class="ed">Agrega productos para iniciar una venta</div></div>`; return; }
  let subtotal=0;
  let html = `<div class="card">`;
  app.cart.forEach((l,i)=>{
    const p = DB.products.find(p=>p.id===l.productId);
    if(!p) return;
    const price = p.prices[l.priceIndex]?p.prices[l.priceIndex].price:p.prices[0].price;
    const sub = price*l.qty;
    subtotal += sub;
    html += `<div class="cart-line">
      <div class="li-body">
        <div class="li-title">${esc(p.name)}</div>
        ${p.prices.length>1?`<select style="margin-top:4px;padding:4px 6px;font-size:calc(11px * var(--font-scale))" onchange="app.cart[${i}].priceIndex=parseInt(this.value);renderCart()">
          ${p.prices.map((pr,pi)=>`<option value="${pi}" ${pi===l.priceIndex?'selected':''}>${esc(pr.label)} — ${fmt(pr.price)}</option>`).join('')}
        </select>`:''}
      </div>
      <div class="qty-ctl">
        <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
        <span class="mono">${l.qty}</span>
        <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
      </div>
      <div style="width:78px;text-align:right">
        <div class="mono" style="font-weight:800">${fmt(sub)}</div>
        ${fmtUsdLine(sub)}
      </div>
    </div>`;
  });
  html += `</div>`;

  const opts = app.saleOptions;
  const defaultPct = DB.settings.transferSurchargePct||0;
  const surchargePct = opts.payment==='transfer' ? (opts.transferPct!=null ? opts.transferPct : defaultPct) : defaultPct;
  const surchargeAmt = opts.payment==='transfer' ? subtotal*surchargePct/100 : 0;
  const deliveryFee = opts.delivery ? (parseFloat(opts.deliveryFee)||0) : 0;
  const total = subtotal + surchargeAmt + deliveryFee;
  const selectedClient = opts.clientId ? DB.clients.find(c=>c.id===opts.clientId) : null;

  html += `<div class="card">
    <label>Forma de pago</label>
    <div class="gap-2 mt-2">
      <button class="btn ${opts.payment==='cash'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="app.saleOptions.payment='cash';renderCart()">💵 Efectivo</button>
      <button class="btn ${opts.payment==='transfer'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="app.saleOptions.payment='transfer';app.saleOptions.transferPct=DB.settings.transferSurchargePct||0;renderCart()">💳 Transferencia${defaultPct>0?' (+'+defaultPct+'%)':''}</button>
    </div>
    <div class="gap-2 mt-2">
      <button class="btn ${opts.payment==='credit'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="app.saleOptions.payment='credit';renderCart()">🤝 Fiado</button>
    </div>
    ${opts.payment==='transfer'?`<div class="field mt-2" style="margin-bottom:0"><label>Recargo para esta venta (%)</label><input type="number" step="0.1" id="transferPctInput" value="${surchargePct}" oninput="app.saleOptions.transferPct=parseFloat(this.value)||0;updateCartSummary()"></div>`:''}
    <hr class="sep">
    <label>Cliente ${opts.payment==='credit'?'(obligatorio para fiado)':'(opcional)'}</label>
    ${selectedClient?`<div class="row mt-2"><span class="small">${esc(selectedClient.name)}</span><button class="btn btn-ghost btn-sm" onclick="app.saleOptions.clientId=null;renderCart()">Quitar</button></div>`
      :`<button class="btn btn-outline btn-block mt-2" onclick="openClientPicker(function(cid){app.saleOptions.clientId=cid;renderCart()})">👤 Elegir cliente</button>`}
    <hr class="sep">
    <label class="row" style="cursor:pointer" onclick="app.saleOptions.delivery=!app.saleOptions.delivery;renderCart()">
      <span>🛵 Entrega a domicilio</span>
      <span class="chip ${opts.delivery?'ok':''}">${opts.delivery?'Sí':'No'}</span>
    </label>
    ${opts.delivery?`<div class="field mt-2" style="margin-bottom:0"><label>Costo del domicilio</label><input type="number" step="0.01" id="deliveryFeeInput" value="${opts.deliveryFee||''}" placeholder="0" oninput="app.saleOptions.deliveryFee=this.value;updateCartSummary()"></div>`:''}
  </div>

  <div class="card" id="cartSummary">
    ${cartSummaryHtml(subtotal, surchargePct, surchargeAmt, deliveryFee, total)}
  </div>
  <div class="gap-2">
    <button class="btn btn-outline btn-block" onclick="app.cart=[];resetSaleOptions();renderCart()">Vaciar</button>
    <button class="btn btn-primary btn-block" onclick="checkout()">Cobrar</button>
  </div>`;
  wrap.innerHTML = html;
}
function cartSummaryHtml(subtotal, surchargePct, surchargeAmt, deliveryFee, total){
  return `<div class="row"><span class="small muted">Subtotal</span><span class="mono small">${fmt(subtotal)}</span></div>
    ${surchargeAmt>0?`<div class="row mt-2"><span class="small muted">Recargo transferencia (${surchargePct}%)</span><span class="mono small">${fmt(surchargeAmt)}</span></div>`:''}
    ${deliveryFee>0?`<div class="row mt-2"><span class="small muted">Domicilio</span><span class="mono small">${fmt(deliveryFee)}</span></div>`:''}
    <hr class="sep">
    <div class="row"><span style="font-weight:800;font-size:calc(16px * var(--font-scale))">Total</span>
      <span style="text-align:right"><span class="mono" style="font-weight:800;font-size:calc(18px * var(--font-scale))">${fmt(total)}</span>${fmtUsdLine(total)}</span></div>`;
}
function updateCartSummary(){
  const summaryWrap = document.getElementById('cartSummary');
  if(!summaryWrap) return;
  let subtotal=0;
  app.cart.forEach(l=>{
    const p = DB.products.find(p=>p.id===l.productId);
    if(!p) return;
    const price = p.prices[l.priceIndex]?p.prices[l.priceIndex].price:p.prices[0].price;
    subtotal += price*l.qty;
  });
  const opts = app.saleOptions;
  const defaultPct = DB.settings.transferSurchargePct||0;
  const surchargePct = opts.payment==='transfer' ? (opts.transferPct!=null ? opts.transferPct : defaultPct) : defaultPct;
  const surchargeAmt = opts.payment==='transfer' ? subtotal*surchargePct/100 : 0;
  const deliveryFee = opts.delivery ? (parseFloat(opts.deliveryFee)||0) : 0;
  const total = subtotal + surchargeAmt + deliveryFee;
  summaryWrap.innerHTML = cartSummaryHtml(subtotal, surchargePct, surchargeAmt, deliveryFee, total);
}
function resetSaleOptions(){ app.saleOptions = {payment:'cash', delivery:false, deliveryFee:'', transferPct:null, clientId:null}; }
function changeQty(i, delta){
  const l = app.cart[i];
  const p = DB.products.find(p=>p.id===l.productId);
  const newQty = l.qty+delta;
  if(newQty<=0){ app.cart.splice(i,1); renderCart(); return; }
  if(newQty>p.stock){ toast('No hay más stock'); return; }
  l.qty = newQty;
  renderCart();
}
function checkout(){
  if(!app.cart.length) return;
  const opts = app.saleOptions;
  if(opts.payment==='credit' && !opts.clientId){
    return toast('Elige un cliente para vender fiado');
  }
  const items = app.cart.map(l=>{
    const p = DB.products.find(p=>p.id===l.productId);
    const price = p.prices[l.priceIndex]?p.prices[l.priceIndex].price:p.prices[0].price;
    return {productId:l.productId, name:p.name, qty:l.qty, priceLabel:p.prices[l.priceIndex]?p.prices[l.priceIndex].label:p.prices[0].label, price};
  });
  const subtotal = items.reduce((a,l)=>a+l.qty*l.price,0);
  const surchargePct = opts.payment==='transfer' ? (opts.transferPct!=null ? opts.transferPct : (DB.settings.transferSurchargePct||0)) : 0;
  const surchargeAmt = subtotal*surchargePct/100;
  const deliveryFee = opts.delivery ? (parseFloat(opts.deliveryFee)||0) : 0;
  const total = subtotal + surchargeAmt + deliveryFee;
  const sale = {
    id:uid(), date:new Date().toISOString(), items, subtotal, total, seller: app.role,
    payment: opts.payment, transferSurchargePct: surchargePct, transferSurchargeAmount: surchargeAmt,
    isDelivery: !!opts.delivery, deliveryFee: deliveryFee, clientId: opts.clientId||null
  };
  DB.sales.push(sale);
  recomputeStock();
  app.cart = [];
  resetSaleOptions();
  save();
  const paymentLabel = opts.payment==='transfer'?'💳 Transferencia':(opts.payment==='credit'?'🤝 Fiado':'💵 Efectivo');
  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">✅ Venta registrada</div><button class="sheet-close" onclick="ui.closeSheet();app.go('sales')">✕</button></div>
    <div class="card">
      ${items.map(it=>`<div class="row" style="padding:4px 0"><span class="small">${esc(it.name)} x${it.qty}</span><span style="text-align:right"><span class="mono small">${fmt(it.qty*it.price)}</span>${fmtUsdLine(it.qty*it.price)}</span></div>`).join('')}
      ${surchargeAmt>0?`<div class="row" style="padding:4px 0"><span class="small muted">Recargo transferencia (${surchargePct}%)</span><span class="mono small">${fmt(surchargeAmt)}</span></div>`:''}
      ${deliveryFee>0?`<div class="row" style="padding:4px 0"><span class="small muted">Domicilio</span><span class="mono small">${fmt(deliveryFee)}</span></div>`:''}
      <hr class="sep"><div class="row"><b>Total</b><span style="text-align:right"><b class="mono">${fmt(total)}</b>${fmtUsdLine(total)}</span></div>
      <div class="gap-2 mt-2">
        <span class="chip">${paymentLabel}</span>
        ${opts.delivery?'<span class="chip">🛵 A domicilio</span>':''}
      </div>
    </div>
    <button class="btn btn-primary btn-block" onclick="ui.closeSheet();app.go('sales')">Nueva venta</button>
  `);
}

/* ---------------- CLIENTES ---------------- */
function cleanPhone(phone){
  return (phone||'').replace(/[^0-9+]/g,'');
}
function openClientPicker(onSelect){
  window._clientPickQuery = '';
  window._clientPickOnSelect = onSelect;
  ui.openPicker(`
    <div class="sheet-header"><div class="sheet-title">Elegir cliente</div><button class="sheet-close" onclick="ui.closePicker()">✕</button></div>
    <div class="searchbar">
      <span class="sic">🔎</span>
      <input type="text" id="clientPickInput" placeholder="Buscar por nombre o teléfono..." oninput="window._clientPickQuery=this.value; renderClientPickResults()">
    </div>
    <button class="btn btn-outline btn-block" style="margin-bottom:10px" onclick="openClientForm(null, function(c){ ui.closePicker(); const cb=window._clientPickOnSelect; if(cb) cb(c.id); })">+ Nuevo cliente</button>
    <div class="picker-results" id="clientPickResults"></div>
  `);
  renderClientPickResults();
  setTimeout(()=>{ const i=document.getElementById('clientPickInput'); if(i) i.focus(); }, 150);
}
function renderClientPickResults(){
  const wrap = document.getElementById('clientPickResults');
  if(!wrap) return;
  const q = (window._clientPickQuery||'').trim().toLowerCase();
  let list = DB.clients.slice();
  if(q) list = list.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(q));
  list.sort((a,b)=>a.name.localeCompare(b.name));
  if(!list.length){ wrap.innerHTML = `<div class="small muted" style="padding:14px 0">Sin clientes. Toca "+ Nuevo cliente".</div>`; return; }
  wrap.innerHTML = list.map(c=>`
    <div class="list-item" style="cursor:pointer" onclick="const cb=window._clientPickOnSelect; ui.closePicker(); if(cb) cb('${c.id}')">
      <div class="thumb">👤</div>
      <div class="li-body"><div class="li-title">${esc(c.name)}</div><div class="li-sub">${esc(c.phone||'Sin teléfono')}</div></div>
    </div>`).join('');
}

function clientDebt(clientId){
  const owed = DB.sales.filter(s=>s.clientId===clientId && s.payment==='credit').reduce((a,s)=>a+s.total,0);
  const paid = DB.clientPayments.filter(p=>p.clientId===clientId).reduce((a,p)=>a+p.amount,0);
  return owed - paid;
}

function viewClientsScreen(){
  window._clientsQuery = window._clientsQuery || '';
  return `<div class="searchbar">
      <span class="sic">🔎</span>
      <input type="text" value="${esc(window._clientsQuery)}" placeholder="Buscar por nombre o teléfono..." oninput="window._clientsQuery=this.value; renderClientsList()">
    </div>
    <div id="clientsListWrap">${clientsListHTML()}</div>`;
}
function clientsListHTML(){
  const q = (window._clientsQuery||'').trim().toLowerCase();
  let list = DB.clients.slice();
  if(q) list = list.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(q));
  list.sort((a,b)=>a.name.localeCompare(b.name));
  if(!list.length){ return `<div class="empty"><div class="eic">👤</div><div class="et">Sin clientes registrados todavía</div><div class="ed">Toca + para agregar el primero.</div></div>`; }
  return `<div class="card">` + list.map(c=>{
    const debt = clientDebt(c.id);
    return `<div class="list-item" style="cursor:pointer" onclick="openClientDetail('${c.id}')">
      <div class="thumb">👤</div>
      <div class="li-body"><div class="li-title">${esc(c.name)}</div><div class="li-sub">${esc(c.phone||'Sin teléfono')}</div></div>
      <div class="li-right">${debt>0?`<div class="mono small" style="color:var(--danger);font-weight:800">Debe ${fmt(debt)}</div>`:`<div class="small muted">Al día</div>`}</div>
    </div>`;
  }).join('') + `</div>`;
}
function renderClientsList(){
  const wrap = document.getElementById('clientsListWrap');
  if(!wrap) return;
  wrap.innerHTML = clientsListHTML();
}

function openClientForm(id, onSave){
  const c = id ? DB.clients.find(c=>c.id===id) : null;
  window._clientFormOnSave = onSave || null;
  window._clientFormEditId = id || null;
  ui.openPicker(`
    <div class="sheet-header"><div class="sheet-title">${c?'Editar cliente':'Nuevo cliente'}</div><button class="sheet-close" onclick="ui.closePicker()">✕</button></div>
    <div class="field"><label>Nombre</label><input type="text" id="cfName" value="${c?esc(c.name):''}" placeholder="Nombre del cliente"></div>
    <div class="field"><label>Teléfono</label><input type="text" id="cfPhone" value="${c?esc(c.phone||''):''}" placeholder="Ej. +53 5555-1234">
      <div class="small muted mt-2" style="margin-bottom:0">Incluye el código de país (ej. +53) para que el acceso directo a WhatsApp funcione bien.</div>
    </div>
    <div class="field"><label>Descripción</label><textarea id="cfDesc" rows="2" placeholder="Notas sobre el cliente (opcional)">${c?esc(c.desc||''):''}</textarea></div>
    <button class="btn btn-primary btn-block" onclick="saveClientForm()">Guardar cliente</button>
    ${c?`<button class="btn btn-outline btn-block mt-2" style="color:var(--danger)" onclick="if(confirm('¿Eliminar este cliente? No se borra su historial de ventas.')){DB.clients=DB.clients.filter(x=>x.id!=='${c.id}');save();ui.closePicker();ui.closeSheet();}">Eliminar cliente</button>`:''}
  `);
  setTimeout(()=>{ const i=document.getElementById('cfName'); if(i) i.focus(); }, 150);
}
function saveClientForm(){
  const name = document.getElementById('cfName').value.trim();
  if(!name) return toast('Escribe el nombre del cliente');
  const phone = document.getElementById('cfPhone').value.trim();
  const desc = document.getElementById('cfDesc').value.trim();
  let c;
  if(window._clientFormEditId){
    c = DB.clients.find(x=>x.id===window._clientFormEditId);
    c.name = name; c.phone = phone; c.desc = desc;
  } else {
    c = {id:uid(), name, phone, desc, createdAt:new Date().toISOString()};
    DB.clients.push(c);
  }
  save();
  ui.closePicker();
  const cb = window._clientFormOnSave;
  if(cb) cb(c);
  else if(document.getElementById('clientsListWrap')) renderClientsList();
  else if(window._clientDetailId===c.id) openClientDetail(c.id);
}

function openClientDetail(id){
  window._clientDetailId = id;
  const c = DB.clients.find(c=>c.id===id);
  if(!c) return;
  const debt = clientDebt(id);

  // Combinar ventas y pagos en un solo historial, más reciente primero
  const salesTx = DB.sales.filter(s=>s.clientId===id).map(s=>({
    kind:'sale', date:s.date, sale:s
  }));
  const paymentTx = DB.clientPayments.filter(p=>p.clientId===id).map(p=>({
    kind:'payment', date:p.date, payment:p
  }));
  const tx = salesTx.concat(paymentTx).sort((a,b)=> new Date(b.date) - new Date(a.date));

  // Agrupar por mes
  const groups = {};
  const order = [];
  tx.forEach(t=>{
    const d = new Date(t.date);
    const key = d.toLocaleDateString('es-MX', {month:'long', year:'numeric'});
    if(!groups[key]){ groups[key]=[]; order.push(key); }
    groups[key].push(t);
  });

  let historyHtml = '';
  if(!tx.length){
    historyHtml = `<div class="small muted" style="padding:8px 0">Sin compras ni pagos registrados todavía</div>`;
  } else {
    order.forEach(monthKey=>{
      historyHtml += `<div class="picker-group-title">${monthKey}</div>`;
      groups[monthKey].forEach(t=>{
        const d = new Date(t.date);
        const dateLabel = d.toLocaleDateString('es-MX', {day:'2-digit', month:'short'});
        if(t.kind==='sale'){
          const s = t.sale;
          const detail = s.items.map(it=>`${esc(it.name)} x${it.qty}`).join(', ');
          const tag = s.payment==='credit'?'🤝 Fiado':(s.payment==='transfer'?'💳 Transferencia':'💵 Efectivo');
          historyHtml += `<div class="list-item">
            <div class="thumb">🛒</div>
            <div class="li-body"><div class="li-title">${dateLabel} · ${tag}</div><div class="li-sub">${detail}</div></div>
            <div class="li-right"><div class="mono small" style="font-weight:800">${fmt(s.total)}</div></div>
          </div>`;
        } else {
          const p = t.payment;
          historyHtml += `<div class="list-item">
            <div class="thumb">💰</div>
            <div class="li-body"><div class="li-title">${dateLabel} · Pago de deuda</div>${p.note?`<div class="li-sub">${esc(p.note)}</div>`:''}</div>
            <div class="li-right"><div class="mono small" style="font-weight:800;color:var(--ok)">-${fmt(p.amount)}</div></div>
          </div>`;
        }
      });
    });
  }

  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">${esc(c.name)}</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="card">
      <div class="row"><span class="small muted">Teléfono</span><span class="small">${esc(c.phone||'—')}</span></div>
      ${c.phone?`<div class="gap-2 mt-2">
        <a class="btn btn-outline btn-block btn-sm" style="text-decoration:none;text-align:center" href="tel:${esc(cleanPhone(c.phone))}">📞 Llamar</a>
        <a class="btn btn-outline btn-block btn-sm" style="text-decoration:none;text-align:center" href="https://wa.me/${esc(cleanPhone(c.phone))}" target="_blank" rel="noopener">💬 WhatsApp</a>
      </div>`:''}
      ${c.desc?`<div class="row mt-2"><span class="small muted">Notas</span><span class="small" style="text-align:right;max-width:60%">${esc(c.desc)}</span></div>`:''}
      <hr class="sep">
      <div class="row"><span style="font-weight:800">Estado</span>
        <span class="mono" style="font-weight:800;color:${debt>0?'var(--danger)':'var(--ok)'}">${debt>0?'Debe '+fmt(debt):'Al día'}</span></div>
      <div class="gap-2 mt-2">
        <button class="btn btn-outline btn-block btn-sm" onclick="openClientForm('${c.id}')">✏️ Editar</button>
        ${debt>0?`<button class="btn btn-primary btn-block btn-sm" onclick="openClientPaymentForm('${c.id}')">💰 Registrar pago</button>`:''}
      </div>
    </div>
    <div class="section-title">Historial</div>
    ${historyHtml}
  `);
}

function openClientPaymentForm(clientId){
  const debt = clientDebt(clientId);
  ui.openPicker(`
    <div class="sheet-header"><div class="sheet-title">Registrar pago</div><button class="sheet-close" onclick="ui.closePicker()">✕</button></div>
    <div class="small muted" style="margin-bottom:10px">Deuda actual: <b class="mono">${fmt(debt)}</b></div>
    <div class="field"><label>Monto pagado</label><input type="number" step="0.01" id="cpAmount" value="0" placeholder="0"></div>
    <div class="field"><label>Nota (opcional)</label><input type="text" id="cpNote" placeholder="Ej. Pago parcial"></div>
    <button class="btn btn-primary btn-block" onclick="saveClientPayment('${clientId}')">Guardar pago</button>
  `);
  setTimeout(()=>{ const i=document.getElementById('cpAmount'); if(i) i.focus(); }, 150);
}
function saveClientPayment(clientId){
  const amount = parseFloat(document.getElementById('cpAmount').value)||0;
  if(amount<=0) return toast('Escribe un monto válido');
  const note = document.getElementById('cpNote').value.trim();
  DB.clientPayments.push({id:uid(), clientId, amount, note, date:new Date().toISOString(), createdAt:new Date().toISOString()});
  save();
  ui.closePicker();
  openClientDetail(clientId);
}

function viewSaleHistory(){
  if(!DB.sales.length) return `<div class="empty"><div class="eic">📜</div><div class="et">Sin ventas todavía</div></div>`;
  let html = `<div class="card">`;
  DB.sales.slice().reverse().forEach(s=>{
    const detail = s.items.map(it=>`${esc(it.name)} x${it.qty}`).join(', ');
    const chips = [];
    if(s.payment==='transfer') chips.push('💳 Transferencia');
    if(s.isDelivery) chips.push('🛵 Domicilio');
    html += `<div class="list-item">
      <div class="thumb">🧾</div>
      <div class="li-body"><div class="li-title">${detail}</div><div class="li-sub">${new Date(s.date).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'})}${chips.length?' · '+chips.join(' · '):''}</div></div>
      <div class="li-right"><div class="li-price mono">${fmt(s.total)}</div>${fmtUsdLine(s.total)}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function convFromUsd(){

function convFromCup(){

function calcCash(){

/* =========================================================
   GASTOS Y FINANZAS
   ========================================================= */
function viewExpenses(){
  const period = app._expPeriod || 'mes';
  const {from} = periodRange(period);
  const salesP = DB.sales.filter(s=> new Date(s.date) >= from);
  const expP = DB.expenses.filter(e=> new Date(e.date) >= from);
  const lossesP = (DB.losses||[]).filter(l=> new Date(l.date) >= from);
  const revenue = salesP.reduce((a,s)=>a+s.total,0);
  const cogs = salesP.reduce((a,s)=> a + s.items.reduce((b,it)=>{
    const p = DB.products.find(p=>p.id===it.productId);
    return b + (p? p.costPrice*it.qty : 0);
  },0),0);
  const totalExp = expP.reduce((a,e)=>a+e.amount,0);
  const totalLosses = lossesP.reduce((a,l)=>a+l.costImpact,0);
  const profit = revenue - cogs - totalExp - totalLosses;

  let html = `<div class="tabbar">
    ${['hoy','semana','mes','todo'].map(p=>`<div class="tab-pill ${period===p?'active':''}" onclick="app._expPeriod='${p}';renderView()">${p[0].toUpperCase()+p.slice(1)}</div>`).join('')}
  </div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-val mono">${fmt(revenue)}</div><div class="stat-lbl">Ventas</div></div>
    <div class="stat-card"><div class="stat-val mono">${fmt(cogs)}</div><div class="stat-lbl">Costo de mercancía</div></div>
    <div class="stat-card"><div class="stat-val mono">${fmt(totalExp)}</div><div class="stat-lbl">Gastos</div></div>
    <div class="stat-card"><div class="stat-val mono" style="color:var(--danger)">${fmt(totalLosses)}</div><div class="stat-lbl">Pérdidas de productos</div></div>
    <div class="stat-card" style="grid-column:1/3;border-color:${profit>=0?'#B9DEC1':'#E9BBB6'}"><div class="stat-val mono" style="color:${profit>=0?'var(--ok)':'var(--danger)'}">${fmt(profit)}</div><div class="stat-lbl">${profit>=0?'Utilidad neta':'Pérdida'}</div></div>
  </div>
  <div class="section-title">Gastos registrados</div>`;

  if(!DB.expenses.length){
    html += `<div class="empty"><div class="eic">💸</div><div class="et">Sin gastos registrados</div><div class="ed">Toca + para agregar uno.</div></div>`;
  } else {
    html += `<div class="card">`;
    DB.expenses.slice().reverse().forEach(e=>{
      html += `<div class="list-item">
        <div class="thumb">💸</div>
        <div class="li-body"><div class="li-title">${esc(e.concept)}</div><div class="li-sub">${e.date}${e.category?' · '+esc(e.category):''}</div></div>
        <div class="li-right"><div class="li-price mono" style="color:var(--danger)">-${fmt(e.amount)}</div></div>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}
function periodRange(period){
  const now = new Date();
  let from = new Date(0);
  if(period==='hoy'){ from = new Date(now.toDateString()); }
  else if(period==='semana'){ from = new Date(now); from.setDate(now.getDate()-7); }
  else if(period==='mes'){ from = new Date(now); from.setMonth(now.getMonth()-1); }
  return {from};
}
function openExpenseForm(){
  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">Nuevo gasto</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="field"><label>Concepto</label><input type="text" id="efConcept" placeholder="Ej. Renta, luz, transporte"></div>
    <div class="field-row">
      <div class="field"><label>Monto</label><input type="number" step="0.01" id="efAmount"></div>
      <div class="field"><label>Fecha</label><input type="date" id="efDate" value="${todayISO()}"></div>
