<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AlmacénPro</title>
<meta name="theme-color" content="#173F38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AlmacénPro">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F5F2EA;
  --surface:#FFFFFF;
  --surface-2:#FBF9F4;
  --ink:#1E2420;
  --ink-soft:#5B655F;
  --primary:#173F38;
  --primary-2:#2A6357;
  --accent:#DE9A3C;
  --accent-ink:#3A2A0D;
  --danger:#B23A3A;
  --ok:#3E7A4D;
  --border:#E4DFD1;
  --radius:16px;
  --font-scale:1;
  --shadow:0 1px 2px rgba(23,63,56,.04), 0 1px 12px rgba(23,63,56,.05);
}
*{box-sizing:border-box;}
html{-webkit-tap-highlight-color:transparent;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:calc(15px * var(--font-scale));
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:1em;}
h1,h2,h3,h4{margin:0;font-family:inherit;letter-spacing:-.01em;}
p{margin:0;}
img{max-width:100%;display:block;}

/* ---------- SCREENS ---------- */
.screen{display:none;min-height:100vh;}
.screen.active{display:block;}

/* Login */
#screen-login{
  background:var(--primary);
  min-height:100vh;
  align-items:center;
  justify-content:center;
  padding:24px;
  color:#fff;
}
#screen-login.active{display:flex;}
.login-card{width:100%;max-width:360px;text-align:center;}
.login-mark{
  width:56px;height:56px;border-radius:16px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
  font-size:calc(26px * var(--font-scale));font-weight:800;color:var(--accent-ink);
}
.login-title{font-size:calc(23px * var(--font-scale));font-weight:700;margin-bottom:6px;letter-spacing:-.01em;}
.login-sub{opacity:.6;font-size:calc(13.5px * var(--font-scale));margin-bottom:38px;font-weight:500;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.role-btn{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.14);
  border-radius:var(--radius);
  padding:26px 10px;
  color:#fff;
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:9px;
  transition:.15s;
}
.role-btn:active{transform:scale(.97);background:rgba(255,255,255,.1);}
.role-icon{font-size:calc(24px * var(--font-scale));opacity:.9;}
.role-label{font-weight:600;font-size:calc(14px * var(--font-scale));}
.role-desc{font-size:calc(11px * var(--font-scale));opacity:.55;}
.login-footer{margin-top:32px;font-size:calc(10.5px * var(--font-scale));opacity:.4;}

/* App shell */
#screen-main{flex-direction:column;min-height:100vh;}
#screen-main.active{display:flex;}
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--primary);
  color:#fff;
  padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;
}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(15px * var(--font-scale));}
.topbar-title{font-size:calc(15px * var(--font-scale));font-weight:700;}
.topbar-role{font-size:calc(10.5px * var(--font-scale));opacity:.75;text-transform:uppercase;letter-spacing:.06em;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.icon-btn{
  background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:calc(16px * var(--font-scale));cursor:pointer;
}
.icon-btn:active{background:rgba(255,255,255,.24);}
.icon-btn:disabled{opacity:.3;cursor:default;}
.icon-btn:disabled:active{background:rgba(255,255,255,.12);}
.icon-btn.spin{animation:spin-anim 0.9s linear infinite;}
@keyframes spin-anim{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.topbar-right{display:flex;gap:6px;align-items:center;}

#view-container{flex:1;padding:14px 14px 90px;max-width:640px;margin:0 auto;width:100%;}

.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -2px 12px rgba(0,0,0,.06);
  transition:transform .18s ease-out;
}
.bottomnav.hidden-kb{ transform:translateY(100%); }
.nav-btn{
  flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;color:var(--ink-soft);cursor:pointer;border-radius:10px;
}
.nav-btn .ic{font-size:calc(19px * var(--font-scale));}
.nav-btn .lb{font-size:calc(9.5px * var(--font-scale));font-weight:600;}
.nav-btn.active{color:var(--primary);}
.nav-btn.active .ic{transform:translateY(-1px);}

/* Cards / generic */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px;margin-bottom:12px;box-shadow:var(--shadow);}
.section-title{font-size:calc(12px * var(--font-scale));font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:20px 2px 9px;}
.section-title:first-child{margin-top:0;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stack{display:flex;flex-direction:column;gap:10px;}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);padding:4px 10px;border-radius:999px;font-size:calc(11.5px * var(--font-scale));font-weight:600;color:var(--ink-soft);}
.chip.warn{background:#FBEBD8;border-color:#F0CE9C;color:#8A5A17;}
.chip.danger{background:#F8E3E1;border-color:#E9BBB6;color:#8A2E2E;}
.chip.ok{background:#E3F1E6;border-color:#B9DEC1;color:#2C5C38;}
.badge-num{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:calc(11px * var(--font-scale));padding:2px 7px;border-radius:999px;}

.btn{
  border:none;border-radius:11px;padding:12px 16px;font-weight:700;font-size:calc(14px * var(--font-scale));cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-2);}
.btn-accent{background:var(--accent);color:var(--accent-ink);}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--ink);}
.btn-danger{background:#F8E3E1;color:var(--danger);}
.btn-ghost{background:var(--surface-2);color:var(--ink);}
.btn-sm{padding:8px 12px;font-size:calc(12.5px * var(--font-scale));border-radius:9px;}
.btn-block{width:100%;}
.fab{
  position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));
  width:54px;height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);
  border:none;font-size:calc(26px * var(--font-scale));box-shadow:0 8px 20px rgba(222,154,60,.45);cursor:pointer;z-index:15;
  display:flex;align-items:center;justify-content:center;
}

input[type=text],input[type=number],input[type=date],input[type=search],input[type=password],select,textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-2);outline-offset:1px;}
label{font-size:calc(12px * var(--font-scale));font-weight:700;color:var(--ink-soft);margin-bottom:5px;display:block;}
.field{margin-bottom:12px;min-width:0;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0;}
.field-row > .field{min-width:0;}
.field input, .field select, .field-row input, .field-row select{width:100%;min-width:0;box-sizing:border-box;}
.hscroll{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.hscroll::-webkit-scrollbar{height:4px;}

.searchbar{position:relative;margin-bottom:14px;}
.searchbar input{padding-left:36px;}
.searchbar .sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;}

.empty{
  text-align:center;padding:40px 16px;color:var(--ink-soft);
}
.empty .eic{font-size:calc(34px * var(--font-scale));margin-bottom:8px;}
.empty .et{font-weight:700;color:var(--ink);margin-bottom:4px;}
.empty .ed{font-size:calc(12.5px * var(--font-scale));}

/* Modal / sheet */
.overlay{position:fixed;inset:0;background:rgba(15,25,20,.5);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.overlay.active{display:flex;}
.sheet{
  background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;
  max-height:92vh;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));
  animation:slideup .22s ease-out;
}
@keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:38px;height:4px;background:var(--border);border-radius:99px;margin:2px auto 14px;}
.sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sheet-title{font-size:calc(17px * var(--font-scale));font-weight:800;}
.sheet-close{background:var(--surface-2);border:none;width:30px;height:30px;border-radius:9px;font-size:calc(15px * var(--font-scale));cursor:pointer;color:var(--ink-soft);}

.picker-overlay{position:fixed;inset:0;background:rgba(15,25,20,.6);z-index:60;display:none;align-items:flex-end;justify-content:center;}
.picker-overlay.active{display:flex;}
.picker-sheet{
  background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;
  height:90vh;max-height:90vh;display:flex;flex-direction:column;
  padding:16px 16px calc(12px + env(safe-area-inset-bottom,0px));
  animation:slideup .22s ease-out;
  /* Antes, si el contenido de una ventana (ej. "Confirmar pedido", con varios productos y
     botones de venta/depósito) no envolvía su parte scrolleable en .picker-results, no había
     NINGUNA forma de desplazarse — el contenido que no cabía en el alto fijo simplemente se
     cortaba, dejando botones inalcanzables en pantallas chicas o con varios productos. Ahora
     el contenedor entero siempre puede hacer scroll como respaldo, se acuerde o no el código
     de cada pantalla de usar esa clase. */
  overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.picker-results{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.picker-group-title{font-size:calc(11.5px * var(--font-scale));font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;margin:14px 0 4px;}
.picker-group-title:first-child{margin-top:0;}

.toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:calc(13px * var(--font-scale));font-weight:600;
  z-index:80;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.list-item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.thumb{width:46px;height:46px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:calc(18px * var(--font-scale));color:var(--ink-soft);overflow:hidden;flex-shrink:0;border:1px solid var(--border);}
.thumb img{width:100%;height:100%;object-fit:cover;}
.li-body{flex:1;min-width:0;}
.li-title{font-weight:700;font-size:calc(13.8px * var(--font-scale));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-sub{font-size:calc(11.5px * var(--font-scale));color:var(--ink-soft);margin-top:2px;}
.li-right{text-align:right;flex-shrink:0;}
.li-price{font-weight:800;font-size:calc(14px * var(--font-scale));}
.li-stock{font-size:calc(10.5px * var(--font-scale));color:var(--ink-soft);}

.tabbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.tabbar::-webkit-scrollbar{display:none;}
.tab-pill{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:calc(12.5px * var(--font-scale));font-weight:700;color:var(--ink-soft);cursor:pointer;}
.tab-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
.stat-val{font-size:calc(20px * var(--font-scale));font-weight:800;}
.stat-lbl{font-size:calc(11px * var(--font-scale));color:var(--ink-soft);font-weight:600;margin-top:2px;}

.swatch-row{display:flex;gap:10px;flex-wrap:wrap;}
.swatch{width:38px;height:38px;border-radius:11px;cursor:pointer;border:2px solid transparent;}
.swatch.sel{border-color:var(--ink);}

.denom-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
.denom-row:last-child{border-bottom:none;}
.denom-label{font-weight:700;font-size:calc(14px * var(--font-scale));}
.denom-input{width:78px;text-align:center;}
.denom-sub{font-size:calc(11px * var(--font-scale));color:var(--ink-soft);margin-top:1px;}

.cart-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.cart-line-full{padding:10px 0;border-bottom:1px solid var(--border);}
.cart-line-full:last-child{border-bottom:none;}
.cart-qty-input{width:56px;text-align:center;border:1px solid var(--border);border-radius:8px;padding:6px 2px;font-weight:700;}
.qty-ctl{display:flex;align-items:center;gap:8px;}
.qty-btn{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface-2);font-weight:800;cursor:pointer;}

.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:calc(12.5px * var(--font-scale));font-weight:600;cursor:pointer;position:relative;color:var(--ink-soft);}
.cal-cell.inmonth{color:var(--ink);}
.cal-cell.today{border:1.5px solid var(--primary);}
.cal-cell.sel{background:var(--primary);color:#fff;}
.cal-dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent);}
.cal-dow{text-align:center;font-size:calc(10px * var(--font-scale));font-weight:700;color:var(--ink-soft);padding-bottom:4px;}

.wa-preview{background:#E9FBE0;border:1px solid #BFE9AC;border-radius:12px;padding:12px;font-size:calc(12.5px * var(--font-scale));white-space:pre-wrap;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;line-height:1.5;color:#264A1B;}

hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
.muted{color:var(--ink-soft);}
.small{font-size:calc(11.5px * var(--font-scale));}
.text-right{text-align:right;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.gap-2{display:flex;gap:8px;}
.mt-2{margin-top:8px;}
.mt-3{margin-top:14px;}
.w-full{width:100%;}
.hidden{display:none !important;}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="screen-login" class="screen active">
  <div class="login-card">
    <div class="login-mark">A</div>
    <div class="login-title" id="loginBizName">AlmacénPro</div>
    <div class="login-sub" id="authModeLabel">Inicia sesión para continuar</div>

    <div class="field" style="text-align:left"><label>Correo</label><input type="email" id="authEmail" placeholder="tucorreo@ejemplo.com" autocomplete="email"></div>
    <div class="field" style="text-align:left" id="authNameField"><label>Tu nombre</label><input type="text" id="authName" placeholder="Como quieres que te vean"></div>
    <div class="field" style="text-align:left"><label>Contraseña</label><input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password"></div>

    <div class="small muted" id="authError" style="color:var(--danger);margin-bottom:8px;min-height:16px"></div>

    <button class="btn btn-primary btn-block" id="authSubmitBtn" onclick="authSubmit()">Entrar</button>
    <div class="small" style="margin-top:12px">
      <a href="#" id="authToggleLink" onclick="toggleAuthMode();return false;">¿Primera vez? Crear cuenta</a>
    </div>

    <div class="login-footer">AlmacénPro · sincronizado en la nube</div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="screen-main" class="screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-mark">A</div>
      <div>
        <div class="topbar-title" id="topTitle">Inicio</div>
        <div class="topbar-role" id="topRole">Administrador</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn hidden" id="btnCloudSync" onclick="manualSyncNow()" title="Sincronizar con la nube">☁️</button>
      <button class="icon-btn" id="btnUndo" onclick="doUndo()" title="Deshacer" disabled>↶</button>
      <button class="icon-btn" id="btnRedo" onclick="doRedo()" title="Rehacer" disabled>↷</button>
      <button class="icon-btn" onclick="app.logout()" title="Cambiar modo">⇄</button>
    </div>
  </div>

  <main id="view-container"></main>

  <nav class="bottomnav" id="bottomnav"></nav>
  <button class="fab hidden" id="fabBtn"></button>
</div>

<!-- ===================== MODAL / SHEET ===================== -->
<div class="overlay" id="overlay" onclick="if(event.target===this)ui.closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<!-- ===================== PICKER (búsqueda de producto, apilado sobre una hoja abierta) ===================== -->
<div class="picker-overlay" id="pickerOverlay" onclick="if(event.target===this)ui.closePicker()">
  <div class="picker-sheet" id="pickerSheetEl"></div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="fileInputHidden" accept="image/*" style="display:none">
<input type="file" id="restoreInputHidden" accept="application/json" style="display:none">
<input type="file" id="syncInputHidden" accept="application/json" style="display:none">

<script>
/* =========================================================
   ALMACÉNPRO — App de gestión de inventario y ventas
   Todo se guarda en localStorage del navegador/dispositivo.
   ========================================================= */

const STORE_KEY = 'almacenpro_db_v1';

// Clave de API de elTOQUE FIJADA en el código. Antes vivía solo en DB.settings.eltoqueApiKey
// (editable en Ajustes y sincronizada a app_settings.eltoque_api_key en la nube): al
// "Restablecer aplicación", DB volvía a defaultDB() SIN esta clave, y esa versión vacía se
// subía a la nube, borrándola también ahí. Ahora defaultDB() ya nace con esta clave puesta,
// así que restablecer la aplicación nunca más la borra. Coincide con el mismo respaldo que
// ya tiene la función de servidor "update-usd-rate" en Supabase, así que aunque algo fallara
// en el teléfono, la actualización de la tasa del dólar sigue funcionando de todos modos.
const ELTOQUE_API_KEY_DEFAULT = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJmcmVzaCI6ZmFsc2UsImlhdCI6MTc4NzA4OTkwNCwianRpIjoiNjdjZmFlYzUtNGY2MC00MjY5LThmOWUtZWE4NTZlYzA1ODhjIiwidHlwZSI6ImFjY2VzcyIsInN1YiI6IjZhN2ZiZDIzYzU5NGZhNTY0OGY0ZGFlYyIsIm5iZiI6MTc4NzA4OTkwNCwiY3NyZiI6IjQ4Y2ViNmUyLTE2YmItNGM3YS1hOGZhLTFjOTMxMTRhMWExYSJ9.tvm6nT7FNcq2iVazwWLXFrvl_75ipXXpU_jpe613pjg';
function getEltoqueKey(){ return (DB.settings.eltoqueApiKey||'').trim() || ELTOQUE_API_KEY_DEFAULT; }
const THEMES = {
  verde:    {label:'Verde',    primary:'#173F38', primary2:'#2A6357', accent:'#DE9A3C', accentInk:'#3A2A0D'},
  azul:     {label:'Azul',     primary:'#173A56', primary2:'#2A5C82', accent:'#3CA7DE', accentInk:'#072436'},

  });

function todayISO(){
  // ANTES: usaba d.toISOString(), que convierte a UTC. Cuba está en UTC-4, así que desde
  // aprox. las 8pm hora local, toISOString() ya cae en el día siguiente en UTC — por eso
  // cualquier cosa que dependiera de "hoy" (recordatorios, fechas por defecto de compras,
  // ventas, caja, calendario — 18 lugares en total) se adelantaba un día completo por las
  // noches. Corregido: se arma la fecha con los componentes LOCALES del dispositivo.
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

/* ---------------- DESHACER / REHACER (por dispositivo, solo de esta sesión) ---------------- */
let _lastSnapshot = JSON.stringify(DB);
let _undoStack = [], _redoStack = [];
const UNDO_LIMIT = 20;
function pushUndoCheckpoint(){
  const current = JSON.stringify(DB);
  if(current === _lastSnapshot) return;
  _undoStack.push(_lastSnapshot);
  if(_undoStack.length > UNDO_LIMIT) _undoStack.shift();
  _redoStack = [];
  _lastSnapshot = current;
  updateUndoRedoButtons();
}
function resetUndoHistory(){
  _undoStack = []; _redoStack = [];
  _lastSnapshot = JSON.stringify(DB);
  updateUndoRedoButtons();
}
function updateUndoRedoButtons(){
  const u = document.getElementById('btnUndo'), r = document.getElementById('btnRedo');
  if(u) u.disabled = _undoStack.length===0;
  if(r) r.disabled = _redoStack.length===0;
}
function doUndo(){
  if(!_undoStack.length) return;
  const current = JSON.stringify(DB);
  const prev = _undoStack.pop();
  _redoStack.push(current);
  if(_redoStack.length > UNDO_LIMIT) _redoStack.shift();
  DB = JSON.parse(prev);
  _lastSnapshot = prev;
  recomputeStock();
  save();
  updateUndoRedoButtons();
  ui.closeSheet(); ui.closePicker();
  renderView();
  toast('Acción deshecha');
}
function doRedo(){
  if(!_redoStack.length) return;
  const current = JSON.stringify(DB);
  const next = _redoStack.pop();
  _undoStack.push(current);
  if(_undoStack.length > UNDO_LIMIT) _undoStack.shift();
  DB = JSON.parse(next);
  _lastSnapshot = next;
  recomputeStock();
  save();
  updateUndoRedoButtons();
  ui.closeSheet(); ui.closePicker();
  renderView();
  toast('Acción rehecha');
}

/* ---------------- STOCK BASADO EN HISTORIAL (evita conflictos al sincronizar) ---------------- */
function deviceShort(){ return (DB.deviceId||'XXXX').slice(-4).toUpperCase(); }
function recomputeStock(){
  const map = {};
  DB.products.forEach(p=> map[p.id]=0);
  DB.purchases.forEach(pu=> pu.items.forEach(it=>{ if(map[it.productId]!=null) map[it.productId]+=it.qty; }));
  DB.sales.forEach(s=> s.items.forEach(it=>{ if(map[it.productId]!=null) map[it.productId]-=it.qty; }));
  // Los depósitos normales SÍ salen del almacén propio. Los ajustes de "inventario inicial/
  // corrección" de un cliente (isInitialBalance) son solo contables para ese cliente — nunca
  // tocan el stock del negocio, porque el producto nunca salió físicamente en ese momento.
  (DB.consignments||[]).forEach(c=>{ if(c.isInitialBalance) return; c.items.forEach(it=>{ if(map[it.productId]!=null) map[it.productId]-=it.qty; }); });
  (DB.clientReturns||[]).forEach(r=> r.items.forEach(it=>{ if(map[it.productId]!=null) map[it.productId]+=it.qty; }));
  (DB.stockAdjustments||[]).forEach(a=>{ if(map[a.productId]!=null) map[a.productId]+=a.delta; });
  DB.products.forEach(p=> p.stock = map[p.id]||0);
}

/* Mantiene la hoja (sheet) visible por encima del teclado en móviles,
   ajustando su altura al viewport visual real en vez del 100vh fijo. */
let _fitViewportRaf = null;
function fitOverlayToViewport(){
  if(_fitViewportRaf) return; // ya hay uno pendiente, evita recalcular decenas de veces por segundo
  _fitViewportRaf = requestAnimationFrame(()=>{
    _fitViewportRaf = null;
    const overlay = document.getElementById('overlay');
    const sheet = document.getElementById('sheet');
    const pickerOverlay = document.getElementById('pickerOverlay');
    const pickerSheet = document.getElementById('pickerSheetEl');
    const bottomnav = document.getElementById('bottomnav');
    if(window.visualViewport){
      const vv = window.visualViewport;
      if(overlay && overlay.classList.contains('active')){ overlay.style.height = vv.height + 'px'; overlay.style.top = vv.offsetTop + 'px'; }
      if(sheet) sheet.style.maxHeight = (vv.height*0.94) + 'px';
      if(pickerOverlay && pickerOverlay.classList.contains('active')){ pickerOverlay.style.height = vv.height + 'px'; pickerOverlay.style.top = vv.offsetTop + 'px'; }
      if(pickerSheet) pickerSheet.style.height = pickerSheet.style.maxHeight = (vv.height*0.94) + 'px';
      // El teclado ocupa espacio visible cuando el viewport visual se achica bastante
      // respecto al alto real de la pantalla: en ese caso escondemos la barra de abajo
      // para que no reste espacio útil mientras se escribe.
      if(bottomnav){
        const keyboardOpen = vv.height < window.innerHeight * 0.75;
        bottomnav.classList.toggle('hidden-kb', keyboardOpen);
      }
    }
  });
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', fitOverlayToViewport);
}

/* Enter/Ir en el teclado guarda el formulario (toca el botón principal de la hoja),
   en vez de solo bajar de línea. También evita que el foco quede oculto tras el teclado. */
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter') return;
  const t = e.target;
  if(!t || t.tagName!=='INPUT') return;
  if(!t.closest('#sheet')) return;
  e.preventDefault();
  const sheet = document.getElementById('sheet');
  const mainBtn = sheet.querySelector('.btn-primary') || sheet.querySelector('.btn-accent');
  if(mainBtn) mainBtn.click();
});

/* Al enfocar cualquier campo de la app (dentro o fuera de una hoja), lo desplaza
   al centro de la pantalla para que no quede tapado por el teclado. */
document.addEventListener('focusin', function(e){
  const t = e.target;
  if(!t || !(t.tagName==='INPUT' || t.tagName==='SELECT' || t.tagName==='TEXTAREA')) return;
  const inSheet = t.closest('#sheet') || t.closest('#pickerSheetEl');
  setTimeout(()=>{ t.scrollIntoView({block:'center', behavior:'smooth'}); if(inSheet) fitOverlayToViewport(); }, 250);
  /* Si es un campo numérico que arranca en 0, lo deja vacío para escribir directo */
  if(t.tagName==='INPUT' && t.type==='number' && t.value==='0'){
    t.value = '';
  }
});

/* En el contador de efectivo: el botón "Siguiente" del teclado salta a la
   próxima denominación en vez de intentar enviar un formulario. En la última,
   "Listo" simplemente cierra el teclado. */
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter') return;
  const t = e.target;
  if(!t || !t.classList || !t.classList.contains('denom-input')) return;
  e.preventDefault();
  const inputs = Array.from(document.querySelectorAll('.denom-input'));
  const idx = inputs.indexOf(t);
  if(idx>-1 && idx<inputs.length-1){
    inputs[idx+1].focus();
  } else {
    t.blur();
  }
});

/* ---------------- SUPABASE: sincronización de datos ---------------- */
// Tablas "mutables": se actualizan y se borran registros -> upsert + borrado de lo que ya no está.

let _syncBusy = false, _syncPending = false, _syncBooted = false, _lastPushAt = 0;
let _warnedOrphanCats = false; // evita repetir el aviso de "categoría inválida" en cada guardado

function markSynced(table, id){ (_syncedIds[table] || (_syncedIds[table]=new Set())).add(id); }

async function syncUpsertTable(table, items, mapFn){
  // IMPORTANTE: esta función SOLO sube (upsert). Ya NO borra de la nube por diferencia de
  // arrays. Eso causó una pérdida real de datos (agosto 2026): si una subida fallaba por
  // cualquier motivo (ej. un producto con categoría inválida) y luego se restaba localmente
  // por otra razón, la próxima sincronización interpretaba "ya no está" y lo borraba para
  // todo el equipo. Ahora, el único borrado en la nube es explícito: una acción puntual del
  // usuario sobre UN registro (ver removeReminder) hace su propio delete dirigido, nunca por
  // diferencia de listas completas.
  const set = _syncedIds[table] || (_syncedIds[table]=new Set());
  if(items.length){
    const rows = items.map(mapFn);
    const { error } = await sb.from(table).upsert(rows, {onConflict:'id'});
    if(error){ console.error('Sync '+table, error); return false; }
    items.forEach(it=>set.add(it.id));
  }
  return true;
}
async function syncInsertOnlyTable(table, items, mapFn){
  const set = _syncedIds[table] || (_syncedIds[table]=new Set());
  const newOnes = items.filter(it=>!set.has(it.id));
  if(!newOnes.length) return true;
  const rows = newOnes.map(mapFn);
  // upsert + ignoreDuplicates en vez de insert(): si por cualquier motivo (ej. dos teléfonos
  // sincronizando casi al mismo tiempo, o _syncedIds desactualizado en algún dispositivo) se
  // repite un id que ya existe, esa fila se ignora en silencio en vez de hacer fallar TODO el
  // lote — antes, un solo choque de "llave duplicada" bloqueaba también a las filas nuevas de
  // verdad que iban en el mismo envío.
  const { error } = await sb.from(table).upsert(rows, {onConflict:'id', ignoreDuplicates:true});
  if(error){ console.error('Sync '+table, error); return false; }
  newOnes.forEach(it=>set.add(it.id));
  return true;
}

let _syncMutex = Promise.resolve(); // asegura que nunca se crucen una subida y una bajada de datos
function withSyncLock(fn){
  const run = _syncMutex.then(()=>fn());
  _syncMutex = run.catch(()=>{});
  return run;
}

async function syncPush(){
  if(!app.userId) return;
  if(_syncBusy){ _syncPending = true; return; }
  _syncBusy = true;
  return withSyncLock(async ()=>{
    _lastPushAt = Date.now();
    try{
      // Las categorías se suben primero y SE ESPERA a que terminen antes de subir productos.
      // products.category_id es una llave foránea hacia categories: si se subieran ambas en
      // paralelo (como antes), podía darse una carrera donde el producto llega a la base de
      // datos antes de que su categoría exista todavía, y Postgres rechaza el lote COMPLETO
      // de productos con un error — esto fue la causa real de la pérdida de inventario del
      // 20 de agosto de 2026.
      await syncUpsertTable('categories', DB.categories, c=>({id:c.id, name:c.name, data:c}));

      // Además, se sanea category_id/subcategory_id de cada producto contra las categorías que
      // existen REALMENTE ahora mismo en este dispositivo. Si un producto quedó apuntando a una
      // categoría que ya no existe (por ejemplo, tras restaurar un archivo de respaldo viejo o
      // incompleto), en vez de dejar que ESE producto tumbe la subida de TODOS los productos con
      // un error de la base de datos, se sube igual pero sin esa categoría rota, y se avisa una
      // sola vez para que se corrija a mano.
      const validCatIds = new Set(DB.categories.map(c=>c.id));
      const validSubIds = new Set(DB.categories.flatMap(c=>(c.subs||[]).map(s=>s.id)));
      let orphanCount = 0;
      const productRows = DB.products.map(p=>{
        let catId = p.catId||null, subId = p.subId||null;
        if(catId && !validCatIds.has(catId)){ orphanCount++; catId=null; subId=null; }
        else if(subId && !validSubIds.has(subId)){ subId=null; }
        return {id:p.id, category_id:catId, subcategory_id:subId, name:p.name, cost_price:p.costPrice||0, stock:p.stock||0, min_stock:p.minStock||0, data:p};
      });
      if(orphanCount){
        if(!_warnedOrphanCats){
          _warnedOrphanCats = true;
          toast('⚠️ '+orphanCount+' producto(s) tenían una categoría que ya no existe; se subieron sin categoría. Revísalos en Inventario.');
        }
      } else {
        _warnedOrphanCats = false;
      }

      await Promise.all([
        (async ()=>{
          if(!productRows.length) return true;
          const { error } = await sb.from('products').upsert(productRows, {onConflict:'id'});
          if(error){ console.error('Sync products', error); return false; }
          const set = _syncedIds['products'] || (_syncedIds['products']=new Set());
          DB.products.forEach(p=>set.add(p.id));
          return true;
        })(),
        syncUpsertTable('clients', DB.clients, c=>({id:c.id, name:c.name, phone:c.phone||null, description:c.desc||'', data:c})),
        // Antes NO se mandaba "time" aquí: la hora del recordatorio se quedaba en null en la
        // nube (solo vivía dentro de "data"), así que cualquier revisión hecha desde el
        // servidor (para el aviso con la app cerrada) no sabía la hora real y asumía "fin del
        // día". Corregido: ahora se sube igual que se guarda localmente.
        syncUpsertTable('reminders', DB.reminders, r=>({id:r.id, title:r.title, date:r.date, time:r.time||null, note:null, done:!!r.done, data:r})),
        syncUpsertTable('orders', DB.orders, o=>({id:o.id, client_id:o.clientId||null, status:o.status, created_by:app.userId, updated_at:new Date().toISOString(), data:o})),
        syncInsertOnlyTable('purchases', DB.purchases, pu=>({id:pu.id, date:pu.date, supplier:pu.supplier||null, invoice_no:pu.invoiceNo||null, total:pu.total||0, usd_rate_at_purchase:pu.usdRateAtSale||null, created_by:app.userId, data:pu})),
        syncInsertOnlyTable('sales', DB.sales, s=>({id:s.id, date:s.date, client_id:s.clientId||null, payment:s.payment, total:s.total||0, created_by:app.userId, data:s})),
        syncInsertOnlyTable('client_payments', DB.clientPayments, p=>({id:p.id, client_id:p.clientId, amount:p.amount, note:p.note||null, date:p.date, created_by:app.userId, data:p})),
        syncInsertOnlyTable('client_debt_adjustments', DB.clientDebtAdjustments, a=>({id:a.id, client_id:a.clientId, amount:a.amount, note:a.note||null, date:a.date, created_by:app.userId, data:a})),
        syncInsertOnlyTable('consignments', DB.consignments, c=>({id:c.id, client_id:c.clientId, date:c.date, created_by:app.userId, data:c})),
        syncInsertOnlyTable('client_returns', DB.clientReturns, r=>({id:r.id, client_id:r.clientId, date:r.date, created_by:app.userId, data:r})),
        syncInsertOnlyTable('client_sales', DB.clientSales, s=>({id:s.id, client_id:s.clientId, date:s.date, total:s.total||0, created_by:app.userId, data:s})),
        syncInsertOnlyTable('expenses', DB.expenses, e=>({id:e.id, date:e.date, concept:e.concept, amount:e.amount, type:e.type||null, category:e.category||null, created_by:app.userId, data:e})),
        syncInsertOnlyTable('losses', DB.losses, l=>({id:l.id, product_id:l.productId||null, qty:l.qty, reason:l.reason||null, date:l.date, cost_impact:l.costImpact||0, created_by:app.userId, data:l})),
        syncInsertOnlyTable('stock_adjustments', DB.stockAdjustments, a=>({id:a.id, product_id:a.productId||null, delta:a.delta, reason:a.reason||null, ts:a.ts, created_by:app.userId, data:a})),
        syncInsertOnlyTable('cash_counts', DB.cashCounts, c=>({id:c.id, date:c.date, denoms:c.denoms||{}, total:c.total||0, created_by:app.userId, data:c})),
        syncInsertOnlyTable('calendar_events', DB.events, e=>({id:e.id, date:e.date, title:e.title, created_by:app.userId, data:e})),
        syncInsertOnlyTable('calendar_notes', DB.notes, n=>({id:n.id, date:n.date, text:n.text, created_by:app.userId, data:n})),
        (async ()=>{
          // precios congelados por cliente (dict "clienteId::productoId" -> precio)
          const cppRows = Object.keys(DB.clientProductPrices||{}).map(k=>{
            const [clientId, productId] = k.split('::');
            return { key:k, client_id:clientId, product_id:productId, price:DB.clientProductPrices[k] };
          });
          // Igual que las demás tablas: solo se sube (upsert). Ya no se borra por diferencia
          // de claves — no hay hoy ninguna acción en la app para "quitar" un precio congelado
          // de un cliente, así que ese borrado automático nunca tuvo un caso de uso real y solo
          // representaba el mismo riesgo que causó la pérdida de productos.
          if(cppRows.length){
            const { error } = await sb.from('client_product_prices').upsert(cppRows.map(r=>({client_id:r.client_id, product_id:r.product_id, price:r.price})), {onConflict:'client_id,product_id'});
            if(!error) cppRows.forEach(r=>_syncedCpp.add(r.key));
          }
        })(),
        (async ()=>{
          // configuración del negocio (una sola fila). OJO: la personalización visual (tema, tamaño
          // de letra, notificaciones activadas) NO se manda aquí — esa es cosa de cada dispositivo.
          const s = DB.settings;
          await sb.from('app_settings').upsert({
            id:1, biz_name:DB.meta.bizName||'Mi Negocio', currency_symbol:DB.meta.currency||'$',
            usd_rate:s.usdRate||0, usd_rate_updated:s.usdRateUpdated||'', eltoque_api_key:s.eltoqueApiKey||null,
            low_stock_threshold:s.defaultMinStock||5, transfer_fee_percent:s.transferSurchargePct||0,
            cash_denoms:s.cashDenoms||[], default_min_stock:s.defaultMinStock||5, qty_steps:s.qtySteps||[],
            transfer_surcharge_pct:s.transferSurchargePct||0, vendor_permissions:s.vendorPermissions||{},
            invoice_counter:DB.invoiceCounter||1001, sale_counter:DB.saleCounter||1001, admin_password:s.adminPassword||null,
            updated_at:new Date().toISOString()
          }, {onConflict:'id'});
        })()
      ]);
      _lastPushAt = Date.now(); // se vuelve a marcar al terminar, por si tardó
    } finally {
      _syncBusy = false;
      if(_syncPending){ _syncPending = false; syncPush(); }
      else if(_pendingSwUpdate){ tryApplyPendingUpdate(); }
    }
  });
}

async function syncPullAll(){
  return withSyncLock(_syncPullAllInner);
}
async function manualSyncNow(){
  if(!app.userId){ toast('Inicia sesión para sincronizar con la nube'); return; }
  const btn = document.getElementById('btnCloudSync');
  if(btn){ btn.disabled = true; btn.classList.add('spin'); }
  try{
    // Orden fijo, tal como se pidió: primero sube lo de este teléfono, y solo después baja lo
    // que haga falta de la nube (que ahora se fusiona, nunca reemplaza — ver _syncPullAllInner).
    await syncPush();
    await syncPullAll();
    DB.lastCloudSyncAt = nowStamp();
    saveLocalOnly();
    toast('✅ Sincronizado con la nube');
  }catch(err){
    console.error('Sincronización manual', err);
    toast('No se pudo sincronizar: revisa tu conexión');
  }finally{
    if(btn){ btn.disabled = false; btn.classList.remove('spin'); }
    renderView();
  }
}
async function _syncPullAllInner(){
  const [cats, prods, clis, rems, ords, purs, sals, cpays, cadjs, cons, crets, csals, exps, loss, sadj, ccnt, cevt, cnote, cpp, settingsRes] = await Promise.all([
    sb.from('categories').select('data'),
    sb.from('products').select('data'),
    sb.from('clients').select('data'),
    sb.from('reminders').select('data'),
    sb.from('orders').select('data'),
    sb.from('purchases').select('data'),
    sb.from('sales').select('data'),
    sb.from('client_payments').select('data'),
    sb.from('client_debt_adjustments').select('data'),
    sb.from('consignments').select('data'),
    sb.from('client_returns').select('data'),
    sb.from('client_sales').select('data'),
    sb.from('expenses').select('data'),
    sb.from('losses').select('data'),
    sb.from('stock_adjustments').select('data'),
    sb.from('cash_counts').select('data'),
    sb.from('calendar_events').select('data'),
    sb.from('calendar_notes').select('data'),
    sb.from('client_product_prices').select('client_id, product_id, price'),
    sb.from('app_settings').select('*').eq('id',1).single()
  ]);
  const unwrap = res => (res.data||[]).map(r=>r.data);

  // FUSIÓN, nunca reemplazo. Esto es lo más importante del motor de sincronización: lo que
  // trae la nube se SUMA a lo que ya hay en este teléfono, nunca lo reemplaza en bloque.
  // - Un registro que solo existe localmente (recién creado/editado y que todavía no terminó
  //   de subirse) NUNCA desaparece solo porque llegó una bajada mientras tanto.
  // - Si el mismo id existe en los dos lados, se queda con el más reciente según
  //   updatedAt/createdAt (para lo insertado-solo como ventas, da igual: son inmutables).
  // Antes, esta función hacía "DB.x = lo que llegó de la nube" sin más — así, si la nube
  // estaba vacía o desactualizada por cualquier motivo (ej. una subida que falló), la
  // siguiente bajada (como la que ocurre automáticamente al cambiar entre cuenta de admin y
  // vendedor) borraba de un plumazo todo lo que hubiera en el teléfono. Eso fue lo que pasó
  // el 20 de agosto de 2026.
  const mergeArr = (localArr, remoteArr) => {
    const map = {};
    (localArr||[]).forEach(x=> map[x.id]=x);
    (remoteArr||[]).forEach(x=>{
      const l = map[x.id];
      if(!l){ map[x.id]=x; return; }
      const lt = l.updatedAt||l.createdAt||'';
      const rt = x.updatedAt||x.createdAt||'';
      map[x.id] = (rt >= lt) ? x : l; // en empate o sin fechas, gana lo remoto (ya confirmado por la nube)
    });
    return Object.values(map);
  };

  const remoteCats = unwrap(cats);
  const remoteProds = unwrap(prods);
  const remoteClis = unwrap(clis);
  const remoteRems = unwrap(rems);
  const remoteOrds = unwrap(ords);
  const remotePurs = unwrap(purs);
  const remoteSals = unwrap(sals);
  const remoteCpays = unwrap(cpays);
  const remoteCadjs = unwrap(cadjs);
  const remoteCons = unwrap(cons);
  const remoteCrets = unwrap(crets);
  const remoteCsals = unwrap(csals);
  const remoteExps = unwrap(exps);
  const remoteLoss = unwrap(loss);
  const remoteSadj = unwrap(sadj);
  const remoteCcnt = unwrap(ccnt);
  const remoteCevt = unwrap(cevt);
  const remoteCnote = unwrap(cnote);

  DB.categories = remoteCats.length || DB.categories.length ? mergeArr(DB.categories, remoteCats) : defaultDB().categories;
  DB.products = mergeArr(DB.products, remoteProds);
  DB.clients = mergeArr(DB.clients, remoteClis);
  DB.reminders = mergeArr(DB.reminders, remoteRems);
  DB.orders = mergeArr(DB.orders, remoteOrds);
  DB.purchases = mergeArr(DB.purchases, remotePurs);
  DB.sales = mergeArr(DB.sales, remoteSals);
  DB.clientPayments = mergeArr(DB.clientPayments, remoteCpays);
  DB.clientDebtAdjustments = mergeArr(DB.clientDebtAdjustments, remoteCadjs);
  DB.consignments = mergeArr(DB.consignments, remoteCons);
  DB.clientReturns = mergeArr(DB.clientReturns, remoteCrets);
  DB.clientSales = mergeArr(DB.clientSales, remoteCsals);
  DB.expenses = mergeArr(DB.expenses, remoteExps);
  DB.losses = mergeArr(DB.losses, remoteLoss);
  DB.stockAdjustments = mergeArr(DB.stockAdjustments, remoteSadj);
  DB.cashCounts = mergeArr(DB.cashCounts, remoteCcnt);
  DB.events = mergeArr(DB.events, remoteCevt);
  DB.notes = mergeArr(DB.notes, remoteCnote);
  // Precios congelados por cliente: se completa con lo que falte de la nube, sin pisar un
  // precio que ya se haya fijado localmente y todavía no se haya subido.
  DB.clientProductPrices = DB.clientProductPrices || {};
  (cpp.data||[]).forEach(r=>{
    const k = r.client_id+'::'+r.product_id;
    if(!(k in DB.clientProductPrices)) DB.clientProductPrices[k] = r.price;
  });

  // BUG CRÍTICO CORREGIDO (22 de agosto de 2026): antes, esto marcaba como "ya sincronizado"
  // todo lo que quedaba en el DB local DESPUÉS de fusionar (DB.products, DB.sales, etc.) — es
  // decir, también marcaba como sincronizado algo que acababas de crear en ESTE teléfono y que
  // todavía no había llegado a la nube. Efecto real: ese registro nunca se subía (porque
  // syncUpsertTable/syncInsertOnlyTable creían que ya estaba arriba) y se quedaba atrapado para
  // siempre en un solo teléfono — exactamente el síntoma de "en un teléfono sale y en el otro
  // no". Ahora se marca como sincronizado SOLO lo que la nube confirmó tener de verdad
  // (remoteProds, remoteSals, etc.), nunca la mezcla local.
  const setIds = (table, arr) => { _syncedIds[table] = new Set(arr.map(it=>it.id)); };
  setIds('categories', remoteCats); setIds('products', remoteProds); setIds('clients', remoteClis);
  setIds('reminders', remoteRems); setIds('purchases', remotePurs); setIds('sales', remoteSals);
  setIds('orders', remoteOrds);
  setIds('client_payments', remoteCpays); setIds('client_debt_adjustments', remoteCadjs);
  setIds('consignments', remoteCons); setIds('client_returns', remoteCrets);
  setIds('client_sales', remoteCsals); setIds('expenses', remoteExps); setIds('losses', remoteLoss);
  setIds('stock_adjustments', remoteSadj); setIds('cash_counts', remoteCcnt);
  setIds('calendar_events', remoteCevt); setIds('calendar_notes', remoteCnote);
  _syncedCpp = new Set((cpp.data||[]).map(r=>r.client_id+'::'+r.product_id));

  const st = settingsRes.data;
  if(st){
    DB.meta.bizName = st.biz_name; DB.meta.currency = st.currency_symbol;
    // fontScale, theme, themeMode, accentOverride y notifEnabled son personalización de ESTE
    // dispositivo — nunca se traen de la nube, para que cada teléfono conserve la suya.
    Object.assign(DB.settings, {
      usdRate:st.usd_rate, usdRateUpdated:st.usd_rate_updated, eltoqueApiKey:(st.eltoque_api_key||'').trim() || ELTOQUE_API_KEY_DEFAULT,
      defaultMinStock:st.default_min_stock, transferSurchargePct:st.transfer_surcharge_pct,
      cashDenoms:st.cash_denoms, qtySteps:st.qty_steps,
      vendorPermissions:st.vendor_permissions, adminPassword:st.admin_password||''
    });
    DB.invoiceCounter = st.invoice_counter; DB.saleCounter = st.sale_counter;
  }
  recomputeStock();
  saveLocalOnly(); // refresca la copia local (localStorage) como respaldo sin conexión; nunca vuelve a empujar a Supabase (evitaría un bucle infinito con Realtime)
  resetUndoHistory(); // los datos de la nube son el nuevo punto de partida; deshacer no debe cruzar esa frontera
}

let _realtimeChannel = null;
function startRealtimeSync(){
  if(_realtimeChannel) return;
  const tables = ['categories','products','clients','reminders','orders','purchases','sales','client_payments',
    'client_debt_adjustments','consignments','client_returns','client_sales','expenses','losses',
    'stock_adjustments','cash_counts','calendar_events','calendar_notes','client_product_prices','app_settings'];
  let ch = sb.channel('almacenpro-sync');
  tables.forEach(t=>{ ch = ch.on('postgres_changes', {event:'*', schema:'public', table:t}, handleRemoteChange); });
  // Antes, si el canal en tiempo real se caía (cambio de red, VPN encendida/apagada, wifi que
  // pasa a datos móviles, la app en segundo plano mucho rato), nada volvía a intentar
  // reconectar por sí solo ni a traer lo que se hubiera perdido mientras tanto. Ahora, si el
  // estado del canal indica error/cierre/tiempo agotado, se reconecta solo y de paso se hace
  // un syncPullAll() para recuperar cualquier cambio que haya llegado durante la caída.
  ch.subscribe((status)=>{
    if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
      _realtimeChannel = null;
      if(app.userId){
        setTimeout(()=>{ startRealtimeSync(); syncPullAll().catch(()=>{}); }, 2000);
      }
    }
  });
  _realtimeChannel = ch;
}
function stopRealtimeSync(){
  if(_realtimeChannel){ sb.removeChannel(_realtimeChannel); _realtimeChannel = null; }
}
// Misma idea, pero para dos casos muy comunes en un teléfono que el canal en tiempo real por sí
// solo no siempre detecta a tiempo: (1) el sistema operativo cortó la red un momento (avión,
// túnel, encender/apagar VPN) y el navegador avisa cuando vuelve; (2) la app estuvo en segundo
// plano (pantalla apagada, cambiaste a otra app) y el teléfono pudo haber pausado la conexión.
// En ambos casos, se reconecta el canal y se sincroniza de una vez (sube lo pendiente y baja lo
// que haya cambiado en otro dispositivo mientras tanto) en vez de esperar a que algo dispare la
// sincronización por casualidad.
window.addEventListener('online', ()=>{
  if(!app.userId) return;
  toast('Conexión recuperada, sincronizando...');
  stopRealtimeSync();
  syncPush().then(()=>syncPullAll()).then(()=>startRealtimeSync()).catch(()=>{});
});
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && app.userId){
    if(!_realtimeChannel) startRealtimeSync();
    syncPush().then(()=>syncPullAll()).catch(()=>{});
  }
});
let _remoteReloadTimer = null;
function handleRemoteChange(payload){
  if(_syncBusy) return; // es muy probablemente nuestro propio cambio reflejándose
  if(Date.now() - _lastPushAt < 3000) return; // eco de algo que acabamos de subir nosotros mismos
  clearTimeout(_remoteReloadTimer);
  _remoteReloadTimer = setTimeout(async ()=>{
    await syncPullAll();
    const active = document.activeElement;
    const isTyping = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA');
    checkDueReminders();
    checkLowStockAlerts();
    if('Notification' in window && Notification.permission==='granted'){
      try{ const n = new Notification('🔄 AlmacénPro', {body:'Otro dispositivo actualizó los datos', tag:'sync-update', icon:'./icon.png', badge:'./icon.png'}); n.onclick=()=>{ window.focus(); n.close(); }; }catch(e){}
      playPingSound();
    }
    if(isTyping){
      // no interrumpe mientras se escribe; la notificación/sonido de arriba ya avisó igual
    } else {
      renderView();
    }
  }, 800);
}

    this.go(role==='admin' ? 'home' : 'sales');
    window.scrollTo(0,0);
  },
  async logout(){
    // ANTES: supabaseSignOut() no se esperaba (sin await) — la pantalla de login aparecía
    // de inmediato mientras el cierre de sesión de la cuenta anterior todavía seguía en
    // curso. Si alguien escribía rápido las credenciales de la otra cuenta (o la red iba
    // lenta), el cierre viejo y el inicio nuevo se cruzaban, y a veces terminaba cargando
    // otra vez la cuenta anterior. Ahora se espera a que termine de verdad antes de mostrar
    // el formulario de login.
    document.getElementById('screen-main').classList.remove('active');
    document.getElementById('screen-login').classList.add('active');
    document.getElementById('loginBizName').textContent = DB.meta.bizName || 'AlmacénPro';
    window.scrollTo(0,0);
    this.role = null;
    this.userId = null;
    this.userName = null;
    await supabaseSignOut();
  },
  go(view){
    this.view = view;
    ui.closeSheet();
    renderView();
    highlightNav();
    window.scrollTo(0,0);
    pushNavState();
  }
};

/* ---------------- Botón de retroceder del teléfono ----------------
   En vez de dejar que el botón "atrás" del teléfono cierre la app de golpe,
   lo usamos para: 1) cerrar lo que esté abierto (buscador, ventanita),
   2) si no hay nada abierto, ir al inicio del rol actual,
   3) si ya estás en el inicio, preguntar si de verdad quiere salir. */
let _allowExit = false;
function pushNavState(){
  try{ history.pushState({t:Date.now()}, ''); }catch(e){}
}
window.addEventListener('popstate', function(){
  const pickerOpen = document.getElementById('pickerOverlay').classList.contains('active');
  const sheetOpen = document.getElementById('overlay').classList.contains('active');
  const roleHome = app.role==='admin' ? 'home' : 'sales';

  if(pickerOpen){
    ui.closePicker();
    pushNavState();
    return;
  }
  if(sheetOpen){
    ui.closeSheet();
    pushNavState();
    return;
  }
  if(app.role && app.view !== roleHome){
    app.go(roleHome);
    return;
  }
  if(_allowExit){
    _allowExit = false;
    return; // dejamos que el navegador cierre de verdad esta vez
  }
  pushNavState(); // "atrapamos" este atrás para poder preguntar primero
  if(confirm('¿Seguro que quieres salir de la aplicación?')){
    _allowExit = true;
    history.back();
  }
});
pushNavState(); // primer escalón, para que el primer atrás no cierre la app de una

function applySettings(){
  const s = DB.settings;
  document.documentElement.style.setProperty('--font-scale', s.fontScale || 1);
  const th = THEMES[s.theme] || THEMES.verde;
  document.documentElement.style.setProperty('--primary', th.primary);
  document.documentElement.style.setProperty('--primary-2', th.primary2);
  const accentColor = s.accentOverride || th.accent;
  const accentInk = s.accentOverride ? (ACCENT_SWATCHES.find(a=>a.hex===s.accentOverride)?.ink || '#1E2420') : th.accentInk;
  document.documentElement.style.setProperty('--accent', accentColor);
  document.documentElement.style.setProperty('--accent-ink', accentInk);
  const mv = MODE_VARS[s.themeMode] || MODE_VARS.light;
  document.documentElement.style.setProperty('--bg', mv.bg);
  document.documentElement.style.setProperty('--surface', mv.surface);
  document.documentElement.style.setProperty('--surface-2', mv.surface2);
  document.documentElement.style.setProperty('--ink', mv.ink);
  document.documentElement.style.setProperty('--ink-soft', mv.inkSoft);
  document.documentElement.style.setProperty('--border', mv.border);

}

   ========================================================= */
function viewHome(){
  const today = todayISO();
  const salesToday = DB.sales.filter(s=>s.date.slice(0,10)===today);
  const totalToday = salesToday.reduce((a,s)=>a+s.total,0);
  const lowStock = activeProducts().filter(p=>p.stock<=p.minStock);
  const lastCash = DB.cashCounts[DB.cashCounts.length-1];

  let html = `<div class="section-title">Resumen de hoy</div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-val mono">${fmt(totalToday)}</div><div class="stat-lbl">Ventas de hoy (${salesToday.length})</div></div>
    <div class="stat-card"><div class="stat-val mono">${lowStock.length}</div><div class="stat-lbl">Productos con stock bajo</div></div>
    <div class="stat-card"><div class="stat-val mono">${activeProducts().length}</div><div class="stat-lbl">Productos registrados</div></div>
    <div class="stat-card"><div class="stat-val mono">${lastCash? fmt(lastCash.total): '—'}</div><div class="stat-lbl">Último conteo de caja</div></div>
  </div>`;

  if(app.role==='admin'){
    html += `<div class="section-title">Accesos rápidos</div>
    <div class="stack">
      <button class="btn btn-primary btn-block" onclick="openPurchaseForm()">🧾 Registrar compra</button>
      <button class="btn btn-accent btn-block" onclick="app.go('sales')">🛒 Nueva venta</button>
      <button class="btn btn-outline btn-block" onclick="app.go('cash')">💵 Contar efectivo</button>
    </div>`;
  }

  const pendingReminders = (DB.reminders||[]).filter(r=>!r.done && isReminderDue(r));
  if(pendingReminders.length){
    html += `<div class="section-title">⏰ Recordatorios pendientes</div><div class="card">`;
    pendingReminders.slice(0,5).forEach(r=>{
      html += `<div class="list-item">
        <div class="thumb">⏰</div>
        <div class="li-body"><div class="li-title">${esc(r.title)}</div><div class="li-sub">${r.date}${r.time?' · '+r.time:''}</div></div>
        <button class="btn btn-ghost btn-sm" onclick="toggleReminder('${r.id}')">Hecho</button>
      </div>`;
    });
    html += `</div>`;
  }

  if(lowStock.length){
    html += `<div class="section-title">⚠️ Alertas de stock bajo</div><div class="card">`;
    lowStock.slice(0,8).forEach(p=>{
      html += `<div class="list-item">
        ${thumbHtml(p)}
        <div class="li-body"><div class="li-title">${esc(p.name)}</div><div class="li-sub">Mínimo: ${p.minStock}</div></div>
        <div class="li-right"><span class="chip danger">${p.stock} en stock</span></div>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}

function thumbHtml(p){
  return p.photo ? `<div class="thumb"><img src="${p.photo}"></div>` : `<div class="thumb">📦</div>`;
}
function allSubcats(){
  const list=[];
  DB.categories.forEach(c=>c.subs.forEach(s=>list.push({catId:c.id,catName:c.name,subId:s.id,subName:s.name})));
  return list;
}
function catName(id){ const c=DB.categories.find(c=>c.id===id); return c?c.name:''; }
function subName(catId,subId){ const c=DB.categories.find(c=>c.id===catId); const s=c&&c.subs.find(s=>s.id===subId); return s?s.name:''; }

function activeProducts(){ return DB.products.filter(p=>!p.deletedAt); }
function isReminderDue(r){
  const [y,m,d] = r.date.split('-').map(Number);
  const [hh,mm] = (r.time||'23:59').split(':').map(Number);
  const dueLocal = new Date(y, m-1, d, hh||0, mm||0, 0);
  return dueLocal <= new Date();
}

function vendorPermToggle(key, label){
  const on = !!(DB.settings.vendorPermissions && DB.settings.vendorPermissions[key]);

function filterProductsByCtx(list, ctx){
  let out = list;
  if(ctx.catId) out = out.filter(p=>p.catId===ctx.catId);
  if(ctx.subId) out = out.filter(p=>p.subId===ctx.subId);
  if(ctx.q){
    const q = ctx.q.toLowerCase();
    out = out.filter(p=>(p.name+' '+(p.desc||'')).toLowerCase().includes(q));
  }
  return out;
}

    });

  return html;

function setFpCostCurrency(cur){
  if(cur==='USD' && !(DB.settings.usdRate>0)){
    toast('Configura primero la tasa del dólar en Caja');
    return;
  }
  const prevCur = window._fpCostCurrency||'CP';
  const input = document.getElementById('fpCost');
  const entered = parseFloat(input.value)||0;
  const cp = prevCur==='USD' ? entered*(DB.settings.usdRate||0) : entered;
  window._fpCostCurrency = cur;
  input.value = cur==='USD' ? round2(cp/(DB.settings.usdRate||1)) : round2(cp);
  const btnCP = document.getElementById('fpCurCP'), btnUSD = document.getElementById('fpCurUSD');
  if(btnCP) btnCP.className = 'btn btn-sm btn-block ' + (cur==='CP'?'btn-primary':'btn-outline');

function addPriceRow(){
  // Antes, un precio nuevo se creaba con etiqueta vacía ('') y, si el usuario no llegaba a
  // escribirle un nombre, saveProduct() lo descartaba EN SILENCIO al guardar (filtraba por
  // label no vacío). Resultado: el producto se quedaba con un solo precio y el selector de
  // precios nunca aparecía a la hora de vender, aunque el usuario "sí" había agregado uno.
  // Ahora cada precio nuevo nace con un nombre por defecto, así nunca se pierde.
  const n = window._editingProduct.prices.length + 1;
  window._editingProduct.prices.push({label:'Precio '+n, price:0});
  renderPriceRows();
}

document.getElementById('fileInputHidden').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const maxDim = 360;
      let w=img.width, h=img.height;
      if(w>h){ if(w>maxDim){h=h*maxDim/w; w=maxDim;} } else { if(h>maxDim){w=w*maxDim/h; h=maxDim;} }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      window._editingProduct.photo = dataUrl;
      const prev = document.getElementById('prodPhotoPreview');
      if(prev) prev.innerHTML = `<img src="${dataUrl}">`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value='';
});

function saveProduct(){
  const name = document.getElementById('fpName').value.trim();
  if(!name) return toast('Escribe el nombre del producto');
  const ep = window._editingProduct;
  const isNew = !ep.id;
  const enteredStock = parseFloat(document.getElementById('fpStock').value)||0;
  const currentStock = isNew ? 0 : (DB.products.find(p=>p.id===ep.id)?.stock || 0);
  const data = {
    id: ep.id || uid(),
    catId: document.getElementById('fpCat').value,
    subId: document.getElementById('fpSub').value,
    name,
    desc: document.getElementById('fpDesc').value.trim(),
    measures: document.getElementById('fpMeasures').value.trim(),
    photo: ep.photo || '',
    costPrice: fpCostInCP(),
    stock: currentStock,
    minStock: parseFloat(document.getElementById('fpMin').value)||0,
    // Ya NO se descartan los precios sin etiqueta (eso era el bug real de "los precios
    // múltiples no funcionan"): si alguien dejó el nombre en blanco, se le pone un nombre
    // por defecto en vez de perder el precio completo.
    prices: ep.prices.map((pr,i)=>({label: (pr.label||'').trim() || ('Precio '+(i+1)), price: pr.price||0})),
    createdAt: ep.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  if(!data.prices.length) data.prices=[{label:'Venta', price:0}];
  const idx = DB.products.findIndex(p=>p.id===data.id);
  if(idx>=0) DB.products[idx]=data; else DB.products.push(data);
  const delta = enteredStock - currentStock;
  if(delta !== 0){
    DB.stockAdjustments.push({id:uid(), productId:data.id, delta, reason: isNew?'Stock inicial':'Ajuste manual', ts:new Date().toISOString()});
  }
  recomputeStock();
  save(); ui.closeSheet();
  const cb = window._productFormOnSaved;
  window._productFormOnSaved = null;
  if(cb){ cb(data.id); }
  else { toast('Producto guardado'); renderView(); }
}
function deleteProduct(id){
  if(!confirm('¿Eliminar este producto? Desaparecerá del inventario (se conserva en el historial).')) return;
  const p = DB.products.find(p=>p.id===id);
  if(p){ p.deletedAt = new Date().toISOString(); p.updatedAt = p.deletedAt; }
  save(); ui.closeSheet(); toast('Producto eliminado'); renderView();
}
/* Botones de salto rápido de cantidad, reutilizables en cualquier campo numérico.
   Ocupan el ancho completo disponible (nunca la mitad de una fila) para que se lean bien. */
function qtyStepsHTML(inputId, afterFn){
  return `<div class="hscroll">` + DB.settings.qtySteps.map(n=>
    `<button class="btn btn-outline btn-sm" style="flex:0 0 auto" onclick="bumpQtyField('${inputId}',${n},${afterFn?`'${afterFn}'`:'null'})">+${n}</button>`
  ).join('') + `</div><div class="hscroll mt-2">` + DB.settings.qtySteps.map(n=>
    `<button class="btn btn-outline btn-sm" style="flex:0 0 auto" onclick="bumpQtyField('${inputId}',-${n},${afterFn?`'${afterFn}'`:'null'})">−${n}</button>`
  ).join('') + `</div>`;
}
function bumpQtyField(inputId, n, afterFn){
  const el = document.getElementById(inputId);
  if(!el) return;
  el.value = Math.max(0, (parseFloat(el.value)||0) + n);
  if(afterFn && typeof window[afterFn]==='function') window[afterFn]();
}
// Control compacto de +/- rápido para UNA fila dentro de una lista (a diferencia de
// qtyStepsHTML, que es para un único campo de un formulario). Se usa en los listados de
// cliente (venta reportada, devolución) y en los productos de un pedido, para no depender
// de escribir el número a mano.
function qtyCtlHTML(inputId, value, afterFn){
  const af = afterFn ? `'${afterFn}'` : 'null';
  return `<div class="qty-ctl">
    <button type="button" class="qty-btn" onclick="bumpQtyField('${inputId}',-1,${af})">−</button>
    <input type="number" class="mono cart-qty-input" id="${inputId}" value="${value}" style="width:56px" ${afterFn?`oninput="${afterFn}()"`:''}>
    <button type="button" class="qty-btn" onclick="bumpQtyField('${inputId}',1,${af})">+</button>
  </div>`;
}

function viewPurchases(){
  if(!DB.purchases.length){
    return `<div class="empty"><div class="eic">🧾</div><div class="et">Sin compras registradas</div><div class="ed">Toca + para registrar una compra a proveedor.</div></div>`;

    <div class="tab-pill ${mode==='calendar'?'active':''}" onclick="app._purchHistMode='calendar';renderView()">📅 Por día</div>

function addPurchaseLine(){
  const p = window._pfSelectedProduct;
  const qty = parseFloat(document.getElementById('pfQty').value)||0;
  const enteredCost = parseFloat(document.getElementById('pfCost').value)||0;
  const currency = window._pfCostCurrency||'CP';
  if(!p || qty<=0) return toast('Busca y selecciona un producto primero');
  if(currency==='USD' && !(DB.settings.usdRate>0)) return toast('Configura la tasa del dólar en Caja primero');
  const cost = currency==='USD' ? round2(enteredCost*DB.settings.usdRate) : enteredCost;
  window._purchaseCart.push({productId:p.id, qty, cost, costCurrency:currency, costForeign: currency==='USD'?enteredCost:null, usdRateUsed: currency==='USD'?DB.settings.usdRate:null});

function savePurchase(){
  if(!window._purchaseCart.length) return toast('Agrega al menos un producto');
  const supplier = document.getElementById('pfSupplier').value.trim();
  const date = document.getElementById('pfDate').value || todayISO();
  const items = window._purchaseCart;
  const total = items.reduce((a,l)=>a+l.qty*l.cost,0);
  const invoiceNo = DB.invoiceCounter+'-'+deviceShort();
  DB.invoiceCounter++;
  const purchase = {id:uid(), date, supplier, items, total, invoiceNo, createdAt:new Date().toISOString(), usdRateAtSale: DB.settings.usdRate||0};
  DB.purchases.push(purchase);
  items.forEach(l=>{
    const p = DB.products.find(p=>p.id===l.productId);
    if(p){ p.costPrice = l.cost; p.updatedAt = new Date().toISOString(); }
  });
  recomputeStock();
  save();
  toast('Compra registrada');
  viewInvoice(purchase.id);
}

function openCorrectPurchaseLine(purchaseId, idx){
  const pu = DB.purchases.find(p=>p.id===purchaseId);
  if(!pu) return;
  const l = pu.items[idx];
  const p = DB.products.find(p=>p.id===l.productId);
  const orderedQty = l.orderedQty!=null ? l.orderedQty : l.qty;
  const prefill = l.corrected ? l.receivedQty : orderedQty;
  ui.openSheet(`
    <div class="sheet-header"><div class="sheet-title">Corregir mercancía recibida</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="small muted" style="margin-bottom:12px">${esc(p?p.name:'Producto')}: se pidieron <b>${orderedQty}</b> unidades en esta compra.</div>
    <div class="field"><label>¿Cuántas llegaron en realidad?</label><input type="number" id="corrQty" value="${prefill}"></div>
    <div class="small muted" style="margin-bottom:12px">Se ajustará el stock y lo invertido en esta compra según la diferencia — no afecta otras ventas o compras.</div>
    <button class="btn btn-primary btn-block" onclick="saveCorrectPurchaseLine('${purchaseId}',${idx})">Guardar corrección</button>
  `);
}
function saveCorrectPurchaseLine(purchaseId, idx){
  const pu = DB.purchases.find(p=>p.id===purchaseId);
  if(!pu) return;
  const l = pu.items[idx];
  const actualQty = parseFloat(document.getElementById('corrQty').value);
  if(isNaN(actualQty) || actualQty<0) return toast('Escribe una cantidad válida');
  const orderedQty = l.orderedQty!=null ? l.orderedQty : l.qty; // cantidad que se pidió originalmente, nunca cambia
  // Si ya existía una corrección previa de esta línea, se elimina para reemplazarla (evita acumular ajustes dobles)
  if(l.correctionAdjId){
    DB.stockAdjustments = DB.stockAdjustments.filter(a=>a.id!==l.correctionAdjId);
  }
  const diff = actualQty - orderedQty; // siempre contra lo pedido originalmente, no contra la corrección anterior
  let newAdjId = null;
  if(diff !== 0){
    newAdjId = uid();
    DB.stockAdjustments.push({id:newAdjId, productId:l.productId, delta:diff, reason:'Corrección de compra (Factura #'+pu.invoiceNo+')', ts:new Date().toISOString()});
  }
  pu.total = pu.total - (l.receivedQty!=null ? l.receivedQty*l.cost : orderedQty*l.cost) + (actualQty*l.cost);
  l.orderedQty = orderedQty;
  l.receivedQty = actualQty;
  l.correctionAdjId = newAdjId;
  l.corrected = true;
  recomputeStock();
  save();
  ui.closeSheet();
  toast(diff!==0 ? `Ajustado: ${diff>0?'+':''}${diff} unidad(es)` : 'Sin cambios');
  viewInvoice(purchaseId);
}
function buildWhatsappPurchaseText(pu, lines){
  let t = `🧾 *${DB.meta.bizName}*\nCompra / Factura #${pu.invoiceNo}\nFecha: ${pu.date}\nProveedor: ${pu.supplier||'—'}\n\n`;
  lines.forEach(l=> t += `• ${l.name} x${l.qty} — ${fmt(l.sub)}\n`);
  t += `\n*Total: ${fmt(pu.total)}*`;
  if(DB.settings.usdRate>0) t += ` (≈ ${usdEq(pu.total)})`;
  return t;
}
function copyToClipboard(text){
  navigator.clipboard? navigator.clipboard.writeText(text).then(()=>toast('Mensaje copiado')).catch(()=>fallbackCopy(text))
   : fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Mensaje copiado'); }catch(e){ toast('No se pudo copiar'); }
  document.body.removeChild(ta);
}

function addToCart(pid, qty){
  qty = Math.max(1, Math.floor(qty||1));
  const p = DB.products.find(p=>p.id===pid);
  if(!p) return;
  if(p.stock<=0) return toast('Sin stock disponible');
  let line = app.cart.find(l=>l.productId===pid);
  if(line){
    const newQty = line.qty + qty;
    if(newQty<=p.stock){ line.qty = newQty; } else { line.qty = p.stock; toast('Se ajustó al stock disponible'); }
  } else {
    line = {productId:pid, qty: Math.min(qty, p.stock), priceIndex:0};
    app.cart.push(line);
    if(qty>p.stock) toast('Se ajustó al stock disponible');
  }
  renderCart();
  toast(p.name+' agregado');
}

function updateCartSummary(){
  const summaryWrap = document.getElementById('cartSummary');
  if(!summaryWrap) return;
  let subtotal=0;
  app.cart.forEach(l=>{
    const p = DB.products.find(p=>p.id===l.productId);
    if(!p) return;
    const price = cartLinePrice(l, p);
    subtotal += price*l.qty;
  });
  const opts = app.saleOptions;
  const defaultPct = DB.settings.transferSurchargePct||0;
  const surchargePct = opts.payment==='transfer' ? (opts.transferPct!=null ? opts.transferPct : defaultPct) : defaultPct;
  const surchargeAmt = opts.payment==='transfer' ? subtotal*surchargePct/100 : 0;
  const deliveryFee = opts.delivery ? (parseFloat(opts.deliveryFee)||0) : 0;
  const total = subtotal + surchargeAmt + deliveryFee;
  summaryWrap.innerHTML = cartSummaryHtml(subtotal, surchargePct, surchargeAmt, deliveryFee, total);

function resetSaleOptions(){ app.saleOptions = {payment:'cash', delivery:false, deliveryFee:'', transferPct:null, clientId:null}; }
function changeQty(i, delta){
  const l = app.cart[i];
  const p = DB.products.find(p=>p.id===l.productId);
  const newQty = l.qty+delta;
  if(newQty<=0){ app.cart.splice(i,1); renderCart(); return; }
  if(newQty>p.stock){ toast('No hay más stock'); return; }
  l.qty = newQty;
  renderCart();
}
function setCartQty(i, val){
  const l = app.cart[i];
  const p = DB.products.find(p=>p.id===l.productId);
  let newQty = parseFloat(val)||0;
  if(newQty<=0){ app.cart.splice(i,1); renderCart(); return; }
  if(newQty>p.stock){ toast('No hay más stock (máx. '+p.stock+')'); newQty = p.stock; }
  l.qty = newQty;
  renderCart();
}
function bumpCartQty(i, n){
  const l = app.cart[i];
  const p = DB.products.find(p=>p.id===l.productId);
  let newQty = l.qty + n;
  if(newQty>p.stock){ toast('No hay más stock (máx. '+p.stock+')'); newQty = p.stock; }
  l.qty = newQty;
  renderCart();
}

function clientDebt(clientId){
  const owed = DB.sales.filter(s=>s.clientId===clientId).reduce((a,s)=>{
    if(s.payment==='credit') return a+s.total;
    if(s.payment==='mixed') return a + (s.items||[]).reduce((x,it)=>x+(it.creditQty||0)*it.price,0);
    return a;
  },0);
  const consignOwed = (DB.clientSales||[]).filter(s=>s.clientId===clientId).reduce((a,s)=>a+s.total,0);
  const paid = DB.clientPayments.filter(p=>p.clientId===clientId).reduce((a,p)=>a+p.amount,0);
  const adjustments = (DB.clientDebtAdjustments||[]).filter(a=>a.clientId===clientId).reduce((a,x)=>a+x.amount,0);
  return owed + consignOwed - paid + adjustments;
}

/* ---------------- CONSIGNACIÓN: mercancía depositada en clientes ---------------- */
function clientProductStockMap(clientId){
  const map = {};
  (DB.consignments||[]).filter(c=>c.clientId===clientId).forEach(c=> c.items.forEach(it=>{ map[it.productId]=(map[it.productId]||0)+it.qty; }));
  (DB.clientSales||[]).filter(s=>s.clientId===clientId).forEach(s=> s.items.forEach(it=>{ map[it.productId]=(map[it.productId]||0)-it.qty; }));
  (DB.clientReturns||[]).filter(r=>r.clientId===clientId).forEach(r=> r.items.forEach(it=>{ map[it.productId]=(map[it.productId]||0)-it.qty; }));
  return map;
}
function clientProductPriceKey(clientId, productId){ return clientId+'::'+productId; }
function getClientProductPrice(clientId, productId){
  return DB.clientProductPrices ? DB.clientProductPrices[clientProductPriceKey(clientId,productId)] : undefined;
}
function setClientProductPrice(clientId, productId, price){
  if(!DB.clientProductPrices) DB.clientProductPrices = {};
  DB.clientProductPrices[clientProductPriceKey(clientId,productId)] = price;
}

function addInvAdjLine(){

function saveInvAdjustment(clientId){
  if(!window._invAdjCart.length) return toast('Agrega al menos un producto');
  const stockMap = clientProductStockMap(clientId);
  const items = window._invAdjCart
    .map(l=>({productId:l.productId, qty: l.newQty - (stockMap[l.productId]||0)}))
    .filter(it=>it.qty!==0);
  if(!items.length){ toast('No hay cambios que guardar'); ui.closeSheet(); return; }
  DB.consignments.push({

    isInitialBalance:true, note:'Ajuste directo de inventario (no salió del almacén propio)',
    createdAt:new Date().toISOString()

    if(getClientProductPrice(clientId, it.productId)==null){
      const p = DB.products.find(p=>p.id===it.productId);

  });

  save();

  toast('Inventario del cliente actualizado');

function computeClientSaleTotal(){
  const clientId = window._clientSaleClientId;
  const stockMap = clientProductStockMap(clientId);
  let total=0;
  Object.keys(stockMap).forEach(pid=>{
    const el = document.getElementById('csQty_'+pid);
    if(!el) return;
    const qty = parseFloat(el.value)||0;
    const price = getClientProductPrice(clientId,pid)||0;
    total += qty*price;
  });
  const lbl = document.getElementById('csTotalLabel');
  if(lbl) lbl.textContent = fmt(total);
}
function saveClientReportedSale(clientId){
  const stockMap = clientProductStockMap(clientId);
  const items=[];
  let total=0;
  for(const pid of Object.keys(stockMap)){
    const el = document.getElementById('csQty_'+pid);
    if(!el) continue;
    const qty = parseFloat(el.value)||0;
    if(qty<=0) continue;
    if(qty>stockMap[pid]){ toast('Cantidad mayor a lo que tiene disponible'); return; }
    const price = getClientProductPrice(clientId,pid)||0;
    items.push({productId:pid, qty, price});
    total += qty*price;
  }
  if(!items.length) return toast('Escribe alguna cantidad vendida');
  const saleId = uid();
  const nowIso = new Date().toISOString();
  DB.clientSales.push({id:saleId, clientId, date:nowIso, items, total, createdAt:nowIso});
  // Antes esto quedaba como deuda pendiente hasta registrar un pago aparte. Ahora, tal como
  // se pidió, se considera cobrado en el mismo momento en que se reporta la venta — se
  // registra automáticamente el pago que compensa esa deuda, sin un paso extra.
  if(total>0){
    DB.clientPayments.push({id:uid(), clientId, amount:total, note:'Cobro automático de venta reportada', date:nowIso, createdAt:nowIso, autoFromSaleId:saleId});
  }
  save();
  ui.closeSheet();
  toast('Venta del cliente registrada y cobrada');
  openClientDetail(clientId);
}
