/* =========================================================
   REPORTES
   ========================================================= */
function viewReports(){
  const salesByProduct = {};
  DB.sales.forEach(s=>s.items.forEach(it=>{
    salesByProduct[it.productId] = (salesByProduct[it.productId]||0) + it.qty;
  }));
  const withSales = activeProducts().map(p=>({p, qty:salesByProduct[p.id]||0}));
  const best = withSales.slice().sort((a,b)=>b.qty-a.qty).slice(0,8);
  const worst = withSales.slice().sort((a,b)=>a.qty-b.qty).slice(0,8);
  const margin = activeProducts().map(p=>{
    const price = p.prices[0]?p.prices[0].price:0;
    return {p, margin: price - p.costPrice};
  }).sort((a,b)=>a.margin-b.margin).slice(0,8);

  function block(title, arr, valueFn){
    if(!arr.length) return `<div class="section-title">${title}</div><div class="empty" style="padding:20px"><div class="ed">Sin datos suficientes</div></div>`;
    return `<div class="section-title">${title}</div><div class="card">` +
      arr.map(x=>`<div class="list-item">${thumbHtml(x.p)}
        <div class="li-body"><div class="li-title">${esc(x.p.name)}</div></div>
        <div class="li-right"><div class="li-price mono">${valueFn(x)}</div></div></div>`).join('') + `</div>`;
  }
  return block('🏆 Más vendidos', best, x=>x.qty+' und.')
    + block('📉 Menos vendidos', worst, x=>x.qty+' und.')
    + block('⚠️ Menor margen de ganancia', margin, x=>fmt(x.margin));
}

function viewReminders(){
  const list = (DB.reminders||[]).slice().sort((a,b)=> (a.date+((a.time||'00:00'))).localeCompare(b.date+(b.time||'00:00')));
  const nowStr = new Date().toISOString().slice(0,16).replace('T',' ');
  let html = '';
  if(!('Notification' in window)){
    html += `<div class="card small muted">Este navegador no admite notificaciones. Los recordatorios igual se guardan y se muestran aquí y en Inicio.</div>`;
  } else if(Notification.permission!=='granted'){
    html += `<div class="card">
      <div class="small" style="margin-bottom:8px">Para que te avise mientras tienes la app abierta, activa las notificaciones.</div>
      <button class="btn btn-outline btn-block" onclick="requestNotifPermission()">🔔 Activar notificaciones</button>
      <div class="small muted mt-2">Aviso: solo funciona mientras la app está abierta en el teléfono — los navegadores no permiten que una página web despierte al teléfono estando cerrada. Para no perderte nada importante, revisa esta sección o la de Inicio.</div>
    </div>`;
  }
  if(!list.length){
    html += `<div class="empty"><div class="eic">⏰</div><div class="et">Sin recordatorios</div><div class="ed">Toca + para crear uno.</div></div>`;
    return html;
  }
  html += `<div class="card">`;
  list.forEach(r=>{
    const due = (r.date+' '+(r.time||'00:00')) <= nowStr;
    html += `<div class="list-item">
      <div class="thumb">${r.done?'✅':(due?'⏰':'🔔')}</div>
      <div class="li-body">
        <div class="li-title" style="${r.done?'text-decoration:line-through;opacity:.5':''}">${esc(r.title)}</div>
        <div class="li-sub">${r.date}${r.time?' · '+r.time:''} ${(!r.done && due)?'<span class="chip warn">pendiente</span>':''}</div>
      </div>
      <div class="gap-2">
        ${!r.done?`<button class="btn btn-ghost btn-sm" onclick="toggleReminder('${r.id}')">Hecho</button>`:''}
        <button class="btn btn-danger btn-sm" onclick="removeReminder('${r.id}')">✕</button>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function checkDueReminders(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const nowStr = new Date().toISOString().slice(0,16).replace('T',' ');

  (DB.reminders||[]).forEach(r=>{

  if(!p || qty<=0) return toast('Selecciona un producto y una cantidad');
  const costImpact = qty * (p.costPrice||0);
  DB.losses.push({id:uid(), productId:p.id, qty, reason, date, costImpact, createdAt:new Date().toISOString()});
  DB.stockAdjustments.push({id:uid(), productId:p.id, delta:-qty, reason:'Pérdida: '+reason, ts:new Date().toISOString()});
  recomputeStock();
  save();
  ui.closeSheet();
  toast('Pérdida registrada');
  renderView();
}

async function fetchEltoqueRate(){
  const key = (DB.settings.eltoqueApiKey||'').trim();
  if(!key){ toast('Ingresa tu clave de API de elTOQUE primero'); return; }
  toast('Consultando elTOQUE...');

      headers: { 'Authorization': 'Bearer '+key }
    });

    const data = await res.json();
    const usd = data && data.tasas && data.tasas.USD;
    if(!usd) throw new Error('Formato inesperado');
    DB.settings.usdRate = usd;
    DB.settings.usdRateUpdated = 'elTOQUE · '+todayISO();
    save();

    renderView();
  }catch(err){
    toast('No se pudo conectar. Actualiza el valor manualmente.');
  }
}

async function exportSyncFile(){
  const filename = `almacenpro_${DB.deviceId||'dispositivo'}_${Date.now()}.json`;
  const content = JSON.stringify(DB,null,2);
  const blob = new Blob([content], {type:'application/json'});
  if(navigator.share && navigator.canShare){
    try{
      const file = new File([blob], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'AlmacénPro · sincronización', text:'Archivo de sincronización de AlmacénPro'});
        return;
      }
    }catch(err){ /* cancelado o no soportado: seguimos con la descarga normal */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Archivo exportado. Envíalo por WhatsApp o Bluetooth desde tus Descargas.');
}

function mergeById(localArr, remoteArr){
  const map = {};
  (localArr||[]).forEach(x=> map[x.id]=x);
  let added=0;
  (remoteArr||[]).forEach(x=>{ if(!map[x.id]){ map[x.id]=x; added++; } });
  return {merged:Object.values(map), added};
}

/* ---------- Detección de casos que sí necesitan que el usuario decida ---------- */
function detectDeleteConflicts(localProducts, remoteProducts){
  const lMap = {}; localProducts.forEach(p=>lMap[p.id]=p);
  const rMap = {}; (remoteProducts||[]).forEach(p=>rMap[p.id]=p);
  const conflicts = [];
  Object.keys(lMap).forEach(id=>{
    const lp = lMap[id], rp = rMap[id];
    if(!rp) return;
    const lDel = !!lp.deletedAt, rDel = !!rp.deletedAt;
    if(lDel !== rDel){
      conflicts.push({type:'delete', productId:id, name:(lDel?lp.name:rp.name)||'(sin nombre)'});
    }
  });
  return conflicts;
}
function detectStockDupConflicts(localAdj, remoteAdj){
  const conflicts = [];
  const localIds = new Set((localAdj||[]).map(a=>a.id));
  const localManual = (localAdj||[]).filter(a=>a.reason==='Ajuste manual');
  const remoteNewManual = (remoteAdj||[]).filter(a=> a.reason==='Ajuste manual' && !localIds.has(a.id));
  remoteNewManual.forEach(ra=>{
    const match = localManual.find(la=> la.productId===ra.productId && Math.abs(new Date(la.ts)-new Date(ra.ts)) < 48*3600*1000);
    if(match){
      conflicts.push({type:'stockdup', productId:ra.productId, localAdjId:match.id, remoteAdjId:ra.id, localDelta:match.delta, remoteDelta:ra.delta});
    }
  });
  return conflicts;
}
function conflictKey(c){
  if(c.type==='stockdup') return c.type+':'+c.productId+':'+c.remoteAdjId;
  if(c.type==='oversell') return c.type+':'+c.productId;
  return c.type+':'+c.productId;
}

/* ---------- Sobregiro de stock: reconstruir la línea de tiempo exacta de un producto ---------- */
function buildProductTimeline(productId, purchases, sales, adjustments){
  const events = [];
  (purchases||[]).forEach(pu=> (pu.items||[]).forEach(it=>{
    if(it.productId===productId) events.push({ts:pu.createdAt||pu.date, qty:it.qty, kind:'compra', ref:pu.id});
  }));
  (sales||[]).forEach(s=> (s.items||[]).forEach((it,idx)=>{
    if(it.productId===productId) events.push({ts:s.date, qty:-it.qty, kind:'venta', ref:s.id, itemIndex:idx, totalQtyInSale:it.qty});
  }));
  (adjustments||[]).forEach(a=>{
    if(a.productId===productId) events.push({ts:a.ts, qty:a.delta, kind:'ajuste', ref:a.id, reason:a.reason});
  });
  events.sort((a,b)=> new Date(a.ts) - new Date(b.ts));
  let bal = 0, culprit = null, balanceBeforeCulprit = 0;
  events.forEach(e=>{
    const before = bal;
    bal += e.qty;
    e.balanceAfter = bal;
    if(bal<0 && !culprit){ culprit = e; balanceBeforeCulprit = before; }
  });
  return {events, finalBalance:bal, culprit, balanceBeforeCulprit};
}
function detectOversellConflicts(remote){
  const purchases = mergeById(DB.purchases, remote.purchases).merged;
  const sales = mergeById(DB.sales, remote.sales).merged;
  const adjustments = mergeById(DB.stockAdjustments, remote.stockAdjustments).merged;
  const productIds = new Set(DB.products.map(p=>p.id).concat((remote.products||[]).map(p=>p.id)));
  const conflicts = [];
  productIds.forEach(pid=>{
    const tl = buildProductTimeline(pid, purchases, sales, adjustments);
    if(tl.finalBalance < 0 && tl.culprit){
      conflicts.push({
        type:'oversell', productId:pid, deficit:-tl.finalBalance,
        balanceBeforeCulprit: tl.balanceBeforeCulprit,
        culprit: tl.culprit
      });
    }
  });
  return conflicts;
}
function fmtTime(ts){ try{ return new Date(ts).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }catch(e){ return ts; } }

function syncCounts(remote){
  function newCount(key){ const localIds = new Set((DB[key]||[]).map(x=>x.id)); return (remote[key]||[]).filter(x=>!localIds.has(x.id)).length; }
  const localProdIds = new Set(DB.products.map(p=>p.id));
  return {
    ventas:newCount('sales'), compras:newCount('purchases'), gastos:newCount('expenses'),
    caja:newCount('cashCounts'), notas:newCount('notes'), eventos:newCount('events'),
    recordatorios:newCount('reminders'), perdidas:newCount('losses'),
    productos:(remote.products||[]).filter(p=>!localProdIds.has(p.id)).length
  };
}

function openSyncReview(remote){
  if(!remote || !remote.deviceId){ toast('Archivo de sincronización inválido'); return; }
  if(remote.deviceId === DB.deviceId){ toast('Ese archivo es de este mismo dispositivo'); return; }
  window._syncRemote = remote;
  window._syncConflicts = [
    ...detectDeleteConflicts(DB.products, remote.products||[]),
    ...detectStockDupConflicts(DB.stockAdjustments, remote.stockAdjustments||[]),
    ...detectOversellConflicts(remote)
  ];
  window._syncDecisions = {};
  renderSyncReview();
}
function renderSyncReview(){
  const remote = window._syncRemote;
  const conflicts = window._syncConflicts;
  const counts = syncCounts(remote);
  const parts = [];
  if(counts.ventas) parts.push(counts.ventas+' venta(s)');
  if(counts.compras) parts.push(counts.compras+' compra(s)');
  if(counts.productos) parts.push(counts.productos+' producto(s) nuevo(s)');
  if(counts.gastos) parts.push(counts.gastos+' gasto(s)');
  if(counts.caja) parts.push(counts.caja+' conteo(s) de caja');
  if(counts.notas) parts.push(counts.notas+' nota(s)');
  if(counts.eventos) parts.push(counts.eventos+' evento(s)');
  if(counts.recordatorios) parts.push(counts.recordatorios+' recordatorio(s)');
  if(counts.perdidas) parts.push(counts.perdidas+' pérdida(s) de producto');
  const summaryText = parts.length? parts.join(', ')+' se combinarán automáticamente.' : 'No hay registros nuevos para combinar.';

  let html = `
    <div class="sheet-header"><div class="sheet-title">Revisar sincronización</div><button class="sheet-close" onclick="ui.closeSheet()">✕</button></div>
    <div class="card"><div class="small">✅ ${summaryText}</div></div>`;

  if(conflicts.length){
    html += `<div class="section-title">Necesita tu decisión (${conflicts.length})</div>`;
    conflicts.forEach(c=>{
      const key = conflictKey(c);
      const decided = window._syncDecisions[key];
      if(c.type==='delete'){
        html += `<div class="card">
          <div class="small" style="margin-bottom:10px">🗑️ <b>${esc(c.name)}</b>: está eliminado en un teléfono y activo en el otro.</div>
          <div class="gap-2">
            <button class="btn ${decided==='delete'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="resolveSyncConflict('${key}','delete')">Eliminar</button>
            <button class="btn ${decided==='keep'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="resolveSyncConflict('${key}','keep')">Mantener activo</button>
          </div>
        </div>`;
      } else if(c.type==='stockdup'){
        const pName = (DB.products.find(p=>p.id===c.productId)||(remote.products||[]).find(p=>p.id===c.productId)||{}).name || 'Producto';
        html += `<div class="card">
          <div class="small" style="margin-bottom:10px">⚠️ <b>${esc(pName)}</b>: el stock se ajustó dos veces cerca de la misma hora (${c.localDelta>0?'+':''}${c.localDelta} y ${c.remoteDelta>0?'+':''}${c.remoteDelta}). ¿Fue la misma corrección contada dos veces?</div>
          <div class="gap-2">
            <button class="btn ${decided==='once'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="resolveSyncConflict('${key}','once')">Sí, aplicar solo una</button>
            <button class="btn ${decided==='both'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="resolveSyncConflict('${key}','both')">No, son distintas</button>
          </div>
        </div>`;
      } else if(c.type==='oversell'){
        const pName = (DB.products.find(p=>p.id===c.productId)||(remote.products||[]).find(p=>p.id===c.productId)||{}).name || 'Producto';
        const cul = c.culprit;
        const culLabel = cul.kind==='venta' ? 'Se vendieron '+cul.totalQtyInSale+' unidades' : (cul.kind==='ajuste' ? 'Ajuste de '+cul.qty : 'Movimiento');
        html += `<div class="card">
          <div class="small" style="margin-bottom:8px">⚠️ <b>${esc(pName)}</b>: al combinar las ventas de los dos teléfonos, quedó en <b style="color:var(--danger)">${-c.deficit}</b> (faltan ${c.deficit} unidad${c.deficit>1?'es':''}).</div>
          <div class="wa-preview" style="margin-bottom:10px">Antes había ${c.balanceBeforeCulprit} disponibles.
${culLabel} a las ${fmtTime(cul.ts)} → esto deja el faltante de ${c.deficit}.</div>
          <div class="small muted" style="margin-bottom:8px">¿Qué pasó en realidad?</div>
          <div class="stack">
            <button class="btn ${decided==='zero'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="resolveSyncConflict('${key}','zero')">No había más — ajustar a 0</button>
            <button class="btn ${decided==='addstock'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="resolveSyncConflict('${key}','addstock')">Sí tenía ${c.deficit} más — se me olvidó registrarlo</button>
            <button class="btn ${decided==='fixsale'?'btn-primary':'btn-outline'} btn-block btn-sm" onclick="resolveSyncConflict('${key}','fixsale')">Esa venta de las ${fmtTime(cul.ts)} estuvo mal — corregirla</button>
          </div>
        </div>`;
      }
    });
  }

  html += `<button class="btn btn-primary btn-block mt-3" onclick="confirmSync()">✅ Confirmar sincronización</button>`;
  ui.openSheet(html);
}
function resolveSyncConflict(key, choice){
  window._syncDecisions[key] = choice;
  renderSyncReview();
}
function confirmSync(){
  const conflicts = window._syncConflicts;
  const unresolved = conflicts.filter(c=>!window._syncDecisions[conflictKey(c)]);
  if(unresolved.length){ toast('Resuelve los '+unresolved.length+' caso(s) marcados antes de continuar'); return; }
  applySync(window._syncRemote, window._syncDecisions, conflicts);
}

function applySync(remote, decisions, conflicts){
  let addedCount = 0;

  ['purchases','sales','expenses','cashCounts','notes','events','reminders','losses'].forEach(key=>{
    const r = mergeById(DB[key], remote[key]);
    DB[key] = r.merged;
    addedCount += r.added;
  });

  // Ajustes de stock: si el usuario marcó un par como duplicado, no se agrega el del otro teléfono
  const skipIds = new Set(conflicts.filter(c=>c.type==='stockdup' && decisions[conflictKey(c)]==='once').map(c=>c.remoteAdjId));
  const filteredRemoteAdj = (remote.stockAdjustments||[]).filter(a=>!skipIds.has(a.id));
  const rAdj = mergeById(DB.stockAdjustments, filteredRemoteAdj);
  DB.stockAdjustments = rAdj.merged;
  addedCount += rAdj.added;

  // Categorías y subcategorías: unir por id
  const catMap = {};
  DB.categories.forEach(c=> catMap[c.id]=c);
  (remote.categories||[]).forEach(rc=>{
    if(!catMap[rc.id]){ catMap[rc.id]=rc; addedCount++; }
    else{
      const subMap = {};
      catMap[rc.id].subs.forEach(s=> subMap[s.id]=s);
      (rc.subs||[]).forEach(rs=>{ if(!subMap[rs.id]){ catMap[rc.id].subs.push(rs); addedCount++; } });
    }
  });
  DB.categories = Object.values(catMap);

  // Productos: unir por id. Si hubo conflicto de eliminado/activo, se aplica lo que decidió el usuario.
  const deleteDecision = {};
  conflicts.filter(c=>c.type==='delete').forEach(c=>{ deleteDecision[c.productId] = decisions[conflictKey(c)]; });

  const prodMap = {};
  DB.products.forEach(p=> prodMap[p.id]=p);
  (remote.products||[]).forEach(rp=>{
    const lp = prodMap[rp.id];
    if(!lp){ prodMap[rp.id]=rp; addedCount++; return; }
    const decision = deleteDecision[rp.id];
    const lt = lp.updatedAt||lp.createdAt||'';
    const rt = rp.updatedAt||rp.createdAt||'';
    let merged = (rt > lt) ? Object.assign({}, rp) : Object.assign({}, lp);
    if(decision){
      merged.deletedAt = decision==='delete' ? (lp.deletedAt || rp.deletedAt || new Date().toISOString()) : null;
    }
    merged.stock = lp.stock;
    prodMap[rp.id] = merged;
  });
  DB.products = Object.values(prodMap);

  DB.invoiceCounter = Math.max(DB.invoiceCounter||1001, remote.invoiceCounter||1001);
  recomputeStock();

  // Sobregiros: aplicar lo que el usuario decidió para cada producto que quedó en negativo
  const noteLines = [];
  conflicts.filter(c=>c.type==='oversell').forEach(c=>{
    const key = conflictKey(c);
    const choice = decisions[key];
    const p = DB.products.find(p=>p.id===c.productId);
    const pName = p? p.name : 'Producto';
    const cul = c.culprit;
    let resultLine = '';
    if(choice==='zero'){
      DB.stockAdjustments.push({id:uid(), productId:c.productId, delta:c.deficit, reason:'Ajuste por sobregiro (a 0)', ts:new Date().toISOString()});
      resultLine = `Se ajustó a 0: no había más existencia real.`;
    } else if(choice==='addstock'){
      DB.stockAdjustments.push({id:uid(), productId:c.productId, delta:c.deficit, reason:'Ajuste por sobregiro (unidad no registrada)', ts:new Date().toISOString()});
      resultLine = `Se agregaron ${c.deficit} unidad(es) al almacén: sí existían pero no se habían registrado.`;
    } else if(choice==='fixsale' && cul.kind==='venta'){
      const sale = DB.sales.find(s=>s.id===cul.ref);
      if(sale){
        const item = sale.items[cul.itemIndex];
        if(item){
          const newQty = Math.max(0, item.qty - c.deficit);
          item.qty = newQty;
          sale.total = sale.items.reduce((a,it)=>a+it.qty*it.price,0);
        }
      }
      resultLine = `Se corrigió la venta de las ${fmtTime(cul.ts)}: se registraron ${c.deficit} unidad(es) de menos.`;
    }
    noteLines.push(`🧾 ${pName} — sobregiro de ${c.deficit} unidad(es) detectado al sincronizar.\nAntes había ${c.balanceBeforeCulprit} disponibles. Venta de las ${fmtTime(cul.ts)} dejó el faltante.\nDecisión: ${resultLine}`);
  });
  conflicts.filter(c=>c.type==='delete').forEach(c=>{
    const choice = decisions[conflictKey(c)];
    noteLines.push(`🗑️ ${c.name} — estaba eliminado en un teléfono y activo en el otro. Decisión: ${choice==='delete'?'se eliminó':'se mantuvo activo'}.`);
  });
  conflicts.filter(c=>c.type==='stockdup').forEach(c=>{
    const choice = decisions[conflictKey(c)];
    const pName = (DB.products.find(p=>p.id===c.productId)||{}).name || 'Producto';
    noteLines.push(`⚠️ ${pName} — posible ajuste de stock duplicado (${c.localDelta} y ${c.remoteDelta}). Decisión: ${choice==='once'?'se aplicó solo una vez':'se aplicaron las dos, eran distintas'}.`);
  });
  if(noteLines.length){
    DB.notes.push({
      id:uid(), date:todayISO(),
      text:`Resumen de sincronización (${nowStamp()}):\n\n`+noteLines.join('\n\n')
    });
  }

  recomputeStock();
  save();
  ui.closeSheet();
  DB.lastSyncAt = nowStamp();
  save();
  toast(addedCount>0? `Sincronizado: ${addedCount} registro(s) combinado(s)` : 'Ya estaba todo sincronizado');
  renderView();
}

document.getElementById('restoreInputHidden').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!confirm('Esto reemplazará todos los datos actuales. ¿Continuar?')){ e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = JSON.parse(ev.target.result);
      DB = mergeWithDefaults(data);
      recomputeStock();
      save(); applySettings(); renderView();
      toast('Datos restaurados');
    }catch(err){ toast('Archivo inválido'); }
  };
  reader.readAsText(file);
  e.target.value='';
});
function resetApp(){
  if(!confirm('Esto borrará TODOS los datos (productos, ventas, compras, etc). ¿Seguro?')) return;
  if(!confirm('Última confirmación: esta acción no se puede deshacer. ¿Restablecer todo?')) return;
  DB = defaultDB();
  save(); applySettings(); toast('Aplicación restablecida'); app.go('home');
}

applySettings();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
</script>
